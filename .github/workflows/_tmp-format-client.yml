name: Temporary client format diff

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show client Prettier diff
        run: |
          npx prettier --write apps/extension/src/messaging/client.ts
          git diff -- apps/extension/src/messaging/client.ts
