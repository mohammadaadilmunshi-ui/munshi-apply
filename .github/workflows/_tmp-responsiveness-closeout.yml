name: Temporary responsiveness closeout

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Apply surgical responsiveness transforms
        run: python3 .github/scripts/_tmp_responsiveness_closeout.py
      - run: npm ci
      - name: Format affected files
        run: |
          npx prettier --write \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/messaging/client-responsiveness.test.ts \
            apps/extension/src/storage/cloud.ts \
            apps/extension/src/storage/cloud-responsiveness.test.ts \
            apps/extension/src/sidepanel/App.tsx
      - name: Full repository check
        run: npm run check
      - name: Commit verified closeout
        run: |
          rm .github/workflows/_tmp-responsiveness-closeout.yml
          rm .github/scripts/_tmp_responsiveness_closeout.py
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -A
          git commit -m "fix: make profile and fill paths local-first"
          git push origin HEAD:feat/v3-foundation-alignment
