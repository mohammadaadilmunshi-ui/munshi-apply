name: Add application model dependency

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --workspace @munshi-apply/extension @munshi-apply/application-model@0.1.0 --save-exact
      - run: npx prettier --write apps/extension/package.json package-lock.json
      - name: Commit dependency update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/package.json package-lock.json
          git commit -m "build: add application model to extension"
          git push origin HEAD:feat/v3-foundation-alignment
