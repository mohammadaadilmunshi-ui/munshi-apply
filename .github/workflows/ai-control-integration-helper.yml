name: AI control integration helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate-and-certify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/v3-foundation-alignment'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guarded PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Guard exact AI tranche parent
        run: |
          test "$(git rev-parse HEAD^)" = "0943acb1395e5368482f30abcc29445edd87392d"
          test "$(git branch --show-current)" = "feat/v3-foundation-alignment"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -e './apps/native-host[dev]'

      - name: Integrate AI view and certification repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one match in {path}, found {count}: {old[:90]}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          app = Path('apps/extension/src/sidepanel/App.tsx')
          app_replacements = [
              (
                  'type View = "application" | "profile" | "diagnostics";',
                  'type View = "application" | "profile" | "ai" | "diagnostics";',
              ),
              (
                  '} from "../storage/cloud";\n',
                  '} from "../storage/cloud";\nimport { AIControlCenter } from "./AIControlCenter";\n',
              ),
              (
                  '(["application", "profile", "diagnostics"] as const)',
                  '(["application", "profile", "ai", "diagnostics"] as const)',
              ),
              (
                  '  hardStop: true,\n  keyConfigured: false,',
                  '  hardStop: true,\n  allowApplicationDrafts: false,\n  allowProfileEvidence: true,\n  allowResumeEvidence: true,\n  keyConfigured: false,',
              ),
              (
                  '          <div className="cloud-pairing">\n            <h3>AI & API control center</h3>',
                  '          <div hidden>\n            <h3>AI & API control center</h3>',
              ),
          ]
          text = app.read_text(encoding='utf-8')
          for old, new in app_replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected exactly one App.tsx match, found {count}: {old[:90]}'
                  )
              text = text.replace(old, new, 1)
          marker = '      {view === "diagnostics" && (\n'
          if text.count(marker) != 1:
              raise SystemExit('diagnostics view marker is not unique')
          ai_view = (
              '      {view === "ai" && (\n'
              '        <AIControlCenter nativeAvailable={native.status === "healthy"} />\n'
              '      )}\n\n'
          )
          app.write_text(text.replace(marker, ai_view + marker, 1), encoding='utf-8')

          budget_store = Path(
              'apps/native-host/src/munshi_apply_native/ai_budget_store.py'
          )
          replace_once(
              budget_store,
              '                       COALESCE(SUM(CASE WHEN estimated = 1 THEN cost_usd ELSE 0 END), 0) AS estimated_cost\n',
              '                       COALESCE(\n'
              '                           SUM(CASE WHEN estimated = 1 THEN cost_usd ELSE 0 END),\n'
              '                           0\n'
              '                       ) AS estimated_cost\n',
          )

          database_test = Path('apps/native-host/tests/test_database.py')
          replace_once(
              database_test,
              '        "005_profile_snapshot_ordering.sql",\n    ]\n    assert database.migrate() == []\n',
              '        "005_profile_snapshot_ordering.sql",\n'
              '        "006_ai_budget_reservations.sql",\n'
              '    ]\n'
              '    assert database.migrate() == []\n',
          )
          replace_once(
              database_test,
              '    assert health["migration_count"] == 5\n    assert health["schema_version"] == "005_profile_snapshot_ordering.sql"\n',
              '    assert health["migration_count"] == 6\n'
              '    assert health["schema_version"] == "006_ai_budget_reservations.sql"\n',
          )
          replace_once(
              database_test,
              '            "ai_usage",\n            "interaction_recipes",\n',
              '            "ai_usage",\n'
              '            "ai_budget_reservations",\n'
              '            "interaction_recipes",\n',
          )

          operations_test = Path('apps/native-host/tests/test_operations.py')
          replace_once(
              operations_test,
              '        "005_profile_snapshot_ordering.sql",\n    ]\n    assert json.loads(second.stdout)["applied"] == []\n',
              '        "005_profile_snapshot_ordering.sql",\n'
              '        "006_ai_budget_reservations.sql",\n'
              '    ]\n'
              '    assert json.loads(second.stdout)["applied"] == []\n',
          )

          api_test = Path('apps/native-host/tests/test_api.py')
          replace_once(
              api_test,
              '        assert health.json()["schema_version"] == "005_profile_snapshot_ordering.sql"\n',
              '        assert health.json()["schema_version"] == "006_ai_budget_reservations.sql"\n',
          )

          governance_test = Path('apps/native-host/tests/test_ai_governance.py')
          governance_text = governance_test.read_text(encoding='utf-8')
          target = '0.001'
          if governance_text.count(target) != 3:
              raise SystemExit(
                  f'expected exactly three race-test budget values, found {governance_text.count(target)}'
              )
          governance_test.write_text(
              governance_text.replace(target, '0.005'), encoding='utf-8'
          )
          PY

      - name: Apply authoritative formatting
        run: |
          npx prettier --write \
            apps/extension/src/sidepanel/App.tsx \
            apps/extension/src/sidepanel/AIControlCenter.tsx \
            apps/extension/src/messaging/native.ts \
            apps/extension/src/messaging/native-ai.test.ts \
            .github/workflows/ai-control-integration-helper.yml
          python -m ruff format apps/native-host
          python -m ruff check --fix apps/native-host
          python -m ruff check apps/native-host

      - name: Verify complete extension tranche
        run: npm run check

      - name: Verify complete native tranche
        run: python -m pytest apps/native-host

      - name: Remove temporary helper and commit exact result
        run: |
          rm .github/workflows/ai-control-integration-helper.yml
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: certify AI control governance tranche"
          git push origin HEAD:feat/v3-foundation-alignment
