name: Application queue repair helper

on:
  push:
    branches: [feat/v3-foundation-alignment]

permissions:
  contents: write

jobs:
  repair-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guarded PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0

      - name: Guard exact application-queue staging
        shell: bash
        run: |
          set -euo pipefail
          BASE=9d9af9f92136418f07520e3e6323c4cef0ab792e
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 7
          test "${changed[0]}" = ".github/workflows/application-queue-fix-helper.yml"
          test "${changed[1]}" = "apps/extension/src/storage/cloud-application.test.ts"
          test "${changed[2]}" = "apps/owner-workspace/app/application-eligibility.ts"
          test "${changed[3]}" = "apps/owner-workspace/tests/application-eligibility.test.mjs"
          test "${changed[4]}" = "packages/application-model/src/application-detection.test.ts"
          test "${changed[5]}" = "packages/application-model/src/application-detection.ts"
          test "${changed[6]}" = "scripts/apply-application-queue-fix.py"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install extension dependencies
        run: npm ci

      - name: Apply guarded repair
        run: python3 scripts/apply-application-queue-fix.py

      - name: Apply authoritative formatting
        run: |
          npx prettier --write \
            .github/workflows/application-queue-fix-helper.yml \
            apps/extension/src/storage/cloud.ts \
            apps/extension/src/storage/cloud-application.test.ts \
            packages/application-model/src/index.ts \
            packages/application-model/src/application-detection.ts \
            packages/application-model/src/application-detection.test.ts \
            apps/owner-workspace/app/application-eligibility.ts \
            apps/owner-workspace/app/workspace/mobile-workspace.tsx \
            apps/owner-workspace/tests/application-eligibility.test.mjs

      - name: Verify extension and shared packages
        run: npm run check

      - name: Verify hosted owner workspace
        working-directory: apps/owner-workspace
        run: |
          npm ci
          npm run lint
          npm test

      - name: Remove temporary repair machinery
        run: |
          git rm -f scripts/apply-application-queue-fix.py
          git rm -f .github/workflows/application-queue-fix-helper.yml

      - name: Commit exact certified repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -A
          git commit -m "fix: stop non-application queue pollution"
          git push origin HEAD:feat/v3-foundation-alignment
