# MUNSHI_APPLY_STAGING_WORKFLOW_REGISTRATION_ONLY_V1
#
# This file exists on the repository default branch only so GitHub registers
# the manually dispatchable Apply staging workflow path.
#
# It intentionally performs NO deployment. The real staging deployment
# workflow is executed only when this registered workflow is dispatched with
# --ref feat/apply-staging-transport-bootstrap-20260916, where the CI-proven
# implementation lives.
name: Apply Netcup Staging Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character Git SHA to deploy to isolated Apply staging"
        required: true
        type: string
      source_branch:
        description: "Apply branch that must contain the requested SHA"
        required: true
        default: "feat/apply-staging-transport-bootstrap-20260916"
        type: string

permissions:
  contents: read

jobs:
  registration-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deployment from default-branch registration stub
        shell: bash
        run: |
          set -euo pipefail
          echo "This is the inert MUNSHI Apply staging workflow registration stub."
          echo "No staging or production deployment is permitted from main."
          echo "Dispatch this workflow with --ref feat/apply-staging-transport-bootstrap-20260916."
          echo "RESULT=APPLY_REGISTRATION_STUB_REFUSED_DEPLOYMENT"
          exit 64
