name: Apply Production Release Validation
# Full-production validation for the initial dashboard activation release.

on:
  push:
    branches:
      - "release/apply-production-full-activation-v15-20260918"
      - "release/apply-production-full-activation-v18-stdin-20260918"
      - "release/apply-production-full-activation-v19-cwd-20260918"
  pull_request:
    paths:
      - "deploy/production/**"
      - "deploy/netcup/deploy_apply_production_release.sh"
      - "deploy/netcup/verify_apply_production_runtime_contract.sh"
      - "deploy/netcup/activate_apply_production_submit.sh"
      - "apps/native-host/src/munshi_apply_native/internal_http_policy.py"
      - "apps/native-host/src/munshi_apply_native/hosted_submit_worker.py"
      - "apps/native-host/tests/test_internal_http_policy.py"
      - "apps/native-host/tests/test_production_deployment_contract.py"
      - "apps/native-host/tests/test_hosted_submit_worker.py"
      - ".github/workflows/apply-production-release-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native host test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './apps/native-host[dev]'
      - name: Validate production shell transport
        run: |
          bash -n deploy/netcup/deploy_apply_production_release.sh
          bash -n deploy/netcup/verify_apply_production_runtime_contract.sh
          bash -n deploy/netcup/activate_apply_production_submit.sh
      - name: Run production activation regression suite
        run: |
          pytest -q             apps/native-host/tests/test_internal_http_policy.py             apps/native-host/tests/test_production_deployment_contract.py             apps/native-host/tests/test_hosted_submit_worker.py             apps/native-host/tests/test_hosted_submit_worker_resilience.py             apps/native-host/tests/test_production_submission_verification_determinism.py             apps/native-host/tests/test_submit_authority_inbox.py             apps/native-host/tests/test_submit_authority_contract_vector.py
      - name: Build exact production image and run the deploy-time suite
        run: |
          docker build -f deploy/production/Dockerfile --build-arg MUNSHI_APPLY_COMMIT_SHA="$GITHUB_SHA" -t munshi-apply-ci:"$GITHUB_SHA" .
          docker run --rm --network none --read-only \
            --tmpfs /data:rw,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --tmpfs /home/munshiapply:rw,nosuid,nodev,size=128m \
            --entrypoint python munshi-apply-ci:"$GITHUB_SHA" \
            -m pytest -q \
            /app/apps/native-host/tests/test_internal_http_policy.py \
            /app/apps/native-host/tests/test_production_deployment_contract.py \
            /app/apps/native-host/tests/test_hosted_submit_worker.py \
            /app/apps/native-host/tests/test_hosted_submit_worker_resilience.py \
            /app/apps/native-host/tests/test_production_submission_verification_determinism.py \
            /app/apps/native-host/tests/test_submit_authority_inbox.py \
            /app/apps/native-host/tests/test_submit_authority_contract_vector.py
