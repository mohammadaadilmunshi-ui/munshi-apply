name: Architecture batch formatter

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the current architecture batch
        run: |
          npx prettier --write \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/fill.test.ts \
            packages/application-model/src/evidence.ts \
            packages/application-model/src/evidence.test.ts \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/resolver.test.ts \
            packages/application-model/src/index.ts \
            packages/contracts/src/profile-vault.ts \
            packages/contracts/src/profile-vault.test.ts \
            packages/contracts/package.json \
            packages/shared/src/review-backlog.ts \
            packages/shared/src/review-backlog.test.ts \
            packages/shared/src/index.ts
      - name: Commit canonical formatter output if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/fill.test.ts \
            packages/application-model/src/evidence.ts \
            packages/application-model/src/evidence.test.ts \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/resolver.test.ts \
            packages/application-model/src/index.ts \
            packages/contracts/src/profile-vault.ts \
            packages/contracts/src/profile-vault.test.ts \
            packages/contracts/package.json \
            packages/shared/src/review-backlog.ts \
            packages/shared/src/review-backlog.test.ts \
            packages/shared/src/index.ts
          git commit -m "style: format architecture remediation batch"
          git push origin HEAD:feat/v3-foundation-alignment
