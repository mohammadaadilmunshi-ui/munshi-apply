name: Autofill core hardening helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  integrate-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guarded PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0

      - name: Guard exact autofill helper staging
        shell: bash
        run: |
          set -euo pipefail
          BASE=bd303154348e4c56784ec168675c385c11371e7b
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE"..HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/autofill-core-hardening-helper.yml"
          test "${changed[1]}" = "scripts/apply-autofill-core-hardening.py"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Narrow ambiguous patch anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-autofill-core-hardening.py")
          content = path.read_text()

          marker = "\n\n# Contracts: preserve backward compatibility"
          helper = '''\n\ndef replace_first(path: str, old: str, new: str) -> None:\n    content = read(path)\n    if old not in content:\n        raise RuntimeError(f"Expected a match in {path}: {old[:120]!r}")\n    write(path, content.replace(old, new, 1))\n'''
          if marker not in content:
              raise SystemExit("helper insertion marker missing")
          content = content.replace(marker, helper + marker, 1)

          input_patch = '''replace_once(\n    "apps/extension/src/content/fill.ts",\n    \'\'\'    const original = element.value;\\n    element.focus();\\n    setNativeValue(element, value);\'\'\','''
          if content.count(input_patch) != 1:
              raise SystemExit("generic input patch marker is not unique")
          content = content.replace(
              input_patch,
              input_patch.replace("replace_once", "replace_first", 1),
              1,
          )

          controller_old = '''replace_once(\n    "apps/extension/src/background/autopilot-controller.ts",\n    \'\'\'          actionDeadlineAt: this.deadline(FILL_TIMEOUT_MS),\\n        });\'\'\',\n    \'\'\'          actionDeadlineAt: this.deadline(FILL_TIMEOUT_MS),\\n          lastFillResult:\\n            results.find(\\n              (result) =>\\n                result.controlId === plan.action.instruction.controlId,\\n            ) ?? null,\\n        });\'\'\',\n)'''
          controller_new = '''replace_once(\n    "apps/extension/src/background/autopilot-controller.ts",\n    \'\'\'          waitingFor: "FILL",\\n          beforeNavigation: null,\\n          dispatchingFillControlId: null,\\n          actionDeadlineAt: this.deadline(FILL_TIMEOUT_MS),\\n        });\'\'\',\n    \'\'\'          waitingFor: "FILL",\\n          beforeNavigation: null,\\n          dispatchingFillControlId: null,\\n          actionDeadlineAt: this.deadline(FILL_TIMEOUT_MS),\\n          lastFillResult:\\n            results.find(\\n              (result) =>\\n                result.controlId === plan.action.instruction.controlId,\\n            ) ?? null,\\n        });\'\'\',\n)'''
          if content.count(controller_old) != 1:
              raise SystemExit("verified-fill result patch marker is not unique")
          content = content.replace(controller_old, controller_new, 1)
          path.write_text(content)
          PY

      - name: Apply autofill core hardening
        run: python scripts/apply-autofill-core-hardening.py

      - name: Apply authoritative formatting
        run: |
          npx prettier --write \
            packages/contracts/src/index.ts \
            packages/application-model/src/autopilot.ts \
            packages/application-model/src/autopilot-dependent.test.ts \
            apps/extension/src/content/adaptive.ts \
            apps/extension/src/content/autofill-advanced.test.ts \
            apps/extension/src/content/bootstrap.ts \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/multi-select.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/storage/vault.ts \
            apps/extension/src/background/autopilot-controller.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/sidepanel/autopilot-plan.ts \
            apps/extension/src/sidepanel/AutoPilotControlCenter.tsx \
            apps/extension/public/manifest.json

      - name: Verify complete extension tranche
        run: npm run check

      - name: Remove temporary autofill helper
        run: |
          git rm -f scripts/apply-autofill-core-hardening.py
          git rm -f .github/workflows/autofill-core-hardening-helper.yml

      - name: Commit exact certified tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -- \
            packages/contracts/src/index.ts \
            packages/application-model/src/autopilot.ts \
            packages/application-model/src/autopilot-dependent.test.ts \
            apps/extension/src/content/adaptive.ts \
            apps/extension/src/content/autofill-advanced.test.ts \
            apps/extension/src/content/bootstrap.ts \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/multi-select.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/storage/vault.ts \
            apps/extension/src/background/autopilot-controller.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/sidepanel/autopilot-plan.ts \
            apps/extension/src/sidepanel/AutoPilotControlCenter.tsx \
            apps/extension/public/manifest.json \
            scripts/apply-autofill-core-hardening.py \
            .github/workflows/autofill-core-hardening-helper.yml
          git diff --cached --stat
          git commit -m "feat: harden universal autofill runtime"
          git push origin HEAD:feat/v3-foundation-alignment
