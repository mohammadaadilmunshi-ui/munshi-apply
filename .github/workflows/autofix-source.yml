name: Temporary source autofix

on:
  push:
    branches: [feat/v3-foundation-alignment]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: python -m ruff check apps/native-host --fix
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src apps/native-host
          git commit -m "style: apply canonical source formatting"
          git push origin HEAD:feat/v3-foundation-alignment
