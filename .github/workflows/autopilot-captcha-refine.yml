name: One-time passive CAPTCHA diagnostic refinement

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/autopilot-captcha-refine.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Refine passive CAPTCHA detection and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path('apps/extension/src/content/scanner.ts')
          scanner = scanner_path.read_text()
          old = '''function hasActiveCaptchaFrame(): boolean {
            const frames = Array.from(
              document.querySelectorAll(
                "iframe[src*='recaptcha' i], iframe[src*='hcaptcha' i], iframe[src*='challenges.cloudflare.com' i]",
              ),
            );
            return frames.some((frame) => {
              if (!isVisible(frame)) return false;
              const descriptor = normalized(
                `${frame.getAttribute("src")} ${frame.getAttribute("title")}`,
              );
              if (/\\b(bframe|challenge|checkbox)\\b/.test(descriptor)) return true;
              const rect = frame.getBoundingClientRect();
              return rect.width >= 180 && rect.height >= 50;
            });
          }

          function detectSecurityCheckpoint(): SecurityCheckpointKind | null {
            const body = visibleSecurityText();
            if (
              hasActiveCaptchaFrame() ||
              hasVisibleSecurityElement(
                "[role='dialog'][class*='captcha' i], [role='dialog'][id*='captcha' i]",
              ) ||
              /\\b(recaptcha|hcaptcha|captcha|verify you are human|human verification|i(?:'| a)m not a robot)\\b/.test(
                body,
              )
            ) {
              return "CAPTCHA";
            }'''
          new = '''function hasActiveCaptchaFrame(): boolean {
            const frames = Array.from(
              document.querySelectorAll(
                "iframe[src*='recaptcha' i], iframe[src*='hcaptcha' i], iframe[src*='challenges.cloudflare.com' i]",
              ),
            );
            return frames.some((frame) => {
              if (!isVisible(frame)) return false;
              const src = frame.getAttribute("src") ?? "";
              const descriptor = normalized(
                `${src} ${frame.getAttribute("title")}`,
              );
              if (/\\b(bframe|challenge|checkbox)\\b/.test(descriptor)) return true;

              let captchaSize = "";
              try {
                captchaSize = new URL(src, window.location.href).searchParams.get("size") ?? "";
              } catch {
                captchaSize = "";
              }
              if (normalized(captchaSize) === "invisible") return false;
              if (frame.closest(".grecaptcha-badge")) return false;

              if (/recaptcha/.test(descriptor) && /\\/anchor\\b/.test(src)) {
                if (/^(normal|compact)$/i.test(captchaSize)) return true;
                const rect = frame.getBoundingClientRect();
                return rect.width >= 250 && rect.height >= 60;
              }

              const rect = frame.getBoundingClientRect();
              return rect.width >= 180 && rect.height >= 50;
            });
          }

          function hasVisibleCaptchaPrompt(body: string): boolean {
            return (
              /\\b(verify you are human|human verification|i(?:'| a)m not a robot)\\b/.test(
                body,
              ) ||
              /\\b(complete|solve|enter|verify|pass)\\b.{0,48}\\b(captcha|recaptcha|hcaptcha)\\b/.test(
                body,
              ) ||
              /\\b(captcha|recaptcha|hcaptcha)\\b.{0,48}\\b(challenge|required|verification|verify|complete|solve)\\b/.test(
                body,
              )
            );
          }

          function detectSecurityCheckpoint(): SecurityCheckpointKind | null {
            const body = visibleSecurityText();
            if (
              hasActiveCaptchaFrame() ||
              hasVisibleSecurityElement(
                "[role='dialog'][class*='captcha' i], [role='dialog'][id*='captcha' i]",
              ) ||
              hasVisibleCaptchaPrompt(body)
            ) {
              return "CAPTCHA";
            }'''
          if scanner.count(old) != 1:
              raise SystemExit('Expected scanner CAPTCHA anchor was not found exactly once')
          scanner_path.write_text(scanner.replace(old, new, 1))

          test_path = Path('apps/extension/src/content/scanner.test.ts')
          tests = test_path.read_text()
          anchor = '''  it("ignores passive reCAPTCHA integration until a challenge is active", () => {
            document.body.innerHTML = `
              <label for="resume">Upload CV</label>
              <input id="resume" type="file" required>
              <div class="grecaptcha-badge">
                <iframe title="reCAPTCHA" src="https://www.google.com/recaptcha/api2/anchor"></iframe>
              </div>
            `;
            const result = scanDocument();
            expect(result.securityCheckpoint).toBeNull();
            expect(result.applicationState).toBe("RESUME");
          });'''
          replacement = anchor + '''

          it("ignores a large invisible reCAPTCHA badge and passive branding", () => {
            document.body.innerHTML = `
              <label for="resume">Upload CV</label>
              <input id="resume" type="file" required>
              <p>This site is protected by reCAPTCHA and the Google Privacy Policy applies.</p>
              <div class="grecaptcha-badge">
                <iframe title="reCAPTCHA" src="https://www.google.com/recaptcha/api2/anchor?size=invisible"></iframe>
              </div>
            `;
            const frame = document.querySelector("iframe") as HTMLIFrameElement;
            vi.spyOn(frame, "getBoundingClientRect").mockReturnValue({
              ...visibleRectangle,
              bottom: 90,
              height: 80,
              right: 310,
              width: 300,
            });
            const result = scanDocument();
            expect(result.securityCheckpoint).toBeNull();
            expect(result.applicationState).toBe("RESUME");
          });

          it("detects a visible CAPTCHA prompt even without a challenge iframe", () => {
            document.body.innerHTML = `<p>Please complete the CAPTCHA verification to continue.</p>`;
            expect(scanDocument().securityCheckpoint).toBe("CAPTCHA");
          });'''
          if tests.count(anchor) != 1:
              raise SystemExit('Expected scanner regression anchor was not found exactly once')
          test_path.write_text(tests.replace(anchor, replacement, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Format patched source
        run: npm run format

      - name: Run complete JavaScript and extension verification
        run: npm run check

      - name: Install and verify native companion
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff check apps/native-host
          python -m pytest apps/native-host

      - name: Run repository safety gates
        run: |
          ./scripts/repository-safety.sh
          node scripts/secret-scan.mjs

      - name: Publish refinement
        shell: bash
        run: |
          rm .github/workflows/autopilot-captcha-refine.yml
          git config user.name 'Aadil Munshi'
          git config user.email 'mohammadaadilmunshi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: distinguish passive reCAPTCHA from active challenge'
          git push origin HEAD:feat/v3-foundation-alignment
