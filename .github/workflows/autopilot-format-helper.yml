name: AutoPilot format helper

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/autopilot-format-helper.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Guard exact PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format AutoPilot tranche
        run: >-
          npx prettier --write
          apps/extension/src/messaging/native.ts
          packages/application-model/src/autopilot.ts
          packages/application-model/src/autopilot-session.ts
      - name: Verify AutoPilot tranche
        run: |
          npx prettier --check apps/extension/src/messaging/native.ts packages/application-model/src/autopilot.ts packages/application-model/src/autopilot-session.ts
          npm run lint
          npm run typecheck
          ./node_modules/.bin/vitest run packages/application-model/src/autopilot.test.ts packages/application-model/src/autopilot-session.test.ts
      - name: Remove temporary helper and commit exact result
        run: |
          rm .github/workflows/autopilot-format-helper.yml
          git add apps/extension/src/messaging/native.ts packages/application-model/src/autopilot.ts packages/application-model/src/autopilot-session.ts .github/workflows/autopilot-format-helper.yml
          git -c user.name='Aadil Munshi' -c user.email='mohammadaadilmunshi@gmail.com' commit -m 'fix: certify autopilot checkpoint session tranche'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
