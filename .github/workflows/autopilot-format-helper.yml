name: AutoPilot format helper

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/autopilot-format-helper.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format AutoPilot tranche
        run: >-
          npx prettier --write
          apps/extension/src/messaging/native.ts
          packages/application-model/src/autopilot.ts
          packages/application-model/src/autopilot-session.ts
      - name: Verify AutoPilot tranche
        run: |
          npx prettier --check apps/extension/src/messaging/native.ts packages/application-model/src/autopilot.ts packages/application-model/src/autopilot-session.ts
          npm run lint
          npm run typecheck
          ./node_modules/.bin/vitest run packages/application-model/src/autopilot.test.ts packages/application-model/src/autopilot-session.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-autopilot-tranche
          path: |
            apps/extension/src/messaging/native.ts
            packages/application-model/src/autopilot.ts
            packages/application-model/src/autopilot-session.ts
          if-no-files-found: error
          retention-days: 1
