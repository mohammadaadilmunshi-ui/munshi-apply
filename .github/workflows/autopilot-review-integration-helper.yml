name: AutoPilot review integration helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  integrate-and-certify:
    if: "${{ github.event.head_commit.message == 'chore: rerun autopilot review certification' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guarded PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 2

      - name: Guard exact tranche parent
        run: |
          test "$(git rev-parse HEAD^)" = "03f657bee07d65f1093d59bb625a185617b55504"
          test "$(git branch --show-current)" = "feat/v3-foundation-alignment"
          test -f scripts/autopilot-review-integration.py
          test -f scripts/autopilot-review-hook-fix.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -e './apps/native-host[dev]'

      - name: Integrate runtime, review pipeline, and fill hardening
        run: |
          python scripts/autopilot-review-integration.py
          python scripts/autopilot-review-hook-fix.py

      - name: Apply authoritative formatting
        run: |
          npx prettier --write \
            packages/contracts/src/index.ts \
            packages/application-model/src/autopilot-session.ts \
            packages/application-model/src/autopilot-session.test.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/fill.test.ts \
            apps/extension/src/content/bootstrap.ts \
            apps/extension/src/background/autopilot-controller.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/messaging/native.ts \
            apps/extension/src/sidepanel/App.tsx \
            apps/extension/src/sidepanel/AutoPilotControlCenter.tsx \
            apps/extension/src/sidepanel/AIDraftReview.tsx \
            apps/extension/src/sidepanel/autopilot-plan.ts \
            apps/extension/src/sidepanel/autopilot-plan.test.ts \
            .github/workflows/autopilot-review-integration-helper.yml
          python -m ruff format apps/native-host
          python -m ruff check --fix apps/native-host
          python -m ruff check apps/native-host

      - name: Verify complete extension tranche
        run: npm run check

      - name: Verify complete native tranche
        run: python -m pytest apps/native-host

      - name: Remove temporary helpers
        run: |
          git rm -- .github/workflows/autopilot-review-integration-helper.yml
          git rm -- scripts/autopilot-review-integration.py
          git rm -- scripts/autopilot-review-hook-fix.py

      - name: Commit exact certified tree
        run: |
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -u
          git diff --cached --check
          git commit -m "feat: complete autopilot control and AI draft review"
          git push origin HEAD:feat/v3-foundation-alignment
