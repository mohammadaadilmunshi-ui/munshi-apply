name: AutoPilot review integration helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  integrate-and-certify:
    if: github.event.head_commit.message == 'chore: integrate autopilot review tranche'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out guarded PR branch
        uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 2

      - name: Guard exact tranche parent
        run: |
          test "$(git rev-parse HEAD^)" = "07f34976a2e142ca3ec954247ddc3d8d43d7328b"
          test "$(git branch --show-current)" = "feat/v3-foundation-alignment"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: |
          npm ci
          python -m pip install -e './apps/native-host[dev]'

      - name: Integrate runtime, review pipeline, and fill hardening
