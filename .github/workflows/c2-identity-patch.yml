name: Guarded application identity patch
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply application identity isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path("packages/application-model/src/autopilot-session.ts")
          session = session_path.read_text()
          contracts_import = '} from "@munshi-apply/contracts";\n'
          if session.count(contracts_import) != 1:
              raise SystemExit("autopilot-session contracts import drifted")
          session = session.replace(
              contracts_import,
              contracts_import + 'import { applicationUrlIdentityKey } from "./application-url";\n',
              1,
          )
          old_identity = (
              '  const url = new URL(input.url);\n'
              '  url.hash = "";\n'
              '  url.search = "";\n'
              '  const externalJobId = input.externalJobId?.trim() ?? "";\n'
              '  const canonical = [\n'
              '    url.origin.toLocaleLowerCase("en-US"),\n'
              '    url.pathname.replace(/\\/+$/, "") || "/",\n'
              '    externalJobId,\n'
              '  ].join("|");'
          )
          new_identity = (
              '  const externalJobId = input.externalJobId?.trim() ?? "";\n'
              '  const canonical = [applicationUrlIdentityKey(input.url), externalJobId].join(\n'
              '    "|",\n'
              '  );'
          )
          if session.count(old_identity) != 1:
              raise SystemExit("deriveApplicationIdentity source drifted")
          session_path.write_text(session.replace(old_identity, new_identity, 1))

          controller_path = Path("apps/extension/src/background/autopilot-controller.ts")
          controller = controller_path.read_text()
          import_anchor = (
              '  restoreSessionFromCheckpoint,\n'
              '  verifyFillAction,'
          )
          import_replacement = (
              '  restoreSessionFromCheckpoint,\n'
              '  sameApplicationUrlLocation,\n'
              '  sameExplicitApplicationIdentity,\n'
              '  verifyFillAction,'
          )
          if controller.count(import_anchor) != 1:
              raise SystemExit("AutoPilot import anchor drifted")
          controller = controller.replace(import_anchor, import_replacement, 1)

          canonical_function = (
              'function canonicalUrl(value: string): string {\n'
              '  const url = new URL(value);\n'
              '  url.hash = "";\n'
              '  url.search = "";\n'
              '  return url.href;\n'
              '}\n\n'
          )
          if controller.count(canonical_function) != 1:
              raise SystemExit("canonicalUrl helper drifted")
          controller = controller.replace(canonical_function, "", 1)
          old_compare = 'canonicalUrl(page.url) !== canonicalUrl(runtime.lastUrl)'
          if controller.count(old_compare) != 4:
              raise SystemExit(f"expected 4 AutoPilot URL guards, found {controller.count(old_compare)}")
          controller = controller.replace(
              old_compare,
              '!sameApplicationUrlLocation(page.url, runtime.lastUrl)',
          )

          old_resume = (
              '      if (new URL(page.url).origin !== new URL(runtime.lastUrl).origin) {\n'
              '        throw new Error(\n'
              '          "Application origin changed while AutoPilot was paused",\n'
              '        );\n'
              '      }'
          )
          new_resume = (
              '      if (!sameExplicitApplicationIdentity(page.url, runtime.lastUrl)) {\n'
              '        throw new Error(\n'
              '          "Application identity changed while AutoPilot was paused",\n'
              '        );\n'
              '      }'
          )
          if controller.count(old_resume) != 1:
              raise SystemExit("AutoPilot resume identity guard drifted")
          controller_path.write_text(controller.replace(old_resume, new_resume, 1))

          scanner_path = Path("apps/extension/src/content/scanner.ts")
          scanner = scanner_path.read_text()
          old_scanner_import = 'import { componentFingerprint } from "@munshi-apply/application-model";'
          new_scanner_import = (
              'import {\n'
              '  applicationUrlIdentityKey,\n'
              '  componentFingerprint,\n'
              '} from "@munshi-apply/application-model";'
          )
          if scanner.count(old_scanner_import) != 1:
              raise SystemExit("scanner application-model import drifted")
          scanner = scanner.replace(old_scanner_import, new_scanner_import, 1)
          old_signature = '  const pageSignature = `${url.origin}${url.pathname}|${document.title}`;'
          new_signature = '  const pageSignature = `${applicationUrlIdentityKey(url.href)}|${document.title}`;'
          if scanner.count(old_signature) != 1:
              raise SystemExit("scanner page signature drifted")
          scanner_path.write_text(scanner.replace(old_signature, new_signature, 1))
          PY
          npx prettier packages/application-model/src/application-url.ts packages/application-model/src/application-url.test.ts packages/application-model/src/autopilot-session.ts apps/extension/src/background/autopilot-controller.ts apps/extension/src/background/autopilot-application-identity.test.ts apps/extension/src/content/scanner.ts apps/extension/src/content/scanner-page-identity.test.ts --write
          npx vitest run packages/application-model/src/application-url.test.ts packages/application-model/src/autopilot-session.test.ts apps/extension/src/background/autopilot-application-identity.test.ts apps/extension/src/background/autopilot-controller.test.ts apps/extension/src/content/scanner-page-identity.test.ts apps/extension/src/content/scanner.test.ts
          git diff --check
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/c2-identity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/application-model/src/application-url.ts packages/application-model/src/application-url.test.ts packages/application-model/src/autopilot-session.ts apps/extension/src/background/autopilot-controller.ts apps/extension/src/background/autopilot-application-identity.test.ts apps/extension/src/content/scanner.ts apps/extension/src/content/scanner-page-identity.test.ts .github/workflows/c2-identity-patch.yml
          git diff --cached --check
          git commit -m "fix: isolate query-identified applications"
          git push origin HEAD:feat/v3-foundation-alignment
