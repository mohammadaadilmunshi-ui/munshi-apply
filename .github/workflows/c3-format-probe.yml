name: C3 format probe
on:
  push:
    branches: [feat/v3-foundation-alignment]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier apps/extension/src/background/content-runtime.ts apps/extension/src/background/history-state-recovery.ts apps/extension/src/background/history-state-recovery.test.ts --write
          git diff -- apps/extension/src/background/content-runtime.ts apps/extension/src/background/history-state-recovery.ts apps/extension/src/background/history-state-recovery.test.ts
