name: Canonical source normalize once

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/canonical-source-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply final native line normalization
        run: python scripts/phase_3_8_9_python_quality_fix.py
      - name: Install locked Node dependencies
        run: npm ci
      - name: Write canonical JS formatting
        run: npm run format
      - name: Install native companion
        run: python -m pip install -e './apps/native-host[dev]'
      - name: Write canonical Python formatting
        run: |
          python -m ruff format apps/native-host
          python -m ruff check apps/native-host --fix
      - name: Verify JavaScript and TypeScript
        run: npm run check
      - name: Verify native companion
        run: |
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit canonical source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'Canonical source already normalized.'
            exit 0
          fi
          git commit -m 'chore: normalize canonical phase 3 8 9 sources'
          git push origin HEAD:feat/v3-foundation-alignment
