name: Canonical source normalize once

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/canonical-source-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Normalize formatter-resistant Python literals
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/native-host/src/munshi_apply_native/providers.py": [
                  (
                      '        "and verified results. For career-transition answers, stay constructive and future-focused. "\n',
                      '        "and verified results. For career-transition answers, stay constructive and "\n'
                      '        "future-focused. "\n',
                  ),
              ],
              "apps/native-host/src/munshi_apply_native/response_planner.py": [
                  (
                      '        r"why (?:do you want to (?:work|join)|are you interested in) (?:us|our|this company|the company)",\n',
                      '        r"why (?:do you want to (?:work|join)|are you interested in) "\n'
                      '        r"(?:us|our|this company|the company)",\n',
                  ),
                  (
                      '        r"why (?:this|the) (?:role|position)|why are you interested in (?:this|the) (?:role|position)",\n',
                      '        r"why (?:this|the) (?:role|position)|why are you interested in "\n'
                      '        r"(?:this|the) (?:role|position)",\n',
                  ),
                  (
                      '        r"what (?:does|do you understand about).*(?:role|position)|describe (?:the )?(?:role|responsibilities)",\n',
                      '        r"what (?:does|do you understand about).*(?:role|position)|describe "\n'
                      '        r"(?:the )?(?:role|responsibilities)",\n',
                  ),
                  (
                      '        r"(?:relevant|related|prior) experience|tell us about your experience|describe your experience",\n',
                      '        r"(?:relevant|related|prior) experience|tell us about your experience|"\n'
                      '        r"describe your experience",\n',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected canonical literal not found in {filename}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install locked Node dependencies
        run: npm ci
      - name: Write canonical JS formatting
        run: npm run format
      - name: Install native companion
        run: python -m pip install -e './apps/native-host[dev]'
      - name: Write canonical Python formatting
        run: |
          python -m ruff format apps/native-host
          python -m ruff check apps/native-host --fix
      - name: Verify JavaScript and TypeScript
        run: npm run check
      - name: Verify native companion
        run: |
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit canonical source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'Canonical source already normalized.'
            exit 0
          fi
          git commit -m 'chore: normalize canonical phase 3 8 9 sources'
          git push origin HEAD:feat/v3-foundation-alignment
