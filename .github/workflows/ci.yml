name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: munshi-apply-edge-unpacked
          path: apps/extension/dist
          if-no-files-found: error

  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: python -m ruff check apps/native-host
      - run: python -m pytest apps/native-host

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed local data
        shell: bash
        run: |
          forbidden="$(git ls-files '*.sqlite' '*.db' '*.env' '*.pdf' 'backups/**' 'reports/generated/**')"
          if [ -n "$forbidden" ]; then
            echo "Forbidden local or personal artifacts are tracked:"
            echo "$forbidden"
            exit 1
          fi
