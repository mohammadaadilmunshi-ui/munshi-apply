name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: munshi-apply-edge-unpacked
          path: apps/extension/dist
          if-no-files-found: error

  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify operational Python selector
        run: |
          source scripts/lib/common.sh
          "${PYTHON_BIN}" -c 'import sys; assert sys.version_info >= (3, 12); print(sys.executable)'
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: python -m ruff check apps/native-host
      - run: python -m pytest apps/native-host

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/secret-scan.mjs
      - run: ./scripts/repository-safety.sh
