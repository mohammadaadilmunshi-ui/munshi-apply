name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: munshi-apply-edge-unpacked
          path: apps/extension/dist
          if-no-files-found: error

  native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify operational Python selector
        run: |
          source scripts/lib/common.sh
          "${PYTHON_BIN}" -c 'import sys; assert sys.version_info >= (3, 12); print(sys.executable)'
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: python -m ruff check apps/native-host
      - run: python -m pytest apps/native-host

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/secret-scan.mjs
      - run: ./scripts/repository-safety.sh

  profile-ui-ack-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch exact Profile save status blocks
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/extension/src/sidepanel/App.tsx")
          source = path.read_text()

          old_auto = '''        void saveProfile(profile)
            .then(async () => {
              const status = await getProfileSyncStatus();
              setProfileSyncStatus(status);
              if (profileRevision.current !== revision) return;
              setProfileDirty(false);
              setSaveState(
                status.conflict
                  ? "conflict"
                  : cloud.status === "connected" && cloud.data.encryptionReady
                    ? "synced"
                    : "local",
              );
            })
'''
          new_auto = '''        void saveProfile(profile)
            .then((acknowledgement) => {
              const status = { conflict: acknowledgement.conflict };
              setProfileSyncStatus(status);
              if (profileRevision.current !== revision) return;
              setProfileDirty(false);
              setSaveState(
                acknowledgement.conflict
                  ? "conflict"
                  : acknowledgement.cloudSynced
                    ? "synced"
                    : "local",
              );
            })
'''
          if source.count(old_auto) != 1:
              raise SystemExit("Expected exactly one Profile autosave block")
          source = source.replace(old_auto, new_auto, 1)

          old_sync = '''    try {
      await saveProfile(profile);
      const syncStatus = await getProfileSyncStatus();
      setProfileSyncStatus(syncStatus);
      if (profileRevision.current === revision) {
        setProfileDirty(false);
        setSaveState(
          syncStatus.conflict
            ? "conflict"
            : cloud.status === "connected" && cloud.data.encryptionReady
              ? "synced"
              : "local",
        );
      }
'''
          new_sync = '''    try {
      const acknowledgement = await saveProfile(profile);
      const syncStatus = { conflict: acknowledgement.conflict };
      setProfileSyncStatus(syncStatus);
      if (profileRevision.current === revision) {
        setProfileDirty(false);
        setSaveState(
          acknowledgement.conflict
            ? "conflict"
            : acknowledgement.cloudSynced
              ? "synced"
              : "local",
        );
      }
'''
          if source.count(old_sync) != 1:
              raise SystemExit("Expected exactly one manual sync block")
          path.write_text(source.replace(old_sync, new_sync, 1))
          PY
          npx prettier apps/extension/src/sidepanel/App.tsx --write
      - name: Commit exact Profile UI patch
        run: |
          git config user.name "MUNSHI Apply CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src/sidepanel/App.tsx
          git diff --cached --check
          git commit -m "fix: render profile save status from exact acknowledgement"
          git push origin HEAD:feat/v3-foundation-alignment
