name: Expand universal profile fields

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/expand-universal-profile.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - name: Add broad application profile fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/extension/src/sidepanel/App.tsx")
          text = path.read_text()

          replacements = [
              (
                  '  { section: "Application preferences", key: "previous_application", label: "Previous application answer", category: "SAVED_ANSWER", protected: true },\n',
                  '  { section: "Application preferences", key: "previous_application", label: "Previous application answer", category: "SAVED_ANSWER", protected: true },\n'
                  '  { section: "Application preferences", key: "security_clearance", label: "Security clearance", category: "SAVED_ANSWER", protected: true },\n'
                  '  { section: "Application preferences", key: "conflict_of_interest", label: "Conflict-of-interest answer", category: "SAVED_ANSWER", protected: true },\n'
                  '  { section: "Application preferences", key: "non_compete", label: "Non-compete / restrictive covenant answer", category: "SAVED_ANSWER", protected: true },\n'
                  '  { section: "Application preferences", key: "background_check", label: "Background-check answer", category: "SAVED_ANSWER", protected: true },\n'
                  '  { section: "Application preferences", key: "drug_screening", label: "Drug-screening answer", category: "SAVED_ANSWER", protected: true },\n'
              ),
              (
                  '  { section: "Optional voluntary demographics", key: "veteran_status", label: "Veteran status", category: "VOLUNTARY_DEMOGRAPHIC", protected: true },\n',
                  '  { section: "Optional voluntary demographics", key: "veteran_status", label: "Veteran status", category: "VOLUNTARY_DEMOGRAPHIC", protected: true },\n'
                  '  { section: "Optional voluntary demographics", key: "protected_veteran_status", label: "Protected veteran status", category: "VOLUNTARY_DEMOGRAPHIC", protected: true },\n'
                  '  { section: "Optional voluntary demographics", key: "eeo_self_id", label: "EEO self-identification", category: "VOLUNTARY_DEMOGRAPHIC", protected: true },\n'
              ),
              (
                  '    { key: "education_location", label: "Location", category: "EDUCATION", protected: false },\n',
                  '    { key: "education_location", label: "Location", category: "EDUCATION", protected: false },\n'
                  '    { key: "education_start_date", label: "Start date", category: "EDUCATION", protected: true, inputType: "date" },\n'
              ),
              (
                  '    { key: "employment_location", label: "Location", category: "EMPLOYMENT", protected: false },\n',
                  '    { key: "employment_location", label: "Location", category: "EMPLOYMENT", protected: false },\n'
                  '    { key: "company_industry", label: "Company industry", category: "EMPLOYMENT", protected: false },\n'
                  '    { key: "position_function", label: "Position function", category: "EMPLOYMENT", protected: false },\n'
                  '    { key: "employment_type", label: "Employment type", category: "EMPLOYMENT", protected: false },\n'
                  '    { key: "currently_employed", label: "Currently employed here", category: "EMPLOYMENT", protected: false },\n'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected App.tsx anchor not found: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit profile expansion
        run: |
          if git diff --quiet; then
            echo "No profile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/sidepanel/App.tsx
          git commit -m "feat: expose universal application profile fields"
          git push origin HEAD:feat/v3-foundation-alignment
