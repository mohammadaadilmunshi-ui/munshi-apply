name: Expire ready resolution tasks

on:
  push:
    branches:
      - chatgpt/resolution-orchestrator-usability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply READY lifecycle repair and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sync_path = Path("apps/extension/src/sidepanel/resolution-task-sync.ts")
          sync = sync_path.read_text()

          import_anchor = "  durableResolutionTaskFromPreflightFinding,\n"
          if "  failResolutionTask,\n" not in sync:
              if import_anchor not in sync:
                  raise SystemExit("failResolutionTask import anchor not found")
              sync = sync.replace(
                  import_anchor,
                  import_anchor + "  failResolutionTask,\n",
                  1,
              )

          old_loop = "".join([
              "  for (const finding of input.findings) {\n",
              '    if (finding.state === "READY") continue;\n',
              "    const question = questionForFinding(input.page, finding);\n",
              "    const taskId = preflightResolutionTaskId(\n",
              "      input.applicationId,\n",
              "      finding.requirement.requirementId,\n",
              "    );\n",
              "    const existing = existingById.get(taskId);\n",
          ])
          new_loop = "".join([
              "  for (const finding of input.findings) {\n",
              "    const taskId = preflightResolutionTaskId(\n",
              "      input.applicationId,\n",
              "      finding.requirement.requirementId,\n",
              "    );\n",
              "    const existing = existingById.get(taskId);\n",
              "\n",
              '    if (finding.state === "READY") {\n',
              "      if (\n",
              "        !existing ||\n",
              '        ["RESOLVED", "FAILED", "EXPIRED"].includes(existing.status)\n',
              "      ) {\n",
              "        continue;\n",
              "      }\n",
              "      writes.push(\n",
              "        failResolutionTask(existing, {\n",
              '          reason: "Current verified employer preflight no longer requires this Resolution Task",\n',
              "          at: strictlyLaterTimestamp(input.observedAt, existing.updatedAt),\n",
              "          expired: true,\n",
              "        }),\n",
              "      );\n",
              "      continue;\n",
              "    }\n",
              "\n",
              "    const question = questionForFinding(input.page, finding);\n",
          ])
          if old_loop not in sync:
              raise SystemExit("READY loop anchor not found")
          sync = sync.replace(old_loop, new_loop, 1)
          sync_path.write_text(sync)

          test_path = Path("apps/extension/src/sidepanel/resolution-task-sync.test.ts")
          test = test_path.read_text()
          test_anchor = "".join([
              '  it("does not bind a session belonging to another application", () => {\n',
          ])
          new_test = "\n".join([
              '  it("expires an existing open task when the same preflight finding becomes READY", () => {',
              "    const existing = firstWrite();",
              "    const writes = planPreflightResolutionTaskSync(",
              "      {",
              '        applicationId: "application-1",',
              "        page: page(),",
              '        findings: [finding("READY")],',
              "        session: session(),",
              '        observedAt: "2026-08-28T18:42:00.000Z",',
              "      },",
              "      [existing],",
              "    );",
              "",
              "    expect(writes).toHaveLength(1);",
              "    expect(writes[0]).toMatchObject({",
              "      taskId: existing.taskId,",
              '      status: "EXPIRED",',
              "    });",
              '    expect(writes[0]!.reason).toMatch(/verified employer preflight/i);',
              "  });",
              "",
          ])
          if "expires an existing open task when the same preflight finding becomes READY" not in test:
              if test_anchor not in test:
                  raise SystemExit("READY regression test anchor not found")
              test = test.replace(test_anchor, new_test + test_anchor, 1)
          test_path.write_text(test)
          PY
      - name: Apply pinned formatting
        run: |
          npx prettier --write \
            apps/extension/src/sidepanel/resolution-task-sync.ts \
            apps/extension/src/sidepanel/resolution-task-sync.test.ts
      - name: Commit lifecycle repair
        run: |
          if git diff --quiet; then
            echo "No lifecycle changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/sidepanel/resolution-task-sync.ts \
            apps/extension/src/sidepanel/resolution-task-sync.test.ts
          git commit -m "fix(resolution): expire superseded ready tasks"
          git push origin HEAD:chatgpt/resolution-orchestrator-usability
