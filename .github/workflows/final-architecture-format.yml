name: Final architecture batch formatter

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -e './apps/native-host[dev]'
      - name: Canonical TypeScript and documentation formatting
        run: |
          npx prettier --write \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/fill.test.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/content/scanner.test.ts \
            packages/application-model/src/*.ts \
            packages/contracts/src/profile-vault.ts \
            packages/contracts/src/profile-vault.test.ts \
            packages/contracts/package.json \
            packages/shared/src/review-backlog.ts \
            packages/shared/src/review-backlog.test.ts \
            packages/shared/src/index.ts \
            docs/ROADMAP.md \
            docs/IMPLEMENTATION_STATUS.md
      - name: Canonical native formatting
        run: |
          python -m ruff format \
            apps/native-host/src/munshi_apply_native/providers.py \
            apps/native-host/src/munshi_apply_native/architecture_store.py \
            apps/native-host/src/munshi_apply_native/learning_analytics_store.py \
            apps/native-host/tests/test_providers.py \
            apps/native-host/tests/test_architecture_store.py \
            apps/native-host/tests/test_learning_analytics_store.py \
            apps/native-host/tests/test_database.py \
            apps/native-host/tests/test_api.py \
            apps/native-host/tests/test_operations.py
      - name: Commit canonical formatter output if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/content/fill.ts \
            apps/extension/src/content/fill.test.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/content/scanner.test.ts \
            packages/application-model/src \
            packages/contracts/src/profile-vault.ts \
            packages/contracts/src/profile-vault.test.ts \
            packages/contracts/package.json \
            packages/shared/src/review-backlog.ts \
            packages/shared/src/review-backlog.test.ts \
            packages/shared/src/index.ts \
            docs/ROADMAP.md \
            docs/IMPLEMENTATION_STATUS.md \
            apps/native-host/src/munshi_apply_native/providers.py \
            apps/native-host/src/munshi_apply_native/architecture_store.py \
            apps/native-host/src/munshi_apply_native/learning_analytics_store.py \
            apps/native-host/tests/test_providers.py \
            apps/native-host/tests/test_architecture_store.py \
            apps/native-host/tests/test_learning_analytics_store.py \
            apps/native-host/tests/test_database.py \
            apps/native-host/tests/test_api.py \
            apps/native-host/tests/test_operations.py
          git commit -m "style: format final architecture batch"
          git push origin HEAD:feat/v3-foundation-alignment
