name: Fix temporary 0.2.9 workflow lint

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/fix-runtime-029-workflow.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - name: Correct Unicode marker regex in temporary patch workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/runtime-029-hotfix.yml')
          text = p.read_text()
          old = "'.replace(/\\\\s*[\\\\*✱＊]+\\\\s*$/, \"\")'"
          new = "'.replace(/\\\\s*[*✱＊]+\\\\s*$/, \"\")'"
          if old not in text:
              raise SystemExit('Expected temporary workflow regex not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-runtime-029-workflow.yml
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add -A
          git commit -m "ci: correct 0.2.9 runtime hotfix lint"
          git push origin HEAD:feat/v3-foundation-alignment
