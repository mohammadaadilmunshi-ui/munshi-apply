name: Account format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write \
            apps/extension/src/messaging/native-account.ts \
            apps/extension/src/sidepanel/AutoPilotControlCenter.tsx
          git diff -- \
            apps/extension/src/messaging/native-account.ts \
            apps/extension/src/sidepanel/AutoPilotControlCenter.tsx
