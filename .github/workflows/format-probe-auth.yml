name: Authentication format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write packages/application-model/src/autopilot.test.ts
          git diff -- packages/application-model/src/autopilot.test.ts
