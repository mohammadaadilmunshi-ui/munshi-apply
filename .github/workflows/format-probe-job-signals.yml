name: Job signal format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Job Signal formatting
        run: |
          npx prettier --write \
            packages/application-model/src/job-signals.ts \
            packages/application-model/src/job-signals.test.ts
          git diff -- \
            packages/application-model/src/job-signals.ts \
            packages/application-model/src/job-signals.test.ts
