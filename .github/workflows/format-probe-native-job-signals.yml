name: Native Job Signal format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical native Job Signal formatting
        run: |
          npx prettier --write apps/extension/src/messaging/native-job-signals.ts
          git diff -- apps/extension/src/messaging/native-job-signals.ts
