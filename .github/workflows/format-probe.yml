name: Format probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply canonical Prettier formatting
        run: |
          npx prettier --write \
            packages/application-model/src/employer-preflight.test.ts \
            packages/application-model/src/employer-preflight.ts
          if git diff --quiet -- \
            packages/application-model/src/employer-preflight.test.ts \
            packages/application-model/src/employer-preflight.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/application-model/src/employer-preflight.test.ts \
            packages/application-model/src/employer-preflight.ts
          git commit -m "style: apply canonical employer preflight formatting"
          git push origin HEAD:feat/v3-foundation-alignment
