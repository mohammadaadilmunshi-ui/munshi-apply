name: Format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier --write \
            packages/application-model/src/interaction-escalation.test.ts \
            packages/application-model/src/learning.ts \
            packages/application-model/src/progressive-memory.test.ts \
            packages/application-model/src/progressive-memory.ts
          git diff -- \
            packages/application-model/src/interaction-escalation.test.ts \
            packages/application-model/src/learning.ts \
            packages/application-model/src/progressive-memory.test.ts \
            packages/application-model/src/progressive-memory.ts
