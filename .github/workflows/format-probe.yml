name: Format probe

on:
  push:
    branches: [feat/v3-foundation-alignment]

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed TypeScript files
        run: >-
          npx prettier --write
          packages/application-model/src/resolver.ts
          packages/application-model/src/resolver.test.ts
          packages/semantic-engine/src/index.test.ts
      - name: Publish canonical formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/resolver.test.ts \
            packages/semantic-engine/src/index.test.ts
          then
            echo "Formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/resolver.test.ts \
            packages/semantic-engine/src/index.test.ts
          git commit -m "style: normalize live ATS repair"
          git push origin HEAD:feat/v3-foundation-alignment
