name: Resolution task panel format repair

on:
  push:
    branches:
      - chatgpt/resolution-orchestrator-usability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier output
        run: |
          npx prettier --write \
            apps/extension/src/sidepanel/ResolutionTaskPanel.tsx \
            apps/extension/src/sidepanel/ResolutionTaskPanel.test.tsx
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/sidepanel/ResolutionTaskPanel.tsx \
            apps/extension/src/sidepanel/ResolutionTaskPanel.test.tsx
          git commit -m "style: format resolution task panel"
          git push origin HEAD:chatgpt/resolution-orchestrator-usability
