name: Keychain stdin patch

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/patch-keychain-stdin.py
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: python -m ruff format apps/native-host/src/munshi_apply_native/ai_settings.py apps/native-host/tests/test_ai_settings.py
      - run: python -m ruff check apps/native-host/src/munshi_apply_native/ai_settings.py apps/native-host/tests/test_ai_settings.py
      - run: python -m pytest apps/native-host/tests/test_ai_settings.py
      - name: Commit Keychain hardening
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/native-host/src/munshi_apply_native/ai_settings.py apps/native-host/tests/test_ai_settings.py
          git commit -m "security: keep OpenAI key out of process arguments"
          git push origin HEAD:feat/v3-foundation-alignment
