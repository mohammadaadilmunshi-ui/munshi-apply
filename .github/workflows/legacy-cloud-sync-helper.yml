name: Legacy cloud sync compatibility helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Guard staged repair inputs
        run: |
          test -f scripts/fix-legacy-cloud-application-sync.py || {
            echo "Repair script missing; refusing to patch."
            exit 1
          }
          test -f .github/workflows/legacy-cloud-sync-helper.yml || {
            echo "Repair workflow missing; refusing to patch."
            exit 1
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Apply legacy cloud sync repair
        run: python3 scripts/fix-legacy-cloud-application-sync.py
      - name: Format patched product files
        run: npx prettier --write apps/extension/src/storage/cloud.ts apps/extension/src/storage/cloud-application.test.ts packages/application-model/src/application-detection.ts packages/application-model/src/application-detection.test.ts
      - name: Verify extension
        run: npm run check
      - name: Verify production artifact
        run: |
          npm run build
          node scripts/verify-artifacts.mjs
      - name: Remove temporary helper files
        run: git rm -f scripts/fix-legacy-cloud-application-sync.py .github/workflows/legacy-cloud-sync-helper.yml
      - name: Commit clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/storage/cloud.ts apps/extension/src/storage/cloud-application.test.ts packages/application-model/src/application-detection.ts packages/application-model/src/application-detection.test.ts
          git diff --cached --check
          git commit -m "fix: keep legacy application history from blocking sync"
          git push origin HEAD:feat/v3-foundation-alignment
