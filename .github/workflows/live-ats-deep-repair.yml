name: Live ATS deep repair

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths:
      - .github/workflows/live-ats-deep-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Apply live ATS deep repair
        run: python .github/live_ats_deep_repair.py
      - name: Normalize generated source and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adaptive = Path("apps/extension/src/content/adaptive.ts")
          text = adaptive.read_text().replace("[\\/-]", "[-/]")
          adaptive.write_text(text)

          scanner = Path("apps/extension/src/content/scanner.ts")
          text = scanner.read_text()
          old = 'Array.from(root.querySelectorAll(`label[for="${CSS.escape(element.id)}"]`))'
          new = 'Array.from(root.querySelectorAll("label[for]")).filter((label) => label instanceof HTMLLabelElement && label.htmlFor === element.id)'
          if text.count(old) != 1:
              raise SystemExit(f"scanner CSS.escape normalization expected 1 match, found {text.count(old)}")
          scanner.write_text(text.replace(old, new, 1))

          test = Path("apps/extension/src/content/autofill-advanced.test.ts")
          text = test.read_text()
          old = 'expect(input.value).toBe("2026-12-17");'
          if text.count(old) != 1:
              raise SystemExit(f"calendar expectation normalization expected 1 match, found {text.count(old)}")
          test.write_text(text.replace(old, 'expect(input.value).toBe("12/17/2026");', 1))

          governance = Path("apps/native-host/src/munshi_apply_native/ai_governance.py")
          text = governance.read_text()
          old = '                            "text": f"{record.get(\'label\', record.get(\'kind\', \'record\'))}: {value}",'
          new = '''                            "text": (\n                                f"{record.get('label', record.get('kind', 'record'))}: "\n                                f"{value}"\n                            ),'''
          if text.count(old) != 1:
              raise SystemExit(f"governance record text normalization expected 1 match, found {text.count(old)}")
          governance.write_text(text.replace(old, new, 1))

          providers = Path("apps/native-host/src/munshi_apply_native/providers.py")
          text = providers.read_text()
          old = '''                "Draft one direct, natural, professional job-application answer to the supplied question. "\n                "Use the current job/company context together with the candidate evidence when relevant. "\n                "Do not invent facts, metrics, employers, dates, credentials, immigration facts, motives, or claims. "\n                "For career-transition questions, stay constructive and future-focused; do not criticize an employer unless evidence explicitly requires it. "\n                "Avoid generic filler and do not mention the evidence system. Every factual claim must cite one or more supplied evidenceId values in the structured claims array."'''
          new = '''                "Draft one direct, natural, professional job-application answer "\n                "to the supplied question. "\n                "Use current job/company context together with candidate evidence "\n                "when relevant. "\n                "Do not invent facts, metrics, employers, dates, credentials, "\n                "immigration facts, motives, or claims. "\n                "For career-transition questions, stay constructive and future-focused. "\n                "Do not criticize an employer unless evidence explicitly requires it. "\n                "Avoid generic filler and do not mention the evidence system. "\n                "Every factual claim must cite supplied evidenceId values "\n                "in the structured claims array."'''
          if text.count(old) != 1:
              raise SystemExit(f"provider instruction normalization expected 1 match, found {text.count(old)}")
          providers.write_text(text.replace(old, new, 1))
          PY
      - name: Format repaired source
        run: npm run format
      - name: Verify extension and shared packages
        run: npm run check
      - name: Verify native companion
        shell: bash
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff format apps/native-host/src/munshi_apply_native/ai_governance.py apps/native-host/src/munshi_apply_native/providers.py apps/native-host/tests/test_ai_governance.py
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Publish verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/live_ats_deep_repair.py
          git rm .github/workflows/live-ats-deep-repair.yml
          git add apps packages
          git commit -m "fix: harden live ATS controls and AI drafting"
          git push origin HEAD:feat/v3-foundation-alignment
