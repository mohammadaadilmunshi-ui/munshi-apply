  const text = normalized(value).replace(/[–—-]+/g, " ").trim();
  return /^(select|choose)( one| an option| option)?$/.test(text) || text === "please select";
}

function usablePromptText(value: string): string {
  const text = compactText(value);
  if (!text || placeholderChoiceText(text)) return "";
  if (/^(yes|no|true|false)$/i.test(text)) return "";
  return text.length <= 500 ? text : "";
}

function nearbyPromptText(element: Element): string {
  if (element.id) {
    const root = element.getRootNode();
    const labels =
      root instanceof Document || root instanceof ShadowRoot
        ? Array.from(root.querySelectorAll(`label[for="${CSS.escape(element.id)}"]`))
        : [];
    const direct = labels.map((item) => usablePromptText(item.textContent ?? "")).find(Boolean);
    if (direct) return direct;
  }

  const group = element.closest("fieldset, [role='radiogroup'], [role='group']");
  if (group) {
    const legend = usablePromptText(group.querySelector("legend")?.textContent ?? "");
    if (legend) return legend;
    const aria = usablePromptText(group.getAttribute("aria-label") ?? "");
    if (aria) return aria;
    const labelled = usablePromptText(labelledByText(group));
    if (labelled) return labelled;
  }

  let current = element.parentElement;
  for (let depth = 0; current && depth < 6; depth += 1, current = current.parentElement) {
    const candidates = Array.from(
      current.querySelectorAll(
        ":scope > label, :scope > legend, :scope > p, :scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > [class*='label' i], :scope > [class*='question' i]",
      ),
    );
    for (const candidate of candidates) {
      if (candidate === element || candidate.contains(element)) continue;
      const value = usablePromptText(candidate.textContent ?? "");
      if (value) return value;
    }
    let previous = element instanceof HTMLElement ? element.previousElementSibling : null;
    if (current !== element.parentElement) previous = current.previousElementSibling;
    for (let hops = 0; previous && hops < 3; hops += 1, previous = previous.previousElementSibling) {
      const value = usablePromptText(previous.textContent ?? "");
      if (value) return value;
    }
  }
  return "";
}

