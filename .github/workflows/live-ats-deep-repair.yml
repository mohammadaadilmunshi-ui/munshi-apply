          draft.write_text(text)

          # Native AI: accept current page context and synthesize authoritative non-protected profile/resume-like evidence at runtime.
          governance = Path("apps/native-host/src/munshi_apply_native/ai_governance.py")
          text = governance.read_text()
          text = text.replace('import re\nimport uuid', 'import hashlib\nimport re\nimport uuid', 1)
          text = text.replace(
              'from .providers import (\n',
              'from .profile_store import ProfileStore\nfrom .providers import (\n',
              1,
          )
          validate_marker = '''        max_output_tokens = payload.get("maxOutputTokens", 512)'''
          validate_add = '''        page_context = payload.get("pageContext", "")\n        if page_context is not None and not isinstance(page_context, str):\n            raise ValueError("AI draft pageContext must be a string")\n        page_context = (page_context or "").strip()\n        if len(page_context) > 20_000:\n            raise ValueError("AI draft pageContext exceeds 20,000 characters")\n        max_output_tokens = payload.get("maxOutputTokens", 512)'''
          if text.count(validate_marker) != 1:
              raise SystemExit("AI governance validation marker missing")
          text = text.replace(validate_marker, validate_add, 1)
          text = text.replace(
              '            "semanticType": semantic_type.strip(),\n            "correlationId": correlation_id.strip(),',
              '            "semanticType": semantic_type.strip(),\n            "pageContext": page_context,\n            "correlationId": correlation_id.strip(),',
              1,
          )
          context_sig = '''        semantic_type: str,\n        config: AIConfiguration,\n    ) -> tuple[tuple[ProviderContextItem, ...], set[str], dict[str, object]]:'''
          context_sig_new = '''        semantic_type: str,\n        page_context: str,\n        config: AIConfiguration,\n    ) -> tuple[tuple[ProviderContextItem, ...], set[str], dict[str, object]]:'''
          if text.count(context_sig) != 1:
              raise SystemExit("AI governance context signature marker missing")
          text = text.replace(context_sig, context_sig_new, 1)
          candidates_marker = '''        candidates: list[tuple[float, dict[str, object]]] = []\n        blocked_protected = 0'''
          candidates_new = '''        candidates: list[tuple[float, dict[str, object]]] = []\n        if page_context:\n            page_evidence_id = "job-context-" + hashlib.sha256(page_context.encode("utf-8")).hexdigest()[:20]\n            candidates.append(\n                (\n                    1.0,\n                    {\n                        "evidence_id": page_evidence_id,\n                        "kind": "JOB_REQUIREMENT",\n                        "text": page_context,\n                        "semantic_types": [semantic_type],\n                        "trust_level": "DOCUMENT_CONFIRMED",\n                        "protected": False,\n                        "source": "current-employer-page",\n                        "updated_at": self._now().isoformat(),\n                    },\n                )\n            )\n\n        profile = ProfileStore(self.database).latest()\n        if profile:\n            if config.allow_profile_evidence:\n                for fact in profile.get("facts", []):\n                    if fact.get("protected") or fact.get("trustLevel") not in _AUTHORITATIVE_TRUST:\n                        continue\n                    value = str(fact.get("value", "")).strip()\n                    if not value:\n                        continue\n                    candidates.append(\n                        (\n                            0.58,\n                            {\n                                "evidence_id": "profile-" + str(fact.get("factId", "unknown")),\n                                "kind": "PROFILE_FACT",\n                                "text": f"{fact.get('key', 'profile fact')}: {value}",\n                                "semantic_types": [],\n                                "trust_level": fact.get("trustLevel"),\n                                "protected": False,\n                                "source": "confirmed-profile",\n                                "updated_at": fact.get("updatedAt", self._now().isoformat()),\n                            },\n                        )\n                    )\n            for record in profile.get("records", []):\n                if record.get("kind") not in {"EMPLOYMENT", "PROJECT", "EDUCATION", "CERTIFICATION"}:\n                    continue\n                for fact in record.get("facts", []):\n                    if fact.get("protected") or fact.get("trustLevel") not in _AUTHORITATIVE_TRUST:\n                        continue\n                    key = str(fact.get("key", ""))\n                    if not config.allow_profile_evidence and not (\n                        config.allow_resume_evidence\n                        and key in {"responsibilities", "achievements", "project_summary", "project_technologies", "gpa"}\n                    ):\n                        continue\n                    value = str(fact.get("value", "")).strip()\n                    if not value:\n                        continue\n                    kind = "RESUME_BULLET" if key in {"responsibilities", "achievements", "project_summary", "project_technologies"} else str(record.get("kind"))\n                    candidates.append(\n                        (\n                            0.72 if kind == "RESUME_BULLET" else 0.62,\n                            {\n                                "evidence_id": "record-" + str(fact.get("factId", "unknown")),\n                                "kind": kind,\n                                "text": f"{record.get('label', record.get('kind', 'record'))}: {value}",\n                                "semantic_types": [],\n                                "trust_level": fact.get("trustLevel"),\n                                "protected": False,\n                                "source": "confirmed-profile-record",\n                                "updated_at": fact.get("updatedAt", self._now().isoformat()),\n                            },\n                        )\n                    )\n\n        blocked_protected = 0'''
          if text.count(candidates_marker) != 1:
              raise SystemExit("AI governance candidates marker missing")
          text = text.replace(candidates_marker, candidates_new, 1)
          # Existing graph candidate scoring discarded runtime candidate base scores; preserve a strong base for runtime/JD evidence.
          score_marker = '''            score = (0.8 if semantic_match else 0.15 * overlap) + (\n                0.2 * overlap if semantic_match else 0\n            )\n            candidates.append((score, node))'''
          # Only applies to graph nodes, so leave it; runtime candidates are already in candidates.
          if text.count(score_marker) != 1:
              raise SystemExit("AI governance graph score marker missing")
          context_call = '''            semantic_type=semantic_type,\n            config=config,\n        )'''
          context_call_new = '''            semantic_type=semantic_type,\n            page_context=str(request.get("pageContext", "")),\n            config=config,\n        )'''
          if text.count(context_call) != 1:
              raise SystemExit("AI governance context call marker missing")
          text = text.replace(context_call, context_call_new, 1)
          governance.write_text(text)

          # Provider instructions: answer directly using live job context and candidate evidence while retaining claim grounding.
          providers = Path("apps/native-host/src/munshi_apply_native/providers.py")
          text = providers.read_text()
          old_instructions = '''                "You draft one job-application answer using only the supplied evidence. "\n                "Do not add facts, metrics, employers, dates, credentials, immigration facts, "\n                "or claims that are not supported by the supplied evidence. Every factual claim "\n                "must cite one or more supplied evidenceId values in the structured claims array."'''
          new_instructions = '''                "Draft one direct, natural, professional job-application answer to the supplied question. "\n                "Use the current job/company context together with the candidate evidence when relevant. "\n                "Do not invent facts, metrics, employers, dates, credentials, immigration facts, motives, or claims. "\n                "For career-transition questions, stay constructive and future-focused; do not criticize an employer unless evidence explicitly requires it. "\n                "Avoid generic filler and do not mention the evidence system. Every factual claim must cite one or more supplied evidenceId values in the structured claims array."'''
          if text.count(old_instructions) != 1:
              raise SystemExit("provider instructions marker missing")
          providers.write_text(text.replace(old_instructions, new_instructions, 1))

          # Semantic regressions.
          semantic_test = Path("packages/semantic-engine/src/index.test.ts")
          text = semantic_test.read_text()
          addition = '''\n  it("recognizes live graduation and career-transition prompts", () => {\n    expect(\n      classifyQuestion("When did you / when do you Graduate from University? *"),\n    ).toMatchObject({ semanticType: "GRADUATION_DATE", matchedRule: "graduation" });\n    expect(\n      classifyQuestion("Why are you looking to leave your current employer? *"),\n    ).toMatchObject({ semanticType: "CAREER_GOALS", matchedRule: "leave-current-employer" });\n  });\n'''
          pos = text.rfind('  it("leaves novel questions unknown')
          if pos < 0:
              raise SystemExit("semantic test insertion marker missing")
          semantic_test.write_text(text[:pos] + addition + text[pos:])

          # Resolver regressions.
          resolver_test = Path("packages/application-model/src/resolver.test.ts")
          text = resolver_test.read_text()
          addition = '''\n  it("uses LinkedIn as the owner default referral source", () => {\n    const result = resolveProfileAnswer(\n      question({ semanticType: "REFERRAL", rawText: "How did you hear about us? *" }),\n      profile([]),\n    );\n    expect(result).toMatchObject({ state: "READY", value: "LinkedIn", sourceKey: "owner_default_referral" });\n  });\n\n  it("fills an explicitly saved salary acceptance answer", () => {\n    const result = resolveProfileAnswer(\n      question({\n        semanticType: "SALARY_EXPECTATION",\n        rawText: "Are you happy to accept an annual base salary of $55,000 + commission? *",\n        sensitive: true,\n        requiresReview: true,\n      }),\n      profile([\n        fact({\n          key: "salary_expectation",\n          value: "Yes",\n          category: "SAVED_ANSWER",\n          protected: false,\n        }),\n      ]),\n    );\n    expect(result).toMatchObject({ state: "READY", value: "Yes", sourceKey: "salary_expectation" });\n  });\n'''
          pos = text.rfind('  it("does not promote generated facts')
          if pos < 0:
              raise SystemExit("resolver test insertion marker missing")
          resolver_test.write_text(text[:pos] + addition + text[pos:])

          # Scanner regressions model the live Levin custom dropdown and radio layouts.
          scanner_test = Path("apps/extension/src/content/scanner.test.ts")
          text = scanner_test.read_text()
          addition = '''\n  it("recovers a nearby prompt for a custom select instead of its placeholder", () => {\n    document.body.innerHTML = `\n      <div class="question-field">\n        <label>How did you hear about us? *</label>\n        <div id="source" role="combobox" aria-haspopup="listbox" aria-label="-- Select one --"></div>\n      </div>\n    `;\n    const question = scanDocument().questions[0];\n    expect(question).toMatchObject({\n      rawText: "How did you hear about us? *",\n      semanticType: "REFERRAL",\n    });\n  });\n\n  it("uses the radio-group prompt instead of Yes or No option labels", () => {\n    document.body.innerHTML = `\n      <div class="question-field">\n        <p>Would you require any Visa sponsorship now or in the future? *</p>\n        <label><input type="radio" name="sponsor" value="Yes"> Yes</label>\n        <label><input type="radio" name="sponsor" value="No"> No</label>\n      </div>\n    `;\n    const result = scanDocument();\n    expect(result.questions).toHaveLength(1);\n    expect(result.questions[0]).toMatchObject({\n      rawText: "Would you require any Visa sponsorship now or in the future? *",\n      semanticType: "SPONSORSHIP_FUTURE",\n    });\n  });\n\n  it("captures bounded visible page text for AI job context", () => {\n    document.body.innerHTML = `<main><h1>Recruiter</h1><p>Build relationships with candidates and clients.</p><label for="why">Why this role?</label><textarea id="why"></textarea></main>`;\n    expect(scanDocument().pageContext).toContain("Build relationships with candidates and clients.");\n  });\n'''
          pos = text.rfind('  it("does not treat an application-entry')
          if pos < 0:
              raise SystemExit("scanner test insertion marker missing")
          scanner_test.write_text(text[:pos] + addition + text[pos:])

          # Fill regressions: controlled radio clicks and Levin-style display date.
          fill_test = Path("apps/extension/src/content/fill.test.ts")
          text = fill_test.read_text()
          addition = '''\n  it("fills a date-like text widget using the employer display format", async () => {\n    document.body.innerHTML = `\n      <label for="available">When are you available to start this role?</label>\n      <input id="available" type="text" placeholder="MM/DD/YYYY">\n    `;\n    const input = document.getElementById("available") as HTMLInputElement;\n    input.addEventListener("input", () => {\n      input.setAttribute("aria-invalid", input.value === "12/17/2026" ? "false" : "true");\n    });\n    const question = scanDocument().questions[0]!;\n    const result = await applyFillInstructions(\n      [{ controlId: question.controlId, frameId: 0, value: "2026-12-17", sensitive: false, approved: true }],\n      { verificationTimeoutMs: 80, pollIntervalMs: 5 },\n    );\n    expect(result[0]?.status).toBe("FILLED");\n    expect(input.value).toBe("12/17/2026");\n  });\n\n  it("uses a real click for a controlled native radio group", async () => {\n    document.body.innerHTML = `\n      <fieldset><legend>Are you happy to accept the salary?</legend>\n        <label><input type="radio" name="salary" value="Yes"> Yes</label>\n        <label><input type="radio" name="salary" value="No"> No</label>\n      </fieldset>\n    `;\n    const yes = document.querySelector<HTMLInputElement>('input[value="Yes"]')!;\n    let clicks = 0;\n    yes.addEventListener("click", () => { clicks += 1; });\n    const question = scanDocument().questions[0]!;\n    const result = await applyFillInstructions([{ controlId: question.controlId, frameId: 0, value: "Yes", sensitive: true, approved: true }]);\n    expect(result[0]?.status).toBe("FILLED");\n    expect(clicks).toBeGreaterThan(0);\n    expect(yes.checked).toBe(true);\n  });\n'''
          pos = text.rfind('  it("reports only whether a file has been selected')
          if pos < 0:
              raise SystemExit("fill test insertion marker missing")
          fill_test.write_text(text[:pos] + addition + text[pos:])

          # Native AI regression: page + confirmed profile evidence works without pre-seeded graph nodes.
          ai_test = Path("apps/native-host/tests/test_ai_governance.py")
          text = ai_test.read_text()
          addition = '''\n\ndef test_preview_uses_live_job_context_and_confirmed_profile_without_seeded_evidence(\n    tmp_path: Path, monkeypatch: pytest.MonkeyPatch\n) -> None:\n    database = create_database(tmp_path)\n    store = configured_store(tmp_path, monkeypatch)\n    from munshi_apply_native.profile_store import ProfileStore\n\n    ProfileStore(database).save(\n        {\n            "profileId": "profile-1",\n            "displayName": "Aadil",\n            "facts": [\n                {\n                    "factId": "skills-1",\n                    "key": "skills",\n                    "value": "recruiting operations, people analytics",\n                    "category": "SKILL",\n                    "trustLevel": "USER_CONFIRMED",\n                    "source": "profile",\n                    "confirmedAt": FIXED_NOW.isoformat(),\n                    "updatedAt": FIXED_NOW.isoformat(),\n                    "protected": False,\n                }\n            ],\n            "records": [],\n            "recordTombstones": [],\n            "createdAt": FIXED_NOW.isoformat(),\n            "updatedAt": FIXED_NOW.isoformat(),\n            "schemaVersion": 1,\n            "snapshotVersion": 1,\n        }\n    )\n    payload = request("CAREER_GOALS")\n    payload["question"] = "Why are you looking to leave your current employer?"\n    payload["pageContext"] = "Recruiter role focused on candidate relationships, business development, and career growth."\n    result = service(database, store).preview(payload)\n    assert result["state"] == "READY_FOR_PROVIDER"\n    assert len(result["evidenceIds"]) >= 2\n    assert any(item.startswith("job-context-") for item in result["evidenceIds"])\n    assert any(item.startswith("profile-") for item in result["evidenceIds"])\n'''
          ai_test.write_text(text + addition)

          PY
      - name: Format repaired source
        run: npm run format
      - name: Verify extension and shared packages
        run: npm run check
      - name: Verify native companion
        shell: bash
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Publish verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/live-ats-deep-repair.yml
          git add apps packages
          git commit -m "fix: harden live ATS controls and AI drafting"
          git push origin HEAD:feat/v3-foundation-alignment
