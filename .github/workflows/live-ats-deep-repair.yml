name: Live ATS deep repair

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/live-ats-deep-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Apply live ATS deep repair
        shell: bash
        run: |
