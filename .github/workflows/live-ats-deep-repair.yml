name: Live ATS deep repair

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths:
      - .github/workflows/live-ats-deep-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Apply live ATS deep repair
        run: python .github/live_ats_deep_repair.py
      - name: Normalize generated regex
        run: python -c 'from pathlib import Path; p=Path("apps/extension/src/content/adaptive.ts"); s=p.read_text(); p.write_text(s.replace("[\\/-]", "[-/]"))'
      - name: Format repaired source
        run: npm run format
      - name: Verify extension and shared packages
        run: npm run check
      - name: Verify native companion
        shell: bash
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Publish verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/live_ats_deep_repair.py
          git rm .github/workflows/live-ats-deep-repair.yml
          git add apps packages
          git commit -m "fix: harden live ATS controls and AI drafting"
          git push origin HEAD:feat/v3-foundation-alignment
