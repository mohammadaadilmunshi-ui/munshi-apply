name: One-time live ATS reliability repair v5

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/live-ats-reliability-repair-v5.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply robust live ATS repair
        run: python scripts/apply-live-ats-reliability-repair.py

      - name: Apply verified type and active-challenge test refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          sw_path = Path('apps/extension/src/background/service-worker.ts')
          text = sw_path.read_text()
          adapter = text.index('const contentRuntimeApi: ContentRuntimeApi = {')
          start = text.index('  executeScript: async (details) => {', adapter)
          end = text.index('\n  },\n};', start) + len('\n  },')
          replacement = '''  executeScript: async (details) => {
            if (!chrome.scripting?.executeScript) {
              throw new Error("Content runtime recovery is unavailable");
            }
            if (details.target.allFrames === true) {
              return chrome.scripting.executeScript({
                target: { tabId: details.target.tabId, allFrames: true },
                files: details.files,
              });
            }
            return chrome.scripting.executeScript({
              target: {
                tabId: details.target.tabId,
                frameIds: details.target.frameIds ?? [0],
              },
              files: details.files,
            });
          },'''
          sw_path.write_text(text[:start] + replacement + text[end:])

          test_path = Path('apps/extension/src/content/scanner.test.ts')
          tests = test_path.read_text()
          old = '''  it("detects a visible active CAPTCHA challenge", () => {
            document.body.innerHTML = `
              <iframe title="recaptcha challenge" src="https://www.google.com/recaptcha/api2/bframe"></iframe>
            `;
            expect(scanDocument().securityCheckpoint).toBe("CAPTCHA");
          });'''
          new = '''  it("detects a visible active CAPTCHA challenge", () => {
            document.body.innerHTML = `
              <iframe title="recaptcha challenge" src="https://www.google.com/recaptcha/api2/bframe"></iframe>
            `;
            const frame = document.querySelector("iframe") as HTMLIFrameElement;
            vi.spyOn(frame, "getBoundingClientRect").mockReturnValue({
              ...visibleRectangle,
              bottom: 310,
              height: 300,
              right: 410,
              width: 400,
            });
            expect(scanDocument().securityCheckpoint).toBe("CAPTCHA");
          });'''
          if tests.count(old) != 1:
              raise SystemExit('Expected active CAPTCHA regression test exactly once')
          test_path.write_text(tests.replace(old, new, 1))
          PY

      - name: Install locked extension dependencies
        run: npm ci

      - name: Format repaired source
        run: npm run format

      - name: Run complete extension and shared verification
        run: npm run check

      - name: Verify hosted owner workspace
        shell: bash
        run: |
          cd apps/owner-workspace
          npm run install:ci
          npm run lint
          npm test
          npm run validate:artifact

      - name: Verify native companion and repository safety
        shell: bash
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
          ./scripts/repository-safety.sh
          node scripts/secret-scan.mjs

      - name: Publish verified live ATS repair
        shell: bash
        run: |
          rm .github/workflows/live-ats-reliability-repair.yml
          rm .github/workflows/live-ats-reliability-repair-v2.yml
          rm .github/workflows/live-ats-reliability-repair-v3.yml
          rm .github/workflows/live-ats-reliability-repair-v4.yml
          rm .github/workflows/live-ats-reliability-repair-v5.yml
          rm scripts/apply-live-ats-reliability-repair.py
          git config user.name 'Aadil Munshi'
          git config user.email 'mohammadaadilmunshi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden live ATS runtime recovery and autofill'
          git push origin HEAD:feat/v3-foundation-alignment
