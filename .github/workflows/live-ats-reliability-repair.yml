name: One-time live ATS reliability repair

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/live-ats-reliability-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply live ATS reliability repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          # Desktop permission for recovery injection after an unpacked-extension reload.
          manifest_path = Path('apps/extension/public/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          permissions = list(manifest.get('permissions', []))
          if 'scripting' not in permissions:
              insertion = permissions.index('sidePanel') + 1 if 'sidePanel' in permissions else len(permissions)
              permissions.insert(insertion, 'scripting')
          manifest['permissions'] = permissions
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          build_path = Path('apps/extension/scripts/build-extension.mjs')
          build_text = build_path.read_text()
          build_text = replace_once(
              build_text,
              '!["nativeMessaging", "sidePanel", "webNavigation"].includes(permission),',
              '!["nativeMessaging", "sidePanel", "scripting", "webNavigation"].includes(\n      permission,\n    ),',
              'mobile scripting permission filter',
          )
          build_path.write_text(build_text)

          # Recover missing content-script receivers instead of surfacing Chromium's
          # "Receiving end does not exist" error to the owner.
          runtime_path = Path('apps/extension/src/background/content-runtime.ts')
          runtime_path.write_text(r'''export type ContentRuntimeApi = {
            sendMessage<T>(
              tabId: number,
              message: unknown,
              options: { frameId: number },
            ): Promise<T>;
            executeScript(details: {
              target: { tabId: number; frameIds?: number[]; allFrames?: boolean };
              files: string[];
            }): Promise<unknown>;
          };

          const CONTENT_SCRIPT_FILE = "content/bootstrap.js";

          export function isMissingContentReceiverError(error: unknown): boolean {
            const message = error instanceof Error ? error.message : String(error ?? "");
            return /could not establish connection|receiving end does not exist/i.test(message);
          }

          function injectedFrameIds(result: unknown): number[] {
            if (!Array.isArray(result)) return [];
            return result
              .map((entry) =>
                entry && typeof entry === "object" && "frameId" in entry
                  ? Number((entry as { frameId?: unknown }).frameId)
                  : Number.NaN,
              )
              .filter((frameId) => Number.isSafeInteger(frameId) && frameId >= 0);
          }

          export async function sendWithContentRecovery<T>(
            api: ContentRuntimeApi,
            tabId: number,
            frameId: number,
            message: unknown,
          ): Promise<T> {
            try {
              return await api.sendMessage<T>(tabId, message, { frameId });
            } catch (error) {
              if (!isMissingContentReceiverError(error)) throw error;
            }

            await api.executeScript({
              target: { tabId, frameIds: [frameId] },
              files: [CONTENT_SCRIPT_FILE],
            });
            return api.sendMessage<T>(tabId, message, { frameId });
          }

          export async function ensureTabContentRuntime(
            api: ContentRuntimeApi,
            tabId: number,
          ): Promise<void> {
            let framesToScan = [0];
            try {
              await api.sendMessage(tabId, { type: "CONTENT_PING" }, { frameId: 0 });
            } catch (error) {
              if (!isMissingContentReceiverError(error)) throw error;
              try {
                const injected = await api.executeScript({
                  target: { tabId, allFrames: true },
                  files: [CONTENT_SCRIPT_FILE],
                });
                framesToScan = [...new Set([0, ...injectedFrameIds(injected)])];
              } catch {
                await api.executeScript({
                  target: { tabId, frameIds: [0] },
                  files: [CONTENT_SCRIPT_FILE],
                });
                framesToScan = [0];
              }
            }

            for (const frameId of framesToScan) {
              try {
                await sendWithContentRecovery(
                  api,
                  tabId,
                  frameId,
                  { type: "CONTENT_SCAN_NOW" },
                );
              } catch (error) {
                if (frameId === 0) throw error;
              }
            }
          }
          ''')

          runtime_test_path = Path('apps/extension/src/background/content-runtime.test.ts')
          runtime_test_path.write_text(r'''import { describe, expect, it, vi } from "vitest";
          import {
            ensureTabContentRuntime,
            isMissingContentReceiverError,
            sendWithContentRecovery,
            type ContentRuntimeApi,
          } from "./content-runtime";

          function api(): ContentRuntimeApi & {
            sendMessage: ReturnType<typeof vi.fn>;
            executeScript: ReturnType<typeof vi.fn>;
          } {
            return {
              sendMessage: vi.fn(),
              executeScript: vi.fn(),
            } as unknown as ContentRuntimeApi & {
              sendMessage: ReturnType<typeof vi.fn>;
              executeScript: ReturnType<typeof vi.fn>;
            };
          }

          describe("content runtime recovery", () => {
            it("recognizes Chromium's missing receiver error", () => {
              expect(
                isMissingContentReceiverError(
                  new Error("Could not establish connection. Receiving end does not exist."),
                ),
              ).toBe(true);
              expect(isMissingContentReceiverError(new Error("Permission denied"))).toBe(false);
            });

            it("does not inject when the content receiver is healthy", async () => {
              const runtime = api();
              runtime.sendMessage.mockResolvedValue({ ok: true });
              await expect(
                sendWithContentRecovery(runtime, 3, 0, { type: "TEST" }),
              ).resolves.toEqual({ ok: true });
              expect(runtime.executeScript).not.toHaveBeenCalled();
            });

            it("reinjects the target frame and retries after a missing receiver", async () => {
              const runtime = api();
              runtime.sendMessage
                .mockRejectedValueOnce(
                  new Error("Could not establish connection. Receiving end does not exist."),
                )
                .mockResolvedValueOnce({ result: "recovered" });
              runtime.executeScript.mockResolvedValue([{ frameId: 2 }]);
              await expect(
                sendWithContentRecovery(runtime, 7, 2, { type: "TEST" }),
              ).resolves.toEqual({ result: "recovered" });
              expect(runtime.executeScript).toHaveBeenCalledWith({
                target: { tabId: 7, frameIds: [2] },
                files: ["content/bootstrap.js"],
              });
            });

            it("does not hide non-receiver messaging failures", async () => {
              const runtime = api();
              runtime.sendMessage.mockRejectedValue(new Error("Permission denied"));
              await expect(
                sendWithContentRecovery(runtime, 7, 0, { type: "TEST" }),
              ).rejects.toThrow("Permission denied");
              expect(runtime.executeScript).not.toHaveBeenCalled();
            });

            it("restores all accessible frames after an extension reload and forces scans", async () => {
              const runtime = api();
              runtime.sendMessage
                .mockRejectedValueOnce(
                  new Error("Could not establish connection. Receiving end does not exist."),
                )
                .mockResolvedValue({ ok: true });
              runtime.executeScript.mockResolvedValue([{ frameId: 0 }, { frameId: 4 }]);
              await ensureTabContentRuntime(runtime, 11);
              expect(runtime.executeScript).toHaveBeenCalledWith({
                target: { tabId: 11, allFrames: true },
                files: ["content/bootstrap.js"],
              });
              expect(runtime.sendMessage).toHaveBeenCalledWith(
                11,
                { type: "CONTENT_SCAN_NOW" },
                { frameId: 0 },
              );
              expect(runtime.sendMessage).toHaveBeenCalledWith(
                11,
                { type: "CONTENT_SCAN_NOW" },
                { frameId: 4 },
              );
            });
          });
          ''')

          # Forced post-action snapshots can no longer be starved by a mutation storm.
          bootstrap_path = Path('apps/extension/src/content/bootstrap.ts')
          bootstrap_path.write_text(r'''import type {
            ExtensionRequest,
            FillInstruction,
          } from "@munshi-apply/contracts";
          import { applyFillInstructions, assistFilePicker } from "./fill";
          import { refreshFileFingerprint } from "./adaptive";
          import { applyNavigationAction } from "./navigation";
          import { scanDocument, snapshotFingerprint } from "./scanner";

          const SCAN_DEBOUNCE_MS = 150;
          const MAX_SCAN_DEBOUNCE_MS = 600;
          let previousFingerprint = "";
          let pending: number | undefined;
          let debounceStartedAt = 0;
          let scanQueue: Promise<void> = Promise.resolve();

          async function publishSnapshot(force = false): Promise<void> {
            const page = scanDocument();
            const fingerprint = snapshotFingerprint(page);
            if (!force && fingerprint === previousFingerprint) return;
            previousFingerprint = fingerprint;
            const request: ExtensionRequest = { type: "PAGE_SNAPSHOT", payload: page };
            try {
              await chrome.runtime.sendMessage(request);
            } catch {
              // A valid service worker may be temporarily restarting. Recovery is
              // initiated from the background before the next owner action.
            }
          }

          function enqueueSnapshot(force: boolean): Promise<void> {
            scanQueue = scanQueue
              .catch(() => undefined)
              .then(() => publishSnapshot(force));
            return scanQueue;
          }

          function clearPendingScan(): void {
            if (pending !== undefined) window.clearTimeout(pending);
            pending = undefined;
          }

          function scheduleScan(force = false): void {
            if (force) {
              clearPendingScan();
              debounceStartedAt = 0;
              void enqueueSnapshot(true);
              return;
            }

            const current = Date.now();
            if (debounceStartedAt === 0) debounceStartedAt = current;
            const elapsed = current - debounceStartedAt;
            if (elapsed >= MAX_SCAN_DEBOUNCE_MS) {
              clearPendingScan();
              debounceStartedAt = 0;
              void enqueueSnapshot(false);
              return;
            }

            clearPendingScan();
            pending = window.setTimeout(() => {
              pending = undefined;
              debounceStartedAt = 0;
              void enqueueSnapshot(false);
            }, Math.min(SCAN_DEBOUNCE_MS, MAX_SCAN_DEBOUNCE_MS - elapsed));
          }

          function wrapHistoryMethod(method: "pushState" | "replaceState"): void {
            const original = history[method].bind(history);
            history[method] = ((...args: Parameters<History["pushState"]>) => {
              original(...args);
              scheduleScan();
            }) as History["pushState"];
          }

          const observer = new MutationObserver(() => scheduleScan());
          observer.observe(document.documentElement, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: [
              "aria-activedescendant",
              "aria-busy",
              "aria-checked",
              "aria-expanded",
              "aria-hidden",
              "aria-invalid",
              "aria-label",
              "aria-labelledby",
              "aria-required",
              "aria-selected",
              "aria-valuetext",
              "class",
              "data-value",
              "disabled",
              "hidden",
              "name",
              "placeholder",
              "required",
              "style",
            ],
          });

          document.addEventListener("input", () => scheduleScan(), true);
          document.addEventListener(
            "change",
            (event) => {
              const target = event.target;
              if (target instanceof HTMLInputElement && target.type === "file") {
                void refreshFileFingerprint(target).finally(() => scheduleScan(true));
                return;
              }
              scheduleScan();
            },
            true,
          );
          document.addEventListener("invalid", () => scheduleScan(true), true);
          document.addEventListener("blur", () => scheduleScan(), true);
          window.addEventListener("pageshow", () => scheduleScan(true));
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") scheduleScan(true);
          });
          window.addEventListener("popstate", () => scheduleScan());
          window.addEventListener("hashchange", () => scheduleScan());
          wrapHistoryMethod("pushState");
          wrapHistoryMethod("replaceState");
          void enqueueSnapshot(false);

          chrome.runtime.onMessage.addListener(
            (
              message: {
                type?: string;
                instructions?: FillInstruction[];
                controlId?: string;
              },
              _sender,
              sendResponse,
            ) => {
              if (message.type === "CONTENT_PING") {
                sendResponse({ ok: true });
                return false;
              }
              if (message.type === "CONTENT_SCAN_NOW") {
                void enqueueSnapshot(true)
                  .then(() => sendResponse({ ok: true }))
                  .catch((error: unknown) =>
                    sendResponse({
                      ok: false,
                      error: error instanceof Error ? error.message : "Scan failed",
                    }),
                  );
                return true;
              }
              if (message.type === "APPLY_FILL_INSTRUCTIONS" && message.instructions) {
                void applyFillInstructions(message.instructions)
                  .then((results) => {
                    sendResponse({ results });
                    scheduleScan(true);
                  })
                  .catch((error: unknown) => {
                    sendResponse({
                      results: message.instructions!.map((instruction) => ({
                        controlId: instruction.controlId,
                        status: "FAILED",
                        reason:
                          error instanceof Error
                            ? error.message
                            : "Guarded fill failed unexpectedly",
                      })),
                    });
                    scheduleScan(true);
                  });
                return true;
              }
              if (message.type === "APPLY_FILE_PICKER_ASSIST" && message.controlId) {
                sendResponse({ result: assistFilePicker(message.controlId) });
                scheduleScan(true);
                return false;
              }
              if (message.type === "APPLY_NAVIGATION_ACTION" && message.controlId) {
                sendResponse({ result: applyNavigationAction(message.controlId) });
                scheduleScan(true);
                return false;
              }
              return false;
            },
          );
          ''')

          # Wire background actions through receiver recovery and force a fresh scan
          # whenever the owner surface asks for the current application page.
          sw_path = Path('apps/extension/src/background/service-worker.ts')
          sw = sw_path.read_text()
          sw = replace_once(
              sw,
              'import {\n  AutoPilotController,\n  type AutoPilotResumeInput,\n  type AutoPilotStartInput,\n} from "./autopilot-controller";\n',
              'import {\n  AutoPilotController,\n  type AutoPilotResumeInput,\n  type AutoPilotStartInput,\n} from "./autopilot-controller";\nimport {\n  ensureTabContentRuntime,\n  sendWithContentRecovery,\n  type ContentRuntimeApi,\n} from "./content-runtime";\n',
              'service worker recovery import',
          )
          sw = replace_once(
              sw,
              'const supportsSidePanel =\n  typeof chrome.sidePanel?.setPanelBehavior === "function";\nconst AUTO_PILOT_RUNTIME_STORAGE_KEY = "autopilot-runtime-v1";\n',
              '''const supportsSidePanel =\n  typeof chrome.sidePanel?.setPanelBehavior === "function";\nconst AUTO_PILOT_RUNTIME_STORAGE_KEY = "autopilot-runtime-v1";\n\nconst contentRuntimeApi: ContentRuntimeApi = {\n  sendMessage: async <T>(\n    tabId: number,\n    message: unknown,\n    options: { frameId: number },\n  ): Promise<T> =>\n    (await chrome.tabs.sendMessage(tabId, message, options)) as T,\n  executeScript: async (details) => {\n    if (!chrome.scripting?.executeScript) {\n      throw new Error("Content runtime recovery is unavailable");\n    }\n    return chrome.scripting.executeScript(details);\n  },\n};\n''',
              'content runtime api',
          )
          sw = replace_once(
              sw,
              '''  const response = (await chrome.tabs.sendMessage(\n    tabId,\n    {\n      type: "APPLY_FILL_INSTRUCTIONS",\n      instructions: [instruction],\n    },\n    { frameId: instruction.frameId },\n  )) as { results?: FillResult[] } | undefined;''',
              '''  const response = await sendWithContentRecovery<{\n    results?: FillResult[];\n  } | undefined>(contentRuntimeApi, tabId, instruction.frameId, {\n    type: "APPLY_FILL_INSTRUCTIONS",\n    instructions: [instruction],\n  });''',
              'fill messaging recovery',
          )
          sw = replace_once(
              sw,
              '''  const response = (await chrome.tabs.sendMessage(\n    tabId,\n    { type: "APPLY_NAVIGATION_ACTION", controlId },\n    { frameId },\n  )) as\n    | {''',
              '''  const response = await sendWithContentRecovery<\n    | {''',
              'navigation messaging prefix',
          )
          sw = replace_once(
              sw,
              '''      }\n    | undefined;\n  if (!response?.result) {''',
              '''      }\n    | undefined\n  >(contentRuntimeApi, tabId, frameId, {\n    type: "APPLY_NAVIGATION_ACTION",\n    controlId,\n  });\n  if (!response?.result) {''',
              'navigation messaging suffix',
          )
          sw = replace_once(
              sw,
              '''  const response = (await chrome.tabs.sendMessage(\n    tabId,\n    { type: "APPLY_FILE_PICKER_ASSIST", controlId },\n    { frameId },\n  )) as { result?: unknown } | undefined;''',
              '''  const response = await sendWithContentRecovery<\n    { result?: unknown } | undefined\n  >(contentRuntimeApi, tabId, frameId, {\n    type: "APPLY_FILE_PICKER_ASSIST",\n    controlId,\n  });''',
              'file picker messaging recovery',
          )
          sw = replace_once(
              sw,
              '''async function getActivePage(): Promise<unknown> {\n  const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });\n  if (tab?.id === undefined || !/^https?:\\/\\//.test(tab.url ?? "")) return null;\n  const activePage = await getMergedPageForTab(tab.id);''',
              '''async function getActivePage(): Promise<unknown> {\n  const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });\n  if (tab?.id === undefined || !/^https?:\\/\\//.test(tab.url ?? "")) return null;\n  await ensureTabContentRuntime(contentRuntimeApi, tab.id);\n  const activePage = await getMergedPageForTab(tab.id);''',
              'active page receiver recovery',
          )
          sw = replace_once(
              sw,
              '''    const response = await chrome.tabs.sendMessage(\n      tab.id,\n      { type: "APPLY_FILL_INSTRUCTIONS", instructions },\n      { frameId },\n    );''',
              '''    const response = await sendWithContentRecovery<{ results?: unknown[] }>(\n      contentRuntimeApi,\n      tab.id,\n      frameId,\n      { type: "APPLY_FILL_INSTRUCTIONS", instructions },\n    );''',
              'manual plan messaging recovery',
          )
          sw = replace_once(
              sw,
              '''  const input: AutoPilotStartInput = {\n    tabId,''',
              '''  await ensureTabContentRuntime(contentRuntimeApi, tabId);\n  const input: AutoPilotStartInput = {\n    tabId,''',
              'autopilot start receiver recovery',
          )
          sw_path.write_text(sw)

          # Correct false CAPTCHA positives from hidden/transparent anti-bot frames.
          scanner_path = Path('apps/extension/src/content/scanner.ts')
          scanner = scanner_path.read_text()
          old_visible = r'''function isVisible(element: Element): boolean {
            if (!(element instanceof HTMLElement)) return false;
            const style = window.getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            if (
              element.hidden ||
              element.getAttribute("aria-hidden") === "true" ||
              style.display === "none" ||
              style.visibility === "hidden" ||
              style.opacity === "0" ||
              rect.width <= 0 ||
              rect.height <= 0
            ) {
              return false;
            }
            const explicitlyPositioned =
              style.position === "absolute" || style.position === "fixed";
            return !explicitlyPositioned || (rect.right > 0 && rect.bottom > 0);
          }'''
          new_visible = r'''function hiddenBySelfOrAncestor(element: HTMLElement): boolean {
            let current: HTMLElement | null = element;
            while (current) {
              const style = window.getComputedStyle(current);
              const opacity = Number.parseFloat(style.opacity || "1");
              if (
                current.hidden ||
                current.getAttribute("aria-hidden") === "true" ||
                style.display === "none" ||
                style.visibility === "hidden" ||
                style.visibility === "collapse" ||
                (Number.isFinite(opacity) && opacity <= 0.01)
              ) {
                return true;
              }
              current = current.parentElement;
            }
            return false;
          }

          function isVisible(element: Element): boolean {
            if (!(element instanceof HTMLElement)) return false;
            if (hiddenBySelfOrAncestor(element)) return false;
            const style = window.getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return false;
            const explicitlyPositioned =
              style.position === "absolute" || style.position === "fixed";
            return !explicitlyPositioned || (rect.right > 0 && rect.bottom > 0);
          }'''
          scanner = replace_once(scanner, old_visible, new_visible, 'ancestor visibility')

          old_captcha = r'''  return frames.some((frame) => {
            if (!isVisible(frame)) return false;
            const src = frame.getAttribute("src") ?? "";
            const descriptor = normalized(`${src} ${frame.getAttribute("title")}`);
            if (/\b(bframe|challenge|checkbox)\b/.test(descriptor)) return true;

            let captchaSize = "";
            try {
              captchaSize =
                new URL(src, window.location.href).searchParams.get("size") ?? "";
            } catch {
              captchaSize = "";
            }
            if (normalized(captchaSize) === "invisible") return false;
            if (frame.closest(".grecaptcha-badge")) return false;

            if (/recaptcha/.test(descriptor) && /\/anchor\b/.test(src)) {
              if (/^(normal|compact)$/i.test(captchaSize)) return true;
              const rect = frame.getBoundingClientRect();
              return rect.width >= 250 && rect.height >= 60;
            }

            const rect = frame.getBoundingClientRect();
            return rect.width >= 180 && rect.height >= 50;
          });'''
          new_captcha = r'''  return frames.some((frame) => {
            if (!isVisible(frame)) return false;
            const src = frame.getAttribute("src") ?? "";
            const descriptor = normalized(`${src} ${frame.getAttribute("title")}`);

            let captchaSize = "";
            try {
              captchaSize =
                new URL(src, window.location.href).searchParams.get("size") ?? "";
            } catch {
              captchaSize = "";
            }
            if (normalized(captchaSize) === "invisible") return false;
            if (frame.closest(".grecaptcha-badge")) return false;

            const rect = frame.getBoundingClientRect();
            if (/recaptcha/.test(descriptor) && /\/anchor\b/.test(src)) {
              if (/^(normal|compact)$/i.test(captchaSize)) {
                return rect.width >= 180 && rect.height >= 50;
              }
              return rect.width >= 250 && rect.height >= 60;
            }
            if (/\b(bframe|challenge|checkbox)\b/.test(descriptor)) {
              return rect.width >= 180 && rect.height >= 50;
            }
            return rect.width >= 180 && rect.height >= 50;
          });'''
          scanner = replace_once(scanner, old_captcha, new_captcha, 'active captcha frame heuristic')
          scanner_path.write_text(scanner)

          # Normalize visible required markers before semantic classification and
          # add a first-class pronoun concept instead of treating it as UNKNOWN.
          contracts_path = Path('packages/contracts/src/index.ts')
          contracts = contracts_path.read_text()
          contracts = replace_once(
              contracts,
              '  "PREFERRED_NAME",\n  "CONTACT",',
              '  "PREFERRED_NAME",\n  "PRONOUNS",\n  "CONTACT",',
              'semantic pronouns contract',
          )
          contracts_path.write_text(contracts)

          semantic_path = Path('packages/semantic-engine/src/index.ts')
          semantic = semantic_path.read_text()
          semantic = replace_once(
              semantic,
              '''  {\n    id: "full-name",''',
              '''  {\n    id: "pronouns",\n    pattern: /^(preferred )?pronouns?$/i,\n    semanticType: "PRONOUNS",\n  },\n  {\n    id: "full-name",''',
              'pronoun classification rule',
          )
          semantic = replace_once(
              semantic,
              '''function normalize(text: string): string {\n  return text.replace(/\\s+/g, " ").trim();\n}''',
              '''function normalize(text: string): string {\n  return text\n    .replace(/\\s+/g, " ")\n    .trim()\n    .replace(/\\s*\\*+\\s*$/, "")\n    .replace(/\\s*\\(?required\\)?\\s*$/i, "")\n    .replace(/\\s*:\\s*$/, "")\n    .trim();\n}''',
              'required marker normalization',
          )
          semantic_path.write_text(semantic)

          resolver_path = Path('packages/application-model/src/resolver.ts')
          resolver = resolver_path.read_text()
          resolver = replace_once(
              resolver,
              '  PREFERRED_NAME: "preferred_name",\n  CONTACT: "email",',
              '  PREFERRED_NAME: "preferred_name",\n  PRONOUNS: "pronouns",\n  CONTACT: "email",',
              'resolver pronouns mapping',
          )
          resolver = replace_once(
              resolver,
              '''  if (fact.protected) reasons.push("Source fact is protected");\n  if (fact.protected && !fact.confirmedAt) {\n    reasons.push("Protected source fact has not been explicitly confirmed");\n  }\n\n  const requiresReview =\n    question.requiresReview ||\n    question.sensitive ||\n    fact.protected ||\n    (fact.protected && !fact.confirmedAt);''',
              '''  if (fact.protected && !fact.confirmedAt) {\n    reasons.push("Protected source fact has not been explicitly confirmed");\n  }\n\n  const requiresReview =\n    question.requiresReview ||\n    question.sensitive ||\n    (fact.protected && !fact.confirmedAt);''',
              'confirmed protected fact policy',
          )
          resolver_path.write_text(resolver)

          desktop_profile_path = Path('apps/extension/src/sidepanel/App.tsx')
          desktop_profile = desktop_profile_path.read_text()
          desktop_profile = replace_once(
              desktop_profile,
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n  { section: "Identity", key: "legal_name",',
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n  { section: "Identity", key: "pronouns", label: "Preferred pronouns", category: "IDENTITY", protected: true },\n  { section: "Identity", key: "legal_name",',
              'desktop pronouns profile field',
          )
          desktop_profile_path.write_text(desktop_profile)

          mobile_profile_path = Path('apps/owner-workspace/app/workspace/mobile-workspace.tsx')
          mobile_profile = mobile_profile_path.read_text()
          mobile_profile = replace_once(
              mobile_profile,
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n  { section: "Identity", key: "legal_name",',
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n  { section: "Identity", key: "pronouns", label: "Preferred pronouns", category: "IDENTITY", protected: true },\n  { section: "Identity", key: "legal_name",',
              'mobile pronouns profile field',
          )
          old_mobile_map = '''const semanticFactKey: Record<string, string> = {\n  PERSONAL: "legal_name",\n  EMAIL: "email",\n  PHONE: "phone",\n  LINKEDIN: "linkedin",\n  PORTFOLIO: "portfolio",\n  WEBSITE: "portfolio",\n  WORK_AUTHORIZATION_CURRENT: "work_authorization",\n  SPONSORSHIP_CURRENT: "current_sponsorship",\n  SPONSORSHIP_FUTURE: "future_sponsorship",\n};'''
          new_mobile_map = '''const semanticFactKey: Record<string, string> = {\n  PERSONAL: "legal_name",\n  FIRST_NAME: "first_name",\n  MIDDLE_NAME: "middle_name",\n  LAST_NAME: "last_name",\n  PREFERRED_NAME: "preferred_name",\n  PRONOUNS: "pronouns",\n  EMAIL: "email",\n  PHONE: "phone",\n  STREET_ADDRESS: "street_address",\n  ADDRESS_LINE_2: "address_line_2",\n  CITY: "city",\n  STATE_PROVINCE: "state",\n  POSTAL_CODE: "postal_code",\n  COUNTRY: "country",\n  LINKEDIN: "linkedin",\n  PORTFOLIO: "portfolio",\n  WEBSITE: "portfolio",\n  WORK_AUTHORIZATION_CURRENT: "work_authorization",\n  SPONSORSHIP_CURRENT: "current_sponsorship",\n  SPONSORSHIP_FUTURE: "future_sponsorship",\n  IMMIGRATION_ASSISTANCE: "immigration_assistance",\n  START_DATE: "earliest_start_date",\n  NOTICE_PERIOD: "notice_period",\n  RELOCATION: "relocation_willingness",\n  TRAVEL: "travel_willingness",\n  REFERRAL: "referral_source",\n};'''
          mobile_profile = replace_once(mobile_profile, old_mobile_map, new_mobile_map, 'hosted semantic parity')
          mobile_profile_path.write_text(mobile_profile)

          # Regression coverage for the exact failure classes seen in the live Levin smoke test.
          semantic_test_path = Path('packages/semantic-engine/src/index.test.ts')
          semantic_tests = semantic_test_path.read_text()
          semantic_marker = 'describe("classifyQuestion", () => {'
          if semantic_marker not in semantic_tests:
              raise SystemExit('semantic test describe marker missing')
          if 'classifies required-marker identity labels from live ATS forms' not in semantic_tests:
              semantic_tests = semantic_tests.replace(
                  semantic_marker,
                  semantic_marker + r'''
            it("classifies required-marker identity labels from live ATS forms", () => {
              expect(classifyQuestion("First Name *").semanticType).toBe("FIRST_NAME");
              expect(classifyQuestion("Last Name*").semanticType).toBe("LAST_NAME");
              expect(classifyQuestion("Preferred Pronouns *").semanticType).toBe("PRONOUNS");
            });
          ''',
                  1,
              )
          semantic_test_path.write_text(semantic_tests)

          resolver_test_path = Path('packages/application-model/src/resolver.test.ts')
          resolver_tests = resolver_test_path.read_text()
          marker = '  it("forces protected facts through review even when confirmed", () => {'
          if marker not in resolver_tests:
              raise SystemExit('resolver protected test marker missing')
          if 'allows explicitly confirmed ordinary protected identity facts' not in resolver_tests:
              extra = r'''  it("allows explicitly confirmed ordinary protected identity facts", () => {
            const result = resolveProfileAnswer(
              question({ semanticType: "FIRST_NAME", rawText: "First Name *" }),
              profile([fact({ protected: true, confirmedAt: now })]),
            );
            expect(result.state).toBe("READY");
            expect(result.value).toBe("Aadil");
            expect(result.protected).toBe(true);
          });

          it("still reviews an ordinary protected identity fact without confirmation", () => {
            const result = resolveProfileAnswer(
              question({ semanticType: "FIRST_NAME", rawText: "First Name *" }),
              profile([fact({ protected: true, confirmedAt: null })]),
            );
            expect(result.state).toBe("REVIEW");
            expect(result.reasons).toContain(
              "Protected source fact has not been explicitly confirmed",
            );
          });

          '''
              resolver_tests = resolver_tests.replace(marker, extra + marker, 1)
          resolver_test_path.write_text(resolver_tests)

          scanner_test_path = Path('apps/extension/src/content/scanner.test.ts')
          scanner_tests = scanner_test_path.read_text()
          captcha_marker = '  it("detects a visible active CAPTCHA challenge", () => {'
          if captcha_marker not in scanner_tests:
              raise SystemExit('scanner active captcha marker missing')
          if 'ignores anti-bot challenge frames hidden by an ancestor' not in scanner_tests:
              extra = r'''  it("ignores anti-bot challenge frames hidden by an ancestor", () => {
            document.body.innerHTML = `
              <label for="first">First Name *</label>
              <input id="first" required>
              <div id="captcha-shell" style="opacity: 0">
                <iframe title="recaptcha challenge" src="https://www.google.com/recaptcha/api2/bframe"></iframe>
              </div>
            `;
            const frame = document.querySelector("iframe") as HTMLIFrameElement;
            vi.spyOn(frame, "getBoundingClientRect").mockReturnValue({
              ...visibleRectangle,
              bottom: 500,
              height: 400,
              right: 500,
              width: 400,
            });
            const result = scanDocument();
            expect(result.securityCheckpoint).toBeNull();
          });

          it("ignores an explicitly invisible CAPTCHA frame even when it has challenge tokens", () => {
            document.body.innerHTML = `
              <label for="email">Email Address *</label>
              <input id="email" type="email" required>
              <iframe title="recaptcha challenge" src="https://www.google.com/recaptcha/api2/bframe?size=invisible"></iframe>
            `;
            const frame = document.querySelector("iframe") as HTMLIFrameElement;
            vi.spyOn(frame, "getBoundingClientRect").mockReturnValue({
              ...visibleRectangle,
              bottom: 500,
              height: 400,
              right: 500,
              width: 400,
            });
            expect(scanDocument().securityCheckpoint).toBeNull();
          });

          '''
              scanner_tests = scanner_tests.replace(captcha_marker, extra + captcha_marker, 1)
          scanner_test_path.write_text(scanner_tests)

          report_path = Path('docs/reports/LIVE_ATS_RELIABILITY_REPAIR_2026-08-15.md')
          report_path.write_text('''# Live ATS reliability repair — 2026-08-15\n\n## Trigger\n\nA physical Edge smoke test on a Levin application exposed three independent failures that synthetic tests had not covered: a passive anti-bot frame was still classified as an active CAPTCHA, an extension reload left the already-open application tab without a valid content-script receiver, and continuous DOM mutation could starve the forced post-fill snapshot until AutoPilot timed out after filling only the email field. The same page also exposed required-marker labels such as `First Name *` and `Preferred Pronouns *` that the deterministic ontology did not classify correctly.\n\n## Repairs\n\n- Added desktop `scripting` permission solely for self-recovery of MUNSHI's own content script on an already-open HTTP(S) tab after extension reload. Missing-receiver errors now trigger targeted reinjection and retry instead of leaking Chromium's `Receiving end does not exist` error.\n- Active-page refresh and AutoPilot start force a live content-runtime check and current scan before acting.\n- Forced post-action snapshots are immediate and serialized; ordinary mutation scans use a bounded debounce so a continuously changing ATS cannot starve publication indefinitely.\n- CAPTCHA detection now respects hidden/transparent ancestors and evaluates `size=invisible`/passive badge exclusions before challenge-token heuristics. Genuine visible challenges remain owner checkpoints. No CAPTCHA solving, bypassing, or anti-bot evasion is implemented.\n- Semantic normalization strips visible required markers before classification, so labels such as `First Name *` and `Last Name *` resolve correctly.\n- Added first-class `PRONOUNS` semantics and a protected, explicitly confirmable profile field on desktop and hosted owner surfaces.\n- Privacy protection and application approval are no longer conflated: a protected ordinary fact that the owner explicitly confirmed can be deterministically ready; unconfirmed protected facts and sensitive/high-risk questions still require review. Sponsorship/work-authorization safety rules remain review-gated.\n- Hosted workspace deterministic lookup was aligned with desktop identity/address/referral mappings.\n\n## Safety boundary\n\nFinal submission, CAPTCHA, MFA, OTP, identity verification, authentication, operating-system file selection, and genuine security challenges remain deliberate owner actions. This repair improves detection and handoff reliability; it does not defeat site security.\n''')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Format repaired source
        run: npm run format

      - name: Run complete extension and shared verification
        run: npm run check

      - name: Verify hosted owner workspace
        shell: bash
        run: |
          cd apps/owner-workspace
          npm run install:ci
          npm run lint
          npm test
          npm run validate:artifact

      - name: Verify native companion and repository safety
        shell: bash
        run: |
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
          ./scripts/repository-safety.sh
          node scripts/secret-scan.mjs

      - name: Publish verified repair
        shell: bash
        run: |
          rm .github/workflows/live-ats-reliability-repair.yml
          git config user.name 'Aadil Munshi'
          git config user.email 'mohammadaadilmunshi@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden live ATS runtime recovery and autofill'
          git push origin HEAD:feat/v3-foundation-alignment
