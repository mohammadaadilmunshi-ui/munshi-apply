name: M1 correctness codemod

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply deterministic M1 profile correction
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/extension/src/sidepanel/App.tsx")
          text = path.read_text()

          old_field = '  { section: "Work authorization", key: "work_authorization", label: "Current work authorization", category: "WORK_AUTHORIZATION", protected: true },\n  { section: "Work authorization", key: "future_sponsorship", label: "Future sponsorship answer", category: "SPONSORSHIP", protected: true },'
          new_field = '  { section: "Work authorization", key: "work_authorization", label: "Current work authorization", category: "WORK_AUTHORIZATION", protected: true },\n  { section: "Work authorization", key: "current_sponsorship", label: "Current sponsorship requirement", category: "SPONSORSHIP", protected: true },\n  { section: "Work authorization", key: "future_sponsorship", label: "Future sponsorship answer", category: "SPONSORSHIP", protected: true },'
          if old_field not in text and 'key: "current_sponsorship"' not in text:
              raise SystemExit("Expected work-authorization profile block not found")
          if 'key: "current_sponsorship"' not in text:
              text = text.replace(old_field, new_field, 1)

          old_map = '  SPONSORSHIP_CURRENT: "immigration_assistance",'
          new_map = '  SPONSORSHIP_CURRENT: "current_sponsorship",'
          if old_map not in text and new_map not in text:
              raise SystemExit("Expected sponsorship semantic mapping not found")
          text = text.replace(old_map, new_map, 1)

          path.write_text(text)
      - run: npx prettier --write apps/extension/src/sidepanel/App.tsx
      - run: npm run typecheck --workspace @munshi-apply/extension
      - name: Commit correction if needed
        run: |
          if git diff --quiet; then
            echo "No codemod changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/sidepanel/App.tsx
          git commit -m "fix: model current sponsorship as a dedicated protected fact"
          git push origin HEAD:feat/v3-foundation-alignment
