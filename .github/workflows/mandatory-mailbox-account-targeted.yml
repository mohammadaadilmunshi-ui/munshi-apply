name: Mandatory Mailbox Account Targeted

on:
  push:
    branches:
      - feat/mandatory-mailbox-account-orchestrator-finalize-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native host
        run: python -m pip install -e './apps/native-host[dev]'
      - name: Lint artifact bridge
        run: python -m ruff check apps/native-host/src/munshi_apply_native/artifact_fetch_v2.py
      - name: Lint ATS lifecycle
        run: python -m ruff check apps/native-host/src/munshi_apply_native/ats_account_lifecycle.py
      - name: Diagnose hosted account orchestrator lint
        id: orchestrator_lint
        shell: bash
        run: |
          set +e
          python -m ruff check \
            apps/native-host/src/munshi_apply_native/hosted_account_orchestrator.py \
            --output-format=concise > ruff-hosted-account-orchestrator.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload orchestrator lint diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ruff-hosted-account-orchestrator
          path: ruff-hosted-account-orchestrator.txt
          if-no-files-found: error
      - name: Lint hosted account orchestrator
        if: steps.orchestrator_lint.outputs.exit_code != '0'
        run: |
          cat ruff-hosted-account-orchestrator.txt
          exit 1
      - name: Lint hosted account session
        run: python -m ruff check apps/native-host/src/munshi_apply_native/hosted_account_session.py
      - name: Lint hosted prepare worker
        run: python -m ruff check apps/native-host/src/munshi_apply_native/hosted_prepare_worker.py
      - name: Diagnose orchestrator tests lint
        id: orchestrator_tests_lint
        shell: bash
        run: |
          set +e
          python -m ruff check \
            apps/native-host/tests/test_hosted_account_orchestrator.py \
            --output-format=concise > ruff-hosted-account-orchestrator-tests.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload orchestrator tests lint diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: ruff-hosted-account-orchestrator-tests
          path: ruff-hosted-account-orchestrator-tests.txt
          if-no-files-found: error
      - name: Lint orchestrator tests
        if: steps.orchestrator_tests_lint.outputs.exit_code != '0'
        run: |
          cat ruff-hosted-account-orchestrator-tests.txt
          exit 1
      - name: Lint session tests
        run: python -m ruff check apps/native-host/tests/test_hosted_account_session.py
      - name: Compile account runtime
        run: |
          python -m py_compile             apps/native-host/src/munshi_apply_native/artifact_fetch_v2.py             apps/native-host/src/munshi_apply_native/ats_account_lifecycle.py             apps/native-host/src/munshi_apply_native/hosted_account_orchestrator.py             apps/native-host/src/munshi_apply_native/hosted_account_session.py             apps/native-host/src/munshi_apply_native/hosted_prepare_worker.py             apps/native-host/tests/test_hosted_account_orchestrator.py             apps/native-host/tests/test_hosted_account_session.py
      - name: Run focused account orchestration tests
        run: |
          python -m pytest -q             apps/native-host/tests/test_account_store.py             apps/native-host/tests/test_ats_account_lifecycle.py             apps/native-host/tests/test_account_verification_runtime.py             apps/native-host/tests/test_account_umbrella_e2e_v1.py             apps/native-host/tests/test_hosted_account_orchestrator.py             apps/native-host/tests/test_hosted_account_session.py             apps/native-host/tests/test_hosted_prepare_worker.py
