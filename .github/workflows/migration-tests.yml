name: Migration tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './apps/native-host[dev]'
      - name: Run migration, architecture-store, learning, and outbox tests
        run: >-
          python -m pytest
          apps/native-host/tests/test_database.py
          apps/native-host/tests/test_architecture_store.py
          apps/native-host/tests/test_learning_analytics_store.py
          apps/native-host/tests/test_outbox.py
          apps/native-host/tests/test_operations.py
