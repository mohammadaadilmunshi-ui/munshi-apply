name: Repair ambiguous title semantics

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - .github/workflows/patch-ambiguous-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - name: Separate honorific title from job title
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Anchor not found in {path_name}: {old!r}")
              path.write_text(text.replace(old, new, 1))

          replace(
              "packages/contracts/src/index.ts",
              '  "PREFERRED_NAME",\n  "PRONOUNS",',
              '  "PREFERRED_NAME",\n  "HONORIFIC",\n  "PRONOUNS",',
          )

          replace(
              "packages/semantic-engine/src/index.ts",
              '  {\n    id: "preferred-name",',
              '  {\n    id: "honorific",\n    pattern: /^(salutation|honorific)$/i,\n    semanticType: "HONORIFIC",\n  },\n  {\n    id: "preferred-name",',
          )
          replace(
              "packages/semantic-engine/src/index.ts",
              '      /^(title|job title|position title|current title|most recent title)$/i,',
              '      /^(job title|position title|current title|most recent title)$/i,',
          )
          replace(
              "packages/semantic-engine/src/index.ts",
              'const contextualRules: readonly Rule[] = [\n',
              'const contextualRules: readonly Rule[] = [\n'
              '  {\n'
              '    id: "personal-title-context",\n'
              '    pattern:\n'
              '      /\\b(basic information|personal information|candidate information|contact info(?:rmation)?)\\b.{0,160}\\btitle\\b/i,\n'
              '    semanticType: "HONORIFIC",\n'
              '  },\n'
              '  {\n'
              '    id: "employment-title-context",\n'
              '    pattern:\n'
              '      /\\b(work history|employment|experience|employer|company)\\b.{0,160}\\btitle\\b/i,\n'
              '    semanticType: "JOB_TITLE",\n'
              '  },\n',
          )

          replace(
              "packages/application-model/src/resolver.ts",
              '  PREFERRED_NAME: "preferred_name",\n  PRONOUNS: "pronouns",',
              '  PREFERRED_NAME: "preferred_name",\n  HONORIFIC: "honorific",\n  PRONOUNS: "pronouns",',
          )

          replace(
              "packages/application-model/src/application-detection.ts",
              '  "PREFERRED_NAME",\n  "EMAIL",',
              '  "PREFERRED_NAME",\n  "HONORIFIC",\n  "EMAIL",',
          )

          replace(
              "apps/extension/src/content/scanner.ts",
              '  "PREFERRED_NAME",\n  "CONTACT",',
              '  "PREFERRED_NAME",\n  "HONORIFIC",\n  "CONTACT",',
          )

          replace(
              "apps/extension/src/sidepanel/App.tsx",
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n',
              '  { section: "Identity", key: "preferred_name", label: "Preferred name", category: "IDENTITY", protected: false },\n'
              '  { section: "Identity", key: "honorific", label: "Title / honorific", category: "IDENTITY", protected: false },\n',
          )

          test_path = Path("packages/semantic-engine/src/application-fields.test.ts")
          test_text = test_path.read_text()
          anchor = 'describe("expanded application field semantics", () => {\n'
          if anchor not in test_text:
              raise SystemExit("Semantic application test anchor not found")
          test_text = test_text.replace(
              anchor,
              anchor
              + '  it("separates personal title from employment title using section context", () => {\n'
              + '    expect(classifyQuestion("Title", "Basic Information").semanticType).toBe(\n'
              + '      "HONORIFIC",\n'
              + '    );\n'
              + '    expect(classifyQuestion("Title", "Work History").semanticType).toBe(\n'
              + '      "JOB_TITLE",\n'
              + '    );\n'
              + '  });\n\n',
              1,
          )
          test_path.write_text(test_text)
          PY
      - name: Format and commit
        run: |
          npx prettier --write \
            packages/contracts/src/index.ts \
            packages/semantic-engine/src/index.ts \
            packages/semantic-engine/src/application-fields.test.ts \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/application-detection.ts \
            apps/extension/src/content/scanner.ts
          if git diff --quiet; then
            echo "No title-semantics changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/index.ts \
            packages/semantic-engine/src/index.ts \
            packages/semantic-engine/src/application-fields.test.ts \
            packages/application-model/src/resolver.ts \
            packages/application-model/src/application-detection.ts \
            apps/extension/src/content/scanner.ts \
            apps/extension/src/sidepanel/App.tsx
          git commit -m "fix: distinguish personal title from job title"
          git push origin HEAD:feat/v3-foundation-alignment
