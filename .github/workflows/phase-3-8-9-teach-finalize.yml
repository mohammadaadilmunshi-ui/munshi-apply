name: Phase 3 8 9 and Teach integration

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - scripts/phase_3_8_9_teach_finalize.py
      - scripts/phase_3_8_9_extension_wiring.py
      - scripts/phase_3_8_9_typecheck_fix.py
      - scripts/phase_3_8_9_teach_rewrite.py
      - scripts/phase_3_8_9_governance_compat_fix.py
      - scripts/phase_3_8_9_python_quality_fix.py
      - .github/workflows/phase-3-8-9-teach-finalize.yml

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply Phase 3 8 9 and Teach integration
        run: |
          python scripts/phase_3_8_9_teach_finalize.py
          python scripts/phase_3_8_9_extension_wiring.py
          python scripts/phase_3_8_9_typecheck_fix.py
          python scripts/phase_3_8_9_teach_rewrite.py
          python scripts/phase_3_8_9_governance_compat_fix.py
          python scripts/phase_3_8_9_python_quality_fix.py
      - name: Install locked Node dependencies
        run: npm ci
      - name: Format generated implementation
        run: npm run format
      - name: Verify TypeScript and browser workspaces
        run: npm run check
      - name: Install native companion
        run: python -m pip install -e './apps/native-host[dev]'
      - name: Normalize native Python
        run: |
          python -m ruff format apps/native-host
          python -m ruff check apps/native-host --fix
      - name: Verify native companion
        run: |
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit verified integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'No integration changes were produced.'
            exit 1
          fi
          git commit -m 'feat: complete evidence intelligence and response tranche'
          git fetch origin feat/v3-foundation-alignment
          git rebase origin/feat/v3-foundation-alignment
          git push origin HEAD:feat/v3-foundation-alignment
