name: Phase 5 6 12 implementation

on:
  push:
    branches:
      - feat/v3-foundation-alignment
    paths:
      - scripts/phase_5_6_12_practical_tranche.py
      - .github/workflows/phase-5-6-12-implementation.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply practical Phase 5/6/12 tranche
        run: python scripts/phase_5_6_12_practical_tranche.py
      - name: Normalize generated native test names
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/native-host/tests/test_interaction_recipe_service.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "def test_teach_munshi_saves_value_free_shadow_recipe_and_promotes_after_trial(tmp_path: Path) -> None:",
              "def test_taught_recipe_promotes_after_verified_trial(tmp_path: Path) -> None:",
          )
          content = content.replace(
              "def test_learning_mechanics_is_allowed_for_consequential_answer_types_but_not_security_controls(tmp_path: Path) -> None:",
              "def test_consequential_widgets_learn_but_security_controls_do_not(tmp_path: Path) -> None:",
          )
          path.write_text(content, encoding="utf-8")
          PY
      - name: Install locked Node dependencies
        run: npm ci
      - name: Format generated implementation
        run: npm run format
      - name: Verify TypeScript/browser workspace
        run: npm run check
      - name: Install native companion
        run: python -m pip install -e './apps/native-host[dev]'
      - name: Verify native companion
        run: |
          python -m ruff check apps/native-host
          python -m pytest apps/native-host
      - name: Verify patch hygiene
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages docs
          if git diff --cached --quiet; then
            echo 'No implementation changes were produced.'
            exit 1
          fi
          git commit -m 'feat: make AutoPilot practical and add Teach MUNSHI'
          git push origin HEAD:feat/v3-foundation-alignment
