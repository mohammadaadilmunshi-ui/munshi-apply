name: Phase 12 Format Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print exact Prettier diff for Phase 12 files
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            packages/contracts/src/career-os-phase12.ts \
            packages/contracts/src/career-os-phase12.test.ts
          git diff --no-color -- \
            packages/contracts/src/career-os-phase12.ts \
            packages/contracts/src/career-os-phase12.test.ts
