name: Phase 12 Format Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print exact inherited README Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write README.md
          git diff --no-color --stat -- README.md
          git diff --no-color -- README.md
