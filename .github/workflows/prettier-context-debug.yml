name: Prettier context debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print formatter diff
        run: |
          npx prettier apps/extension/src/background/job-context.test.ts apps/extension/src/background/job-context.ts apps/extension/src/storage/resume-vault.test.ts --write
          git diff -- apps/extension/src/background/job-context.test.ts apps/extension/src/background/job-context.ts apps/extension/src/storage/resume-vault.test.ts
