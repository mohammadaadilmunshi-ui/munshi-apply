name: Prettier debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print formatter diff
        run: |
          npx prettier packages/application-model/src/application-detection.ts --write
          git diff -- packages/application-model/src/application-detection.ts
