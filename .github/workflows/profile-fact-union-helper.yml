name: Profile fact union helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Guard repair inputs
        run: |
          test -f scripts/fix-profile-fact-union.py
          test -f scripts/fix-profile-fact-union-tie.py
          test -f .github/workflows/profile-fact-union-helper.yml
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
      - name: Install root dependencies
        run: npm ci
      - name: Apply profile fact union hardening
        run: |
          python3 scripts/fix-profile-fact-union.py
          python3 scripts/fix-profile-fact-union-tie.py
      - name: Format patched files
        run: |
          npx prettier --write \
            apps/extension/src/storage/profile-sync.ts \
            apps/extension/src/storage/profile-sync.test.ts \
            apps/owner-workspace/app/vault-client.ts \
            apps/owner-workspace/tests/profile-vault.test.mjs
      - name: Verify extension and shared packages
        run: npm run check
      - name: Install owner workspace dependencies
        working-directory: apps/owner-workspace
        run: npm run install:ci
      - name: Verify owner workspace
        working-directory: apps/owner-workspace
        run: |
          npm run lint
          npm test
          npm run validate:artifact
      - name: Remove temporary helper files
        run: |
          git rm -f \
            scripts/fix-profile-fact-union.py \
            scripts/fix-profile-fact-union-tie.py \
            .github/workflows/profile-fact-union-helper.yml
      - name: Commit clean hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/storage/profile-sync.ts \
            apps/extension/src/storage/profile-sync.test.ts \
            apps/owner-workspace/app/vault-client.ts \
            apps/owner-workspace/tests/profile-vault.test.mjs
          git diff --cached --check
          git commit -m "fix: preserve sparse cross-device profile facts"
          git push origin HEAD:feat/v3-foundation-alignment
