name: Profile save acknowledgement helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Guard expected staging head
        run: |
          test "$(git rev-parse HEAD)" = "c5327e3c20fe5f41420b604126ae40c7992b6b59" || {
            echo "Unexpected branch head; refusing to patch."
            exit 1
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Apply profile save acknowledgement repair
        run: python3 scripts/fix-profile-save-ack.py
      - name: Verify extension
        run: npm run check
      - name: Verify production artifact
        run: |
          npm run build
          node scripts/verify-artifacts.mjs
      - name: Remove temporary helper files
        run: git rm -f scripts/fix-profile-save-ack.py .github/workflows/profile-save-ack-helper.yml
      - name: Commit clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/background/service-worker.ts apps/extension/src/background/profile-save-ack.test.ts
          git diff --cached --check
          git commit -m "fix: acknowledge successful profile synchronization"
          git push origin HEAD:feat/v3-foundation-alignment
