name: Profile save route patch
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[profile-save-route]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - name: Patch SAVE_PROFILE acknowledgement truth
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/extension/src/background/service-worker.ts')
          source = path.read_text()

          old_import = 'import { mergeApplicationPages } from "./page-merge";\n'
          new_import = old_import + '''import {\n  localProfileSaveAck,\n  syncedProfileSaveAck,\n} from "../messaging/profile-save-ack";\n'''
          if source.count(old_import) != 1:
              raise SystemExit('Expected one page-merge import anchor')
          source = source.replace(old_import, new_import, 1)

          old = '''        const connection = await getCloudConnection();
          if (connection && (await isCloudEncryptionReady())) {
            try {
              const synchronized = await synchronizeProtectedProfile(
                connection,
                parsed,
              );
              await persistAuthoritativeProfileSnapshot(synchronized);
              if (!sameProfileSaveContent(synchronized, parsed)) {
                throw new Error(
                  "Profile content changed on another device. Refresh before saving again.",
                );
              }
              profileSyncConflict = null;
            } catch (error) {
              if (error instanceof ProtectedProfileConflictError) {
                rememberProfileConflict(error);
                return {
                  ok: true,
                  data: {
                    localSaved: true,
                    cloudSynced: false,
                    conflict: profileSyncConflict,
                  },
                };
              }
              throw error;
            }
          }
          return { ok: true, data: { localSaved: true, cloudSynced: true } };
'''
          new = '''        const connection = await getCloudConnection();
          const encryptionReady = connection
            ? await isCloudEncryptionReady()
            : false;
          if (!connection || !encryptionReady) {
            return {
              ok: true,
              data: localProfileSaveAck(profileSyncConflict),
            };
          }
          try {
            const synchronized = await synchronizeProtectedProfile(
              connection,
              parsed,
            );
            await persistAuthoritativeProfileSnapshot(synchronized);
            if (!sameProfileSaveContent(synchronized, parsed)) {
              throw new Error(
                "Profile content changed on another device. Refresh before saving again.",
              );
            }
            profileSyncConflict = null;
          } catch (error) {
            if (error instanceof ProtectedProfileConflictError) {
              rememberProfileConflict(error);
              return {
                ok: true,
                data: localProfileSaveAck(profileSyncConflict),
              };
            }
            throw error;
          }
          return { ok: true, data: syncedProfileSaveAck() };
'''
          if source.count(old) != 1:
              raise SystemExit('Expected one SAVE_PROFILE acknowledgement block')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit route patch
        run: |
          git config user.name "MUNSHI Apply CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src/background/service-worker.ts
          git diff --cached --check
          git commit -m "fix: make profile cloud save acknowledgement truthful [profile-save-route]"
          git push origin HEAD:feat/v3-foundation-alignment
