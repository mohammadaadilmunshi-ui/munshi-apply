name: Guarded profile sync UI patch
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact acknowledgement-driven UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/extension/src/sidepanel/App.tsx")
          text = path.read_text()

          old_autosave = (
              "        void saveProfile(profile)\n"
              "          .then(async () => {\n"
              "            const status = await getProfileSyncStatus();\n"
              "            setProfileSyncStatus(status);\n"
              "            if (profileRevision.current !== revision) return;\n"
              "            setProfileDirty(false);\n"
              "            setSaveState(\n"
              "              status.conflict\n"
              "                ? \"conflict\"\n"
              "                : cloud.status === \"connected\" && cloud.data.encryptionReady\n"
              "                  ? \"synced\"\n"
              "                  : \"local\",\n"
              "            );\n"
              "          })"
          )
          new_autosave = (
              "        void saveProfile(profile)\n"
              "          .then((acknowledgement) => {\n"
              "            const status: ProfileSyncStatus = {\n"
              "              conflict: acknowledgement.conflict,\n"
              "            };\n"
              "            setProfileSyncStatus(status);\n"
              "            if (profileRevision.current !== revision) return;\n"
              "            setProfileDirty(false);\n"
              "            setSaveState(\n"
              "              status.conflict\n"
              "                ? \"conflict\"\n"
              "                : acknowledgement.cloudSynced\n"
              "                  ? \"synced\"\n"
              "                  : \"local\",\n"
              "            );\n"
              "          })"
          )
          if text.count(old_autosave) != 1:
              raise SystemExit("autosave source block drifted; refusing blind patch")
          text = text.replace(old_autosave, new_autosave, 1)

          old_dependency = "  }, [cloud, profile, profileDirty, profileLoaded, retryTick]);"
          new_dependency = "  }, [profile, profileDirty, profileLoaded, retryTick]);"
          if text.count(old_dependency) != 1:
              raise SystemExit("autosave dependency block drifted; refusing blind patch")
          text = text.replace(old_dependency, new_dependency, 1)

          old_sync_now = (
              "    try {\n"
              "      await saveProfile(profile);\n"
              "      const syncStatus = await getProfileSyncStatus();\n"
              "      setProfileSyncStatus(syncStatus);\n"
              "      if (profileRevision.current === revision) {\n"
              "        setProfileDirty(false);\n"
              "        setSaveState(\n"
              "          syncStatus.conflict\n"
              "            ? \"conflict\"\n"
              "            : cloud.status === \"connected\" && cloud.data.encryptionReady\n"
              "              ? \"synced\"\n"
              "              : \"local\",\n"
              "        );\n"
              "      }\n"
              "    } catch (error) {"
          )
          new_sync_now = (
              "    try {\n"
              "      const acknowledgement = await saveProfile(profile);\n"
              "      const syncStatus: ProfileSyncStatus = {\n"
              "        conflict: acknowledgement.conflict,\n"
              "      };\n"
              "      setProfileSyncStatus(syncStatus);\n"
              "      if (profileRevision.current === revision) {\n"
              "        setProfileDirty(false);\n"
              "        setSaveState(\n"
              "          syncStatus.conflict\n"
              "            ? \"conflict\"\n"
              "            : acknowledgement.cloudSynced\n"
              "              ? \"synced\"\n"
              "              : \"local\",\n"
              "        );\n"
              "        if (!syncStatus.conflict) {\n"
              "          setNotice(\n"
              "            acknowledgement.cloudSynced\n"
              "              ? \"Profile saved locally and acknowledged by the encrypted workspace.\"\n"
              "              : \"Profile saved locally. The encrypted workspace has not acknowledged this save yet.\",\n"
              "          );\n"
              "        }\n"
              "      }\n"
              "    } catch (error) {"
          )
          if text.count(old_sync_now) != 1:
              raise SystemExit("manual sync source block drifted; refusing blind patch")
          text = text.replace(old_sync_now, new_sync_now, 1)

          path.write_text(text)
          PY
          npx prettier apps/extension/src/sidepanel/App.tsx --write
          git diff --check
          git diff -- apps/extension/src/sidepanel/App.tsx
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/profile-sync-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/sidepanel/App.tsx .github/workflows/profile-sync-ui-patch.yml
          git diff --cached --check
          git commit -m "fix: make profile sync status acknowledgement-driven"
          git push origin HEAD:feat/v3-foundation-alignment
