name: Release Format Probe

on:
  push:
    branches: [release/initial-dashboard-apply-rc-20260913]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write apps/extension/src/sidepanel/AutonomousApplyCredentials.tsx
          git diff -- apps/extension/src/sidepanel/AutonomousApplyCredentials.tsx
