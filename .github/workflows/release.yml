name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e './apps/native-host[dev]'
      - run: npm run check
      - run: python -m ruff check apps/native-host
      - run: python -m pytest apps/native-host
      - name: Package release assets
        run: python scripts/release-ops.py --version "${GITHUB_REF_NAME}" --output release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: "munshi-apply-${{ github.ref_name }}"
          path: release-assets
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --verify-tag
