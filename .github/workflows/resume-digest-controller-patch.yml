name: Resume digest controller patch
on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths:
      - .github/workflows/resume-digest-controller-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add resume digest navigation guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/extension/src/background/autopilot-controller.ts")
          source = path.read_text()

          import_anchor = '''import type {
  ApplicationPage,
  FillInstruction,
  FillResult,
  NavigationCandidate,
} from "@munshi-apply/contracts";
'''
          import_replacement = import_anchor + '''import {
  resumeVerificationBlocksNavigation,
  verifySelectedResumeFile,
} from "./resume-file-verification";
'''
          if source.count(import_anchor) != 1:
              raise SystemExit("Expected one AutoPilot contracts import anchor")
          source = source.replace(import_anchor, import_replacement, 1)

          navigation_anchor = '''      case "NAVIGATE_NEXT": {
        const candidate = safeForwardCandidate(page);
'''
          navigation_replacement = '''      case "NAVIGATE_NEXT": {
        const resumeVerification = verifySelectedResumeFile({
          page,
          selectedResumeSha256: runtime.session.selectedResumeSha256,
        });
        if (resumeVerificationBlocksNavigation(resumeVerification)) {
          return this.persistPause(runtime, observation, {
            type: "REVIEW",
            reason: `${resumeVerification.reason}. Select the résumé chosen for this application, wait for verification to finish, then Resume AutoPilot.`,
          });
        }
        const candidate = safeForwardCandidate(page);
'''
          if source.count(navigation_anchor) != 1:
              raise SystemExit("Expected one AutoPilot navigation case anchor")
          path.write_text(source.replace(navigation_anchor, navigation_replacement, 1))
          PY
          npx prettier apps/extension/src/background/autopilot-controller.ts --write
      - name: Run resume and AutoPilot tests
        run: |
          npx vitest run apps/extension/src/background/resume-file-verification.test.ts apps/extension/src/background/autopilot-controller.test.ts
      - name: Commit controller integration
        run: |
          git config user.name "MUNSHI Apply CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/extension/src/background/autopilot-controller.ts
          git diff --cached --check
          git commit -m "fix: verify application resume before AutoPilot navigation"
          git fetch origin feat/v3-foundation-alignment
          git rebase origin/feat/v3-foundation-alignment
          rm .github/workflows/resume-digest-controller-patch.yml
          git add .github/workflows/resume-digest-controller-patch.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/v3-foundation-alignment
