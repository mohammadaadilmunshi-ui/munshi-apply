name: Resume vault delete repair v2

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/resume-vault-delete-repair-v2.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Apply résumé delete feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 target in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          # Owner vault client: tombstone metadata + DELETE request helper.
          replace_once(
              "apps/owner-workspace/app/vault-client.ts",
              "  addedAt: string;\n};\n\nexport type ApplicationSnapshot",
              "  addedAt: string;\n  deletedAt?: string;\n};\n\nexport type ApplicationSnapshot",
              "owner resume type",
          )
          replace_once(
              "apps/owner-workspace/app/vault-client.ts",
              "export async function downloadEncryptedResume(\n",
              "export async function deleteEncryptedResume(\n"
              "  record: ResumeRecord,\n"
              "): Promise<void> {\n"
              "  const response = await fetch(\n"
              "    `/api/objects/${encodeURIComponent(record.objectId)}`,\n"
              "    { method: \"DELETE\", headers: { accept: \"application/json\" } },\n"
              "  );\n"
              "  const payload = (await response.json().catch(() => ({}))) as { error?: string };\n"
              "  if (!response.ok) {\n"
              "    throw new Error(payload.error ?? \"Encrypted résumé deletion failed.\");\n"
              "  }\n"
              "}\n\n"
              "export async function downloadEncryptedResume(\n",
              "owner delete helper",
          )

          # Owner-only server deletion. Missing object is treated as already deleted so a failed
          # sync-tombstone write can be retried safely.
          route = Path("apps/owner-workspace/app/api/objects/[objectId]/route.ts")
          text = route.read_text()
          if "export async function DELETE(" in text:
              raise SystemExit("DELETE route unexpectedly already exists")
          text += """

          export async function DELETE(
            request: Request,
            context: { params: Promise<{ objectId: string }> },
          ) {
            try {
              const principal = await requirePrincipal(request);
              if (principal.kind !== "owner") {
                return Response.json(
                  { error: "Only the workspace owner can delete encrypted résumés." },
                  { status: 403 },
                );
              }

              const { objectId } = await context.params;
              const db = getDb();
              const record = await db.query.encryptedObjects.findFirst({
                where: and(
                  eq(encryptedObjects.id, objectId),
                  eq(encryptedObjects.workspaceId, principal.workspaceId),
                ),
              });
              if (!record) {
                return Response.json({ object: { id: objectId }, deleted: false });
              }
              if (record.purpose !== "RESUME") {
                return Response.json(
                  { error: "Only résumé objects can be deleted from the résumé vault." },
                  { status: 409 },
                );
              }

              await env.BUCKET.delete(record.objectKey);
              await db
                .delete(encryptedObjects)
                .where(
                  and(
                    eq(encryptedObjects.id, objectId),
                    eq(encryptedObjects.workspaceId, principal.workspaceId),
                  ),
                );
              return Response.json({ object: { id: objectId }, deleted: true });
            } catch (error) {
              return authError(error) ?? apiError(error);
            }
          }
          """
          route.write_text(text)

          # Owner UI: add helper import and synchronized deletion action.
          replace_once(
              "apps/owner-workspace/app/workspace/mobile-workspace.tsx",
              "  decryptLatestEntities,\n",
              "  decryptLatestEntities,\n  deleteEncryptedResume,\n",
              "owner delete import",
          )
          mobile = Path("apps/owner-workspace/app/workspace/mobile-workspace.tsx")
          text = mobile.read_text()
          marker = "  function beginReview(application: ApplicationSnapshot) {\n"
          if text.count(marker) != 1:
              raise SystemExit("beginReview marker missing or ambiguous")
          delete_action = "\n".join([
              "  async function deleteResume(record: ResumeRecord) {",
              "    if (!rawKey) return;",
              "    if (",
              "      !window.confirm(",
              "        `Delete ${record.name}? This permanently removes the encrypted file from your synced résumé vault. Existing application records may still reference this résumé version.`,",
              "      )",
              "    ) {",
              "      return;",
              "    }",
              "    setBusy(true);",
              "    try {",
              "      await deleteEncryptedResume(record);",
              "      const existing = entities.get(`RESUME.V1:${record.resumeId}`);",
              "      await putEncryptedEntity({",
              "        rawKey,",
              "        entityType: \"RESUME.V1\",",
              "        entityId: record.resumeId,",
              "        baseVersion: existing?.version ?? 0,",
              "        value: { ...record, deletedAt: new Date().toISOString() },",
              "      });",
              "      setStatus(`${record.name} deleted from the encrypted résumé vault`);",
              "      await loadWorkspace();",
              "    } catch (error) {",
              "      setStatus(error instanceof Error ? error.message : \"Résumé deletion failed\");",
              "    } finally {",
              "      setBusy(false);",
              "    }",
              "  }",
              "",
          ])
          text = text.replace(marker, delete_action + marker, 1)

          needle = "rawKey && void downloadEncryptedResume(rawKey, resume)"
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("resume download action not found")
          start = text.rfind("                    <button", 0, pos)
          end_marker = "                    </button>"
          end = text.find(end_marker, pos)
          if start < 0 or end < 0:
              raise SystemExit("resume Download button boundaries not found")
          end += len(end_marker)
          replacement = "\n".join([
              '                    <div className="resume-actions">',
              "                      <button",
              '                        type="button"',
              "                        disabled={busy}",
              "                        onClick={() =>",
              "                          rawKey && void downloadEncryptedResume(rawKey, resume)",
              "                        }",
              "                      >",
              "                        Download",
              "                      </button>",
              "                      <button",
              '                        className="destructive"',
              '                        type="button"',
              "                        disabled={busy}",
              "                        onClick={() => void deleteResume(resume)}",
              "                      >",
              "                        Delete",
              "                      </button>",
              "                    </div>",
          ])
          text = text[:start] + replacement + text[end:]
          mobile.write_text(text)

          # Owner UI styles.
          replace_once(
              "apps/owner-workspace/app/globals.css",
              ".record-list article button,\n.recovery-secret button,\n.text-button {",
              ".resume-actions {\n"
              "  align-items: center;\n"
              "  display: flex;\n"
              "  flex-wrap: wrap;\n"
              "  gap: 12px;\n"
              "  justify-content: flex-end;\n"
              "}\n\n"
              ".record-list article button,\n.recovery-secret button,\n.text-button {",
              "resume action styles",
          )
          css = Path("apps/owner-workspace/app/globals.css")
          text = css.read_text()
          anchor = ".review-list article {"
          if text.count(anchor) != 1:
              raise SystemExit("review-list style marker missing or ambiguous")
          extra = (
              ".record-list article button.destructive {\n"
              "  color: #8b3f24;\n"
              "}\n\n"
              ".record-list article button:disabled {\n"
              "  cursor: not-allowed;\n"
              "  opacity: 0.45;\n"
              "}\n\n"
          )
          css.write_text(text.replace(anchor, extra + anchor, 1))

          # Extension: understand deletion tombstones from encrypted sync.
          replace_once(
              "apps/extension/src/storage/cloud.ts",
              "  active?: boolean;\n};\n\nexport type ApplicationReview",
              "  active?: boolean;\n  deletedAt?: string;\n};\n\nexport type ApplicationReview",
              "extension resume type",
          )
          cloud = Path("apps/extension/src/storage/cloud.ts")
          text = cloud.read_text()
          pattern = re.compile(
              r'    \} else if \(event\.entityType === "RESUME\.V1"\) \{\n'
              r'      resumes\.push\(\n'
              r'        await decryptJson<ResumeRecord>\(rawKey, event\.payloadCiphertext\),\n'
              r'      \);\n'
              r'    \}'
          )
          replacement = "\n".join([
              '    } else if (event.entityType === "RESUME.V1") {',
              "      const resume = await decryptJson<ResumeRecord>(",
              "        rawKey,",
              "        event.payloadCiphertext,",
              "      );",
              "      if (!resume.deletedAt) resumes.push(resume);",
              "    }",
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"extension resume snapshot branch: expected 1 target, found {count}")

          start_marker = '  const family = options.family?.trim() || "master";\n'
          end_marker = "  const resumeId = crypto.randomUUID();\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("resume version calculation boundaries not found")
          version_logic = "\n".join([
              '  const family = options.family?.trim() || "master";',
              "  const { events: resumeEvents } = await fetchCloudEvents(connection, 0);",
              "  const resumeHistory: ResumeRecord[] = [];",
              "  for (const event of latestEvents(resumeEvents).values()) {",
              '    if (event.entityType !== "RESUME.V1") continue;',
              "    resumeHistory.push(",
              "      await decryptJson<ResumeRecord>(rawKey, event.payloadCiphertext),",
              "    );",
              "  }",
              "  const version =",
              "    Math.max(",
              "      0,",
              "      ...resumeHistory",
              '        .filter((resume) => (resume.family ?? "master") === family)',
              "        .map((resume) => resume.version ?? 1),",
              "    ) + 1;",
              "",
          ])
          text = text[:start] + version_logic + text[end:]
          cloud.write_text(text)

          # Focused browser-helper regression test.
          test_file = Path("apps/owner-workspace/tests/resume-delete.test.mjs")
          test_file.write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { deleteEncryptedResume } from "../app/vault-client.ts";

          test("owner resume delete helper calls the encrypted-object DELETE route", async () => {
            const originalFetch = globalThis.fetch;
            let capturedUrl = "";
            let capturedMethod = "";
            globalThis.fetch = async (input, init) => {
              capturedUrl = String(input);
              capturedMethod = init?.method ?? "GET";
              return Response.json({ object: { id: "obj-resume" }, deleted: true });
            };
            try {
              await deleteEncryptedResume({
                resumeId: "resume-test",
                objectId: "obj-resume",
                name: "Aadil Resume.pdf",
                contentType: "application/pdf",
                sizeBytes: 1024,
                addedAt: "2026-08-15T00:00:00.000Z",
              });
              assert.equal(capturedUrl, "/api/objects/obj-resume");
              assert.equal(capturedMethod, "DELETE");
            } finally {
              globalThis.fetch = originalFetch;
            }
          });
          ''')
          PY

      - name: Format
        run: |
          npx prettier --write \
            apps/extension/src/storage/cloud.ts \
            apps/owner-workspace/app/vault-client.ts \
            apps/owner-workspace/app/workspace/mobile-workspace.tsx \
            apps/owner-workspace/app/api/objects/'[objectId]'/route.ts \
            apps/owner-workspace/app/globals.css \
            apps/owner-workspace/tests/resume-delete.test.mjs

      - name: Verify extension and shared code
        run: npm run check

      - name: Verify owner workspace
        working-directory: apps/owner-workspace
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Publish verified feature
        shell: bash
        run: |
          rm -f .github/workflows/resume-vault-delete-repair.yml
          rm -f .github/workflows/resume-vault-delete-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add synchronized resume deletion"
          git push origin HEAD:feat/v3-foundation-alignment
