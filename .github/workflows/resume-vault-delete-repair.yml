name: Resume vault delete repair

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/resume-vault-delete-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Patch synchronized résumé deletion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one patch target in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "apps/owner-workspace/app/vault-client.ts",
              '''export type ResumeRecord = {
            resumeId: string;
            objectId: string;
            name: string;
            contentType: string;
            sizeBytes: number;
            addedAt: string;
          };''',
              '''export type ResumeRecord = {
            resumeId: string;
            objectId: string;
            name: string;
            contentType: string;
            sizeBytes: number;
            addedAt: string;
            deletedAt?: string;
          };''',
          )

          replace_once(
              "apps/owner-workspace/app/vault-client.ts",
              '''export async function downloadEncryptedResume(
            rawKey: string,
            record: ResumeRecord,
          ): Promise<void> {''',
              '''export async function deleteEncryptedResume(
            record: ResumeRecord,
          ): Promise<void> {
            const response = await fetch(
              `/api/objects/${encodeURIComponent(record.objectId)}`,
              {
                method: "DELETE",
                headers: { accept: "application/json" },
              },
            );
            const payload = (await response.json().catch(() => ({}))) as {
              error?: string;
            };
            if (!response.ok) {
              throw new Error(payload.error ?? "Encrypted résumé deletion failed.");
            }
          }

          export async function downloadEncryptedResume(
            rawKey: string,
            record: ResumeRecord,
          ): Promise<void> {''',
          )

          route = Path("apps/owner-workspace/app/api/objects/[objectId]/route.ts")
          route_text = route.read_text()
          if "export async function DELETE(" in route_text:
              raise SystemExit("DELETE route already exists")
          route.write_text(
              route_text
              + '''

          export async function DELETE(
            request: Request,
            context: { params: Promise<{ objectId: string }> },
          ) {
            try {
              const principal = await requirePrincipal(request);
              if (principal.kind !== "owner") {
                return Response.json(
                  { error: "Only the workspace owner can delete encrypted résumés." },
                  { status: 403 },
                );
              }
              const { objectId } = await context.params;
              const db = getDb();
              const record = await db.query.encryptedObjects.findFirst({
                where: and(
                  eq(encryptedObjects.id, objectId),
                  eq(encryptedObjects.workspaceId, principal.workspaceId),
                ),
              });
              if (!record) {
                return Response.json({ object: { id: objectId }, deleted: false });
              }
              if (record.purpose !== "RESUME") {
                return Response.json(
                  { error: "Only résumé objects can be deleted from the résumé vault." },
                  { status: 409 },
                );
              }

              await env.BUCKET.delete(record.objectKey);
              await db
                .delete(encryptedObjects)
                .where(
                  and(
                    eq(encryptedObjects.id, objectId),
                    eq(encryptedObjects.workspaceId, principal.workspaceId),
                  ),
                );
              return Response.json({ object: { id: objectId }, deleted: true });
            } catch (error) {
              return authError(error) ?? apiError(error);
            }
          }
          '''
          )

          replace_once(
              "apps/owner-workspace/app/workspace/mobile-workspace.tsx",
              '''  decryptLatestEntities,
            downloadEncryptedResume,''',
              '''  decryptLatestEntities,
            deleteEncryptedResume,
            downloadEncryptedResume,''',
          )

          replace_once(
              "apps/owner-workspace/app/workspace/mobile-workspace.tsx",
              '''  function beginReview(application: ApplicationSnapshot) {''',
              '''  async function deleteResume(record: ResumeRecord) {
            if (!rawKey) return;
            if (
              !window.confirm(
                `Delete ${record.name}? This permanently removes the encrypted file from your synced résumé vault. Existing application records may still reference this résumé version.`,
              )
            ) {
              return;
            }
            setBusy(true);
            try {
              await deleteEncryptedResume(record);
              const existing = entities.get(`RESUME.V1:${record.resumeId}`);
              await putEncryptedEntity({
                rawKey,
                entityType: "RESUME.V1",
                entityId: record.resumeId,
                baseVersion: existing?.version ?? 0,
                value: {
                  ...record,
                  deletedAt: new Date().toISOString(),
                },
              });
              setStatus(`${record.name} deleted from the encrypted résumé vault`);
              await loadWorkspace();
            } catch (error) {
              setStatus(
                error instanceof Error ? error.message : "Résumé deletion failed",
              );
            } finally {
              setBusy(false);
            }
          }

          function beginReview(application: ApplicationSnapshot) {''',
          )

          replace_once(
              "apps/owner-workspace/app/workspace/mobile-workspace.tsx",
              '''                    <button
                      type="button"
                      onClick={() =>
                        rawKey && void downloadEncryptedResume(rawKey, resume)
                      }
                    >
                      Download
                    </button>''',
              '''                    <div className="resume-actions">
                      <button
                        type="button"
                        disabled={busy}
                        onClick={() =>
                          rawKey && void downloadEncryptedResume(rawKey, resume)
                        }
                      >
                        Download
                      </button>
                      <button
                        className="destructive"
                        type="button"
                        disabled={busy}
                        onClick={() => void deleteResume(resume)}
                      >
                        Delete
                      </button>
                    </div>''',
          )

          replace_once(
              "apps/owner-workspace/app/globals.css",
              '''.record-list article button,
          .recovery-secret button,
          .text-button {''',
              '''.resume-actions {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-end;
          }

          .record-list article button,
          .recovery-secret button,
          .text-button {''',
          )

          replace_once(
              "apps/owner-workspace/app/globals.css",
              '''  font-size: 12px;
            font-weight: 750;
          }

          .review-list article {''',
              '''  font-size: 12px;
            font-weight: 750;
          }

          .record-list article button.destructive {
            color: #8b3f24;
          }

          .record-list article button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
          }

          .review-list article {''',
          )

          replace_once(
              "apps/extension/src/storage/cloud.ts",
              '''  roleFamily?: string | null;
            active?: boolean;
          };''',
              '''  roleFamily?: string | null;
            active?: boolean;
            deletedAt?: string;
          };''',
          )

          replace_once(
              "apps/extension/src/storage/cloud.ts",
              '''    } else if (event.entityType === "RESUME.V1") {
              resumes.push(
                await decryptJson<ResumeRecord>(rawKey, event.payloadCiphertext),
              );
            }''',
              '''    } else if (event.entityType === "RESUME.V1") {
              const resume = await decryptJson<ResumeRecord>(
                rawKey,
                event.payloadCiphertext,
              );
              if (!resume.deletedAt) resumes.push(resume);
            }''',
          )

          replace_once(
              "apps/extension/src/storage/cloud.ts",
              '''  const family = options.family?.trim() || "master";
            const snapshot = await getCloudSnapshot(connection);
            const version =
              Math.max(
                0,
                ...snapshot.resumes
                  .filter((resume) => (resume.family ?? "master") === family)
                  .map((resume) => resume.version ?? 1),
              ) + 1;''',
              '''  const family = options.family?.trim() || "master";
            const { events: resumeEvents } = await fetchCloudEvents(connection, 0);
            const resumeHistory: ResumeRecord[] = [];
            for (const event of latestEvents(resumeEvents).values()) {
              if (event.entityType !== "RESUME.V1") continue;
              resumeHistory.push(
                await decryptJson<ResumeRecord>(rawKey, event.payloadCiphertext),
              );
            }
            const version =
              Math.max(
                0,
                ...resumeHistory
                  .filter((resume) => (resume.family ?? "master") === family)
                  .map((resume) => resume.version ?? 1),
              ) + 1;''',
          )

          replace_once(
              "apps/extension/src/storage/cloud.test.ts",
              '''  normalizeBaseUrl,
            parsePairingBundle,
            validateResumeFile,''',
              '''  normalizeBaseUrl,
            parsePairingBundle,
            type ResumeRecord,
            validateResumeFile,''',
          )

          test_path = Path("apps/extension/src/storage/cloud.test.ts")
          test_text = test_path.read_text()
          marker = '''describe("cloud event pagination", () => {'''
          if test_text.count(marker) != 1:
              raise SystemExit("Could not locate cloud event pagination test marker")
          test_text = test_text.replace(
              marker,
              '''describe("resume deletion tombstones", () => {
            it("can represent deleted encrypted resume records without losing version history", () => {
              const record: ResumeRecord = {
                resumeId: "resume-test",
                objectId: "object-test",
                name: "resume.pdf",
                contentType: "application/pdf",
                sizeBytes: 1024,
                addedAt: "2026-08-15T00:00:00.000Z",
                family: "master",
                version: 3,
                deletedAt: "2026-08-15T01:00:00.000Z",
              };
              expect(record.deletedAt).toBeTruthy();
              expect(record.version).toBe(3);
            });
          });

          describe("cloud event pagination", () => {''',
              1,
          )
          test_path.write_text(test_text)

          replace_once(
              "apps/owner-workspace/tests/profile-vault.test.mjs",
              '''  ProtectedProfileConflictError,
            encryptedHistoryNeedsRecovery,''',
              '''  ProtectedProfileConflictError,
            deleteEncryptedResume,
            encryptedHistoryNeedsRecovery,''',
          )

          owner_test = Path("apps/owner-workspace/tests/profile-vault.test.mjs")
          owner_text = owner_test.read_text()
          owner_text += '''

          test("owner résumé deletion uses the dedicated encrypted-object delete endpoint", async () => {
            const originalFetch = globalThis.fetch;
            let capturedUrl = "";
            let capturedMethod = "";
            globalThis.fetch = async (input, init) => {
              capturedUrl = String(input);
              capturedMethod = init?.method ?? "GET";
              return Response.json({ object: { id: "obj-resume" }, deleted: true });
            };
            try {
              await deleteEncryptedResume({
                resumeId: "resume-test",
                objectId: "obj-resume",
                name: "Aadil Resume.pdf",
                contentType: "application/pdf",
                sizeBytes: 1024,
                addedAt: "2026-08-15T00:00:00.000Z",
              });
              assert.equal(capturedUrl, "/api/objects/obj-resume");
              assert.equal(capturedMethod, "DELETE");
            } finally {
              globalThis.fetch = originalFetch;
            }
          });
          '''
          owner_test.write_text(owner_text)
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            apps/extension/src/storage/cloud.ts \
            apps/extension/src/storage/cloud.test.ts \
            apps/owner-workspace/app/vault-client.ts \
            apps/owner-workspace/app/workspace/mobile-workspace.tsx \
            apps/owner-workspace/app/api/objects/'[objectId]'/route.ts \
            apps/owner-workspace/app/globals.css \
            apps/owner-workspace/tests/profile-vault.test.mjs
      - name: Verify extension and shared packages
        run: npm run check
      - name: Verify owner workspace
        working-directory: apps/owner-workspace
        run: |
          npm ci
          npm run lint
          npm test
      - name: Publish verified repair and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/resume-vault-delete-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add synchronized resume deletion"
          git push origin HEAD:feat/v3-foundation-alignment
