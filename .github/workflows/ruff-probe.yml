name: Ruff probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './apps/native-host[dev]'
      - name: Show canonical Ruff diff
        run: |
          python -m ruff check --fix \
            apps/native-host/tests/test_account_store.py \
            apps/native-host/tests/test_native_account_messages.py
          git diff -- \
            apps/native-host/tests/test_account_store.py \
            apps/native-host/tests/test_native_account_messages.py
