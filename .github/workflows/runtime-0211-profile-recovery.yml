name: Temporary 0.2.11 profile recovery guard

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/runtime-0211-profile-recovery.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - name: Assert recovery baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/v3-foundation-alignment)"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply recovery-first 0.2.11 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, count))

          # Version bump.
          replace(
              "apps/extension/public/manifest.json",
              '"version": "0.2.10"',
              '"version": "0.2.11"',
          )

          # The native copy must remain recoverable even if the IndexedDB mirror
          # is unreadable. Loading should never destroy a suspect mirror just to
          # make startup succeed.
          p = Path("apps/extension/src/storage/profile-authority.ts")
          text = p.read_text()
          start = text.index("export async function loadAuthoritativeProfileSnapshot(")
          end = text.index("\nexport async function persistAuthoritativeProfileSnapshot(", start)
          new_function = '''export async function loadAuthoritativeProfileSnapshot(\n  stores: ProfileSnapshotStores = defaultStores,\n): Promise<ProfileSnapshot | null> {\n  let browser: ProfileSnapshot | null = null;\n  let browserError: unknown = null;\n  try {\n    browser = await stores.getBrowser();\n  } catch (error) {\n    browserError = error;\n  }\n\n  let native: ProfileSnapshot | null = null;\n  let nativeError: unknown = null;\n  try {\n    native = await stores.getNative();\n  } catch (error) {\n    nativeError = error;\n  }\n\n  if (browserError) {\n    if (native) return native;\n    const reason =\n      browserError instanceof Error ? browserError.message : String(browserError);\n    throw new Error(\n      `Browser profile vault is unreadable and no native recovery snapshot is available: ${reason}`,\n    );\n  }\n\n  if (nativeError) {\n    return browser;\n  }\n\n  if (!native && !browser) return null;\n  if (!native && browser) {\n    try {\n      await stores.saveNative(browser);\n    } catch {\n      // Loading a known-good browser snapshot must not fail because a mirror\n      // write is temporarily unavailable.\n    }\n    return browser;\n  }\n  if (native && !browser) {\n    try {\n      await stores.saveBrowser(native);\n    } catch {\n      // Preserve the authoritative native value even when the browser mirror\n      // cannot be repaired immediately.\n    }\n    return native;\n  }\n\n  const reconciled = reconcileProtectedProfile(browser!, native!);\n  if (!sameSnapshot(reconciled, native)) {\n    try {\n      await stores.saveNative(reconciled);\n    } catch {\n      // Reconciliation remains readable even if a mirror update must retry later.\n    }\n  }\n  if (!sameSnapshot(reconciled, browser)) {\n    try {\n      await stores.saveBrowser(reconciled);\n    } catch {\n      // Reconciliation remains readable even if a mirror update must retry later.\n    }\n  }\n  return reconciled;\n}\n'''
          p.write_text(text[:start] + new_function + text[end:])

          # Regression coverage for browser corruption + native recovery.
          replace(
              "apps/extension/src/storage/profile-authority.test.ts",
              '''  browser?: ProfileSnapshot | null;\n  native?: ProfileSnapshot | null;\n  nativeError?: Error;\n''',
              '''  browser?: ProfileSnapshot | null;\n  native?: ProfileSnapshot | null;\n  browserError?: Error;\n  nativeError?: Error;\n''',
          )
          replace(
              "apps/extension/src/storage/profile-authority.test.ts",
              '''    getBrowser: vi.fn(async () => input.browser ?? null),\n''',
              '''    getBrowser: vi.fn(async () => {\n      if (input.browserError) throw input.browserError;\n      return input.browser ?? null;\n    }),\n''',
          )
          replace(
              "apps/extension/src/storage/profile-authority.test.ts",
              '''  it("persists to the browser fallback when the native write fails", async () => {\n''',
              '''  it("recovers the authoritative native snapshot when the browser mirror is unreadable", async () => {\n    const native = snapshot("2026-08-14T12:01:00.000Z", "Recovered");\n    const adapters = stores({\n      browserError: new Error("IndexedDB profile parse failed"),\n      native,\n    });\n\n    await expect(loadAuthoritativeProfileSnapshot(adapters)).resolves.toEqual(\n      native,\n    );\n    expect(adapters.saveBrowser).not.toHaveBeenCalled();\n    expect(adapters.saveNative).not.toHaveBeenCalled();\n  });\n\n  it("refuses to present an empty profile when the browser mirror is unreadable and native has no snapshot", async () => {\n    const adapters = stores({\n      browserError: new Error("IndexedDB profile parse failed"),\n      native: null,\n    });\n\n    await expect(loadAuthoritativeProfileSnapshot(adapters)).rejects.toThrow(\n      "Browser profile vault is unreadable and no native recovery snapshot is available",\n    );\n  });\n\n  it("still returns a valid snapshot when a mirror repair write fails", async () => {\n    const native = snapshot("2026-08-14T12:01:00.000Z", "Recovered");\n    const adapters = stores({ browser: null, native });\n    adapters.saveBrowser.mockRejectedValueOnce(new Error("IndexedDB write failed"));\n\n    await expect(loadAuthoritativeProfileSnapshot(adapters)).resolves.toEqual(\n      native,\n    );\n  });\n\n  it("persists to the browser fallback when the native write fails", async () => {\n''',
          )

          # If there is no local profile, a failed encrypted-cloud read is not
          # evidence that the user has no profile. Propagate the error so the UI
          # enters recovery mode rather than legitimizing an empty snapshot.
          replace(
              "apps/extension/src/background/service-worker.ts",
              '''          } catch (error) {\n            if (error instanceof ProtectedProfileConflictError) {\n              rememberProfileConflict(error);\n            }\n            // Local-first operation continues when cloud is unavailable or review is required.\n          }\n''',
              '''          } catch (error) {\n            if (error instanceof ProtectedProfileConflictError) {\n              rememberProfileConflict(error);\n            }\n            if (!localProfile) {\n              throw error;\n            }\n            // A known local snapshot remains usable when cloud is unavailable\n            // or protected-value review is required.\n          }\n''',
          )

          # Turn raw AbortController text into an actionable, non-destructive
          # cloud status. This timeout never means the local profile was erased.
          replace(
              "apps/extension/src/storage/cloud.ts",
              '''    return {\n      connected: true,\n      baseUrl: connection.baseUrl,\n      deviceId: connection.deviceId,\n      workspaceId: payload.workspaceId ?? null,\n      vaultFingerprint: rawKey ? (await sha256Hex(rawKey)).slice(0, 16) : null,\n      nextCursor: payload.nextCursor ?? 0,\n      encryptionReady: rawKey !== null,\n    };\n  } finally {\n    globalThis.clearTimeout(timeout);\n  }\n}\n''',
              '''    return {\n      connected: true,\n      baseUrl: connection.baseUrl,\n      deviceId: connection.deviceId,\n      workspaceId: payload.workspaceId ?? null,\n      vaultFingerprint: rawKey ? (await sha256Hex(rawKey)).slice(0, 16) : null,\n      nextCursor: payload.nextCursor ?? 0,\n      encryptionReady: rawKey !== null,\n    };\n  } catch (error) {\n    if (controller.signal.aborted) {\n      throw new Error(\n        "Encrypted workspace check timed out. Local profile data remains protected.",\n      );\n    }\n    throw error;\n  } finally {\n    globalThis.clearTimeout(timeout);\n  }\n}\n''',
          )

          app = Path("apps/extension/src/sidepanel/App.tsx")
          text = app.read_text()

          # Direct native recovery fallback.
          text = text.replace(
              '''  getAISettings,\n  listOpenAIModels,\n''',
              '''  getAISettings,\n  getNativeProfileSnapshot,\n  listOpenAIModels,\n''',
              1,
          )

          text = text.replace(
              '''  const [profileLoaded, setProfileLoaded] = useState(false);\n  const [profileDirty, setProfileDirty] = useState(false);\n''',
              '''  const [profileLoaded, setProfileLoaded] = useState(false);\n  const [profileRecoveryIssue, setProfileRecoveryIssue] = useState<string | null>(\n    null,\n  );\n  const [profileDirty, setProfileDirty] = useState(false);\n''',
              1,
          )

          old_profile_load = '''    let savedProfile: ProfileSnapshot | null = null;\n    try {\n      savedProfile = await getProfile();\n    } catch (error) {\n      setNotice(\n        error instanceof Error ? error.message : "Unable to load profile",\n      );\n    }\n    const syncStatus = await getProfileSyncStatus().catch(() => ({\n      conflict: null,\n    }));\n    setProfileSyncStatus(syncStatus);\n    if (savedProfile) setProfile(savedProfile);\n    setProtectedDrafts({});\n    profileRevision.current += 1;\n    setProfileLoaded(true);\n    setProfileDirty(false);\n    setSaveState(syncStatus.conflict ? "conflict" : "idle");\n'''
          new_profile_load = '''    let savedProfile: ProfileSnapshot | null = null;\n    let profileLoadError: string | null = null;\n    try {\n      savedProfile = await getProfile();\n    } catch (error) {\n      profileLoadError =\n        error instanceof Error ? error.message : "Unable to load profile";\n      try {\n        const nativeRecovery = await getNativeProfileSnapshot();\n        if (nativeRecovery) {\n          savedProfile = nativeRecovery;\n          profileLoadError = null;\n          setNotice(\n            "Recovered your saved profile from the local encrypted desktop vault.",\n          );\n        }\n      } catch (nativeError) {\n        const nativeMessage =\n          nativeError instanceof Error\n            ? nativeError.message\n            : "Native profile recovery failed";\n        profileLoadError = `${profileLoadError}. ${nativeMessage}`;\n      }\n    }\n    const syncStatus = await getProfileSyncStatus().catch(() => ({\n      conflict: null,\n    }));\n    setProfileSyncStatus(syncStatus);\n    if (savedProfile) setProfile(savedProfile);\n    setProtectedDrafts({});\n    profileRevision.current += 1;\n    setProfileDirty(false);\n    if (profileLoadError && !savedProfile) {\n      setProfileRecoveryIssue(profileLoadError);\n      setProfileLoaded(false);\n      setSaveState("error");\n    } else {\n      setProfileRecoveryIssue(null);\n      setProfileLoaded(true);\n      setSaveState(syncStatus.conflict ? "conflict" : "idle");\n    }\n'''
          if old_profile_load not in text:
              raise SystemExit("Expected App profile load block not found")
          text = text.replace(old_profile_load, new_profile_load, 1)

          text = text.replace(
              '''    if (syncedProfile) {\n      setProfile(syncedProfile);\n      profileRevision.current += 1;\n      setSaveState(syncStatus.conflict ? "conflict" : "synced");\n    }\n''',
              '''    if (syncedProfile) {\n      setProfile(syncedProfile);\n      setProfileRecoveryIssue(null);\n      setProfileLoaded(true);\n      setProfileDirty(false);\n      profileRevision.current += 1;\n      setSaveState(syncStatus.conflict ? "conflict" : "synced");\n    }\n''',
              1,
          )

          text = text.replace(
              '''  const saveLabel =\n    saveState === "editing"\n''',
              '''  const saveLabel =\n    !profileLoaded\n      ? profileRecoveryIssue\n        ? "Recovery mode"\n        : "Loading profile…"\n      : saveState === "editing"\n''',
              1,
          )

          # Guard profile edits at the state boundary too.
          text = text.replace(
              '''  function markProfileDirty(): void {\n    profileRevision.current += 1;\n''',
              '''  function markProfileDirty(): void {\n    if (!profileLoaded) return;\n    profileRevision.current += 1;\n''',
              1,
          )

          # Dedicated recovery status cannot be overwritten by unrelated cloud notices.
          profile_intro = '''          <p>\n            Regular facts save automatically after you stop typing. Protected\n            facts become confirmed only after you leave the field, and are\n            encrypted before cloud synchronization.\n          </p>\n'''
          profile_intro_recovery = profile_intro + '''          {!profileLoaded && (\n            <div className="profile-conflict-panel">\n              <strong>Profile recovery mode</strong>\n              <p>\n                Autosave is disabled and profile fields are locked until MUNSHI\n                confirms a stored snapshot. No empty profile will be written over\n                your saved data.\n              </p>\n              {profileRecoveryIssue && <p>{profileRecoveryIssue}</p>}\n              <button\n                className="quiet"\n                type="button"\n                onClick={() => void refresh()}\n              >\n                Retry profile recovery\n              </button>\n            </div>\n          )}\n'''
          if profile_intro not in text:
              raise SystemExit("Expected profile intro not found")
          text = text.replace(profile_intro, profile_intro_recovery, 1)

          # Lock all profile mutation controls while recovery is unresolved.
          text = text.replace(
              '''                      <input\n                        type={field.inputType ?? "text"}\n''',
              '''                      <input\n                        disabled={!profileLoaded}\n                        type={field.inputType ?? "text"}\n''',
              1,
          )
          text = text.replace(
              '''                    <button\n                      className="quiet"\n                      type="button"\n                      onClick={() => addRecord(definition)}\n''',
              '''                    <button\n                      className="quiet"\n                      type="button"\n                      disabled={!profileLoaded}\n                      onClick={() => addRecord(definition)}\n''',
              1,
          )
          text = text.replace(
              '''                              disabled={recordIndex === 0}\n''',
              '''                              disabled={!profileLoaded || recordIndex === 0}\n''',
              1,
          )
          text = text.replace(
              '''                              disabled={recordIndex === records.length - 1}\n''',
              '''                              disabled={\n                                !profileLoaded || recordIndex === records.length - 1\n                              }\n''',
              1,
          )
          text = text.replace(
              '''                              title="Remove record"\n                              onClick={() => removeRecord(record)}\n''',
              '''                              title="Remove record"\n                              disabled={!profileLoaded}\n                              onClick={() => removeRecord(record)}\n''',
              1,
          )
          text = text.replace(
              '''                            const shared = {\n                              value,\n''',
              '''                            const shared = {\n                              disabled: !profileLoaded,\n                              value,\n''',
              1,
          )
          text = text.replace(
              '''            <button\n              className="quiet"\n              type="button"\n              onClick={() => void syncNow()}\n''',
              '''            <button\n              className="quiet"\n              type="button"\n              disabled={!profileLoaded}\n              onClick={() => void syncNow()}\n''',
              1,
          )

          # Diagnostics must not report an unresolved empty fallback as zero facts.
          old_diag = '''              <dd>\n                {profile.facts.filter((fact) => fact.trustLevel !== "UNKNOWN")\n                  .length +\n                  profile.records\n                    .flatMap((record) => record.facts)\n                    .filter((fact) => fact.trustLevel !== "UNKNOWN")\n                    .length}{" "}\n                confirmed facts · {profile.records.length} records\n              </dd>\n'''
          new_diag = '''              <dd>\n                {profileLoaded ? (\n                  <>\n                    {profile.facts.filter(\n                      (fact) => fact.trustLevel !== "UNKNOWN",\n                    ).length +\n                      profile.records\n                        .flatMap((record) => record.facts)\n                        .filter((fact) => fact.trustLevel !== "UNKNOWN").length}{" "}\n                    confirmed facts · {profile.records.length} records\n                  </>\n                ) : (\n                  "recovery mode · autosave disabled"\n                )}\n              </dd>\n'''
          if old_diag not in text:
              raise SystemExit("Expected profile diagnostics block not found")
          text = text.replace(old_diag, new_diag, 1)

          app.write_text(text)
          PY

      - name: Format patched source
        run: ./node_modules/.bin/prettier --write apps/extension/public/manifest.json apps/extension/src/storage/profile-authority.ts apps/extension/src/storage/profile-authority.test.ts apps/extension/src/background/service-worker.ts apps/extension/src/storage/cloud.ts apps/extension/src/sidepanel/App.tsx
      - name: Full repository verification
        run: npm run check
      - name: Commit verified 0.2.11 recovery source only
        shell: bash
        run: |
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add apps/extension
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: recover profile before enabling autosave"
          git push origin HEAD:feat/v3-foundation-alignment
