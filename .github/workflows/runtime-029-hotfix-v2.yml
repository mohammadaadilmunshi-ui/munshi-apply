name: Temporary 0.2.9 runtime hotfix v2

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/runtime-029-hotfix-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse evidence-based 0.2.9 patch definition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/runtime-029-hotfix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Could not locate canonical 0.2.9 patch block')
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/munshi_029_patch.py').write_text(textwrap.dedent(block))
          PY
          python3 /tmp/munshi_029_patch.py

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected reconciliation text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          p = Path('packages/semantic-engine/src/index.ts')
          text = p.read_text().replace(r'[\*✱＊]+', r'[*✱＊]+')
          text = text.replace(
              r'pattern: /^(current location|location)$/i,',
              r'pattern: /^current location$/i,',
          )
          p.write_text(text)

          # Deterministic final mutation policy. Text/status-only child mutations
          # are ignored, while control insertion and visibility/semantic changes
          # remain observable.
          Path('apps/extension/src/content/mutation-rescan-policy.ts').write_text(r'''const APPLICATION_RELEVANT_SELECTOR = [
            "form",
            "input",
            "select",
            "textarea",
            "button",
            "iframe",
            "[contenteditable='true']",
            "[role='button']",
            "[role='checkbox']",
            "[role='combobox']",
            "[role='listbox']",
            "[role='option']",
            "[role='radio']",
            "[role='switch']",
            "[aria-invalid='true']",
            "[aria-required='true']",
          ].join(",");

          function elementIsApplicationRelevant(element: Element): boolean {
            return element.matches(APPLICATION_RELEVANT_SELECTOR);
          }

          function elementContainsApplicationControl(element: Element): boolean {
            return element.querySelector(APPLICATION_RELEVANT_SELECTOR) !== null;
          }

          function nodeAddsOrRemovesApplicationControl(node: Node): boolean {
            return (
              node instanceof Element &&
              (elementIsApplicationRelevant(node) ||
                elementContainsApplicationControl(node))
            );
          }

          function childListTouchesApplication(record: MutationRecord): boolean {
            return [...record.addedNodes, ...record.removedNodes].some(
              nodeAddsOrRemovesApplicationControl,
            );
          }

          export function shouldRescanFromMutations(
            records: readonly MutationRecord[],
          ): boolean {
            for (const record of records) {
              if (record.type === "childList") {
                if (childListTouchesApplication(record)) return true;
                continue;
              }
              if (record.type !== "attributes") continue;
              if (!(record.target instanceof Element)) continue;

              const attribute = record.attributeName ?? "";
              if (attribute === "hidden" || attribute === "aria-hidden") {
                return true;
              }

              if (attribute === "class" || attribute === "style") {
                if (
                  elementIsApplicationRelevant(record.target) ||
                  elementContainsApplicationControl(record.target)
                ) {
                  return true;
                }
                continue;
              }

              return true;
            }
            return false;
          }
          ''')

          replace(
              'apps/extension/src/content/mutation-rescan-policy.test.ts',
              '''  it("always rescans structural child-list changes", () => {\n    const root = document.createElement("div");\n    expect(shouldRescanFromMutations([childRecord(root)])).toBe(true);\n  });\n''',
              '''  it("ignores structural child-list records with no application controls", () => {\n    const root = document.createElement("div");\n    expect(shouldRescanFromMutations([childRecord(root)])).toBe(false);\n  });\n''',
          )

          p = Path('apps/extension/src/content/mutation-rescan-policy.runtime.test.ts')
          text = p.read_text()
          if not text.startswith('// @vitest-environment jsdom'):
              p.write_text('// @vitest-environment jsdom\n\n' + text)

          replace(
              'apps/extension/src/content/fill.test.ts',
              '    expect(click).toHaveBeenCalledTimes(1);\n',
              '    expect(click).not.toHaveBeenCalled();\n',
          )
          PY

      - name: Format patched source
        run: |
          ./node_modules/.bin/prettier --write apps packages

      - name: Full repository verification
        run: npm run check

      - name: Commit verified 0.2.9 source only
        shell: bash
        run: |
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add apps packages
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: harden Edge runtime detection and scan performance"
          git push origin HEAD:feat/v3-foundation-alignment
