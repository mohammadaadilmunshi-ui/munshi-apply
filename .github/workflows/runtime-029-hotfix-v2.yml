name: Temporary 0.2.9 runtime hotfix v2

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/runtime-029-hotfix-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse evidence-based 0.2.9 patch definition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/runtime-029-hotfix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Could not locate canonical 0.2.9 patch block')
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/munshi_029_patch.py').write_text(textwrap.dedent(block))
          PY
          python3 /tmp/munshi_029_patch.py

          # Reconcile the exact guard/test failures found by the first two full
          # verification passes. These keep the evidence-based runtime behavior
          # while preserving strong metadata and relevant visibility rescans.
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected reconciliation text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Lint-only regex correction.
          p = Path('packages/semantic-engine/src/index.ts')
          text = p.read_text().replace(r'[\*✱＊]+', r'[*✱＊]+')
          # "Location" is intentionally left generic so strong metadata such as
          # postalCode can win. The real Lever label is "Current location".
          text = text.replace(
              r'pattern: /^(current location|location)$/i,',
              r'pattern: /^current location$/i,',
          )
          p.write_text(text)

          # Keep relevant ancestor visibility/class changes observable, but stop
          # unconditional text/status child-list churn from rescanning the page.
          replace(
              'apps/extension/src/content/mutation-rescan-policy.ts',
              '''      if (attribute === "hidden" || attribute === "aria-hidden") {\n        if (\n          elementIsApplicationRelevant(record.target) ||\n          elementContainsApplicationControl(record.target)\n        ) {\n          return true;\n        }\n        continue;\n      }\n\n      // Class/style churn on a large ancestor is common on ATS pages and\n      // should not continuously rescan the entire document. Direct control\n      // changes remain observable.\n      if (attribute === "class" || attribute === "style") {\n        if (elementIsApplicationRelevant(record.target)) return true;\n        continue;\n      }\n\n      if (elementIsApplicationRelevant(record.target)) return true;\n''',
              '''      if (attribute === "hidden" || attribute === "aria-hidden") {\n        return true;\n      }\n\n      // Class/style churn is relevant when the changed node is itself a\n      // control or contains an application control. Decorative churn elsewhere\n      // remains ignored.\n      if (attribute === "class" || attribute === "style") {\n        if (\n          elementIsApplicationRelevant(record.target) ||\n          elementContainsApplicationControl(record.target)\n        ) {\n          return true;\n        }\n        continue;\n      }\n\n      // The observer's remaining attribute filter is semantic/validation state;\n      // preserve the existing rescan guarantee for those mutations.\n      return true;\n''',
          )

          # Existing test now describes the narrowed structural policy.
          replace(
              'apps/extension/src/content/mutation-rescan-policy.test.ts',
              '''  it("always rescans structural child-list changes", () => {\n    const root = document.createElement("div");\n    expect(shouldRescanFromMutations([childRecord(root)])).toBe(true);\n  });\n''',
              '''  it("ignores structural child-list records with no application controls", () => {\n    const root = document.createElement("div");\n    expect(shouldRescanFromMutations([childRecord(root)])).toBe(false);\n  });\n''',
          )

          # New browser-shaped mutation test needs jsdom.
          p = Path('apps/extension/src/content/mutation-rescan-policy.runtime.test.ts')
          text = p.read_text()
          if not text.startswith('// @vitest-environment jsdom'):
              p.write_text('// @vitest-environment jsdom\n\n' + text)

          # The cross-context programmatic click is precisely the Edge behavior
          # being removed; only the on-page owner button may open the chooser.
          replace(
              'apps/extension/src/content/fill.test.ts',
              '    expect(click).toHaveBeenCalledTimes(1);\n',
              '    expect(click).not.toHaveBeenCalled();\n',
          )
          PY

      - name: Format patched source
        run: |
          ./node_modules/.bin/prettier --write apps packages

      - name: Full repository verification
        run: npm run check

      - name: Commit verified 0.2.9 source only
        shell: bash
        run: |
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add apps packages
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: harden Edge runtime detection and scan performance"
          git push origin HEAD:feat/v3-foundation-alignment
