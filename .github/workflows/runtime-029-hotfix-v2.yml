name: Temporary 0.2.9 runtime hotfix v2

on:
  push:
    branches: [feat/v3-foundation-alignment]
    paths: [.github/workflows/runtime-029-hotfix-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reuse evidence-based 0.2.9 patch definition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/runtime-029-hotfix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Format changed files"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Could not locate canonical 0.2.9 patch block')
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          Path('/tmp/munshi_029_patch.py').write_text(textwrap.dedent(block))
          PY
          python3 /tmp/munshi_029_patch.py

          # Correct the one lint-only escape discovered by the first verification.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/semantic-engine/src/index.ts')
          text = p.read_text()
          text = text.replace(r'[\*✱＊]+', r'[*✱＊]+')
          p.write_text(text)
          PY

      - name: Format patched source
        run: |
          ./node_modules/.bin/prettier --write apps packages

      - name: Full repository verification
        run: npm run check

      - name: Commit verified 0.2.9 source only
        shell: bash
        run: |
          git config user.name "Aadil Munshi"
          git config user.email "mohammadaadilmunshi@gmail.com"
          git add apps packages
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: harden Edge runtime detection and scan performance"
          git push origin HEAD:feat/v3-foundation-alignment
