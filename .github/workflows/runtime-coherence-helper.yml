name: Runtime coherence helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Guard repair inputs
        run: |
          test -f scripts/fix-runtime-coherence.py
          test -f .github/workflows/runtime-coherence-helper.yml
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e './apps/native-host[dev]'
      - name: Apply runtime coherence repair
        run: python scripts/fix-runtime-coherence.py
      - name: Format patched files
        run: |
          chmod +x scripts/update-local-runtime.sh
          npm run format
          python -m ruff format \
            apps/native-host/src/munshi_apply_native/native_messaging.py \
            apps/native-host/tests/test_native_messaging.py
      - name: Verify Prettier
        run: npm run format:check
      - name: Verify ESLint
        run: npm run lint
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify JS and TS tests
        run: npm test
      - name: Verify production build
        run: npm run build
      - name: Verify extension artifacts
        run: npm run verify
      - name: Verify secret scan
        run: npm run secret:scan
      - name: Verify native Ruff
        run: python -m ruff check apps/native-host
      - name: Verify native tests
        run: python -m pytest apps/native-host
      - name: Verify local updater shell
        run: bash -n scripts/update-local-runtime.sh
      - name: Remove temporary helper files
        run: git rm -f scripts/fix-runtime-coherence.py .github/workflows/runtime-coherence-helper.yml
      - name: Commit clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/index.ts \
            apps/native-host/src/munshi_apply_native/native_messaging.py \
            apps/native-host/tests/test_native_messaging.py \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/messaging/native-runtime.test.ts \
            apps/extension/src/storage/profile-sync.ts \
            apps/extension/src/storage/profile-sync.test.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/sidepanel/App.tsx \
            apps/extension/src/sidepanel/AIControlCenter.tsx \
            apps/extension/src/sidepanel/styles.css \
            scripts/update-local-runtime.sh \
            docs/reports/RUNTIME_COHERENCE_AND_PROFILE_CONFLICT_REPAIR_2026-08-15.md
          git diff --cached --check
          git commit -m "fix: restore runtime and profile sync coherence"
          git push origin HEAD:feat/v3-foundation-alignment
