name: Runtime state gate helper

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Guard repair inputs
        run: |
          test -f scripts/fix-runtime-state-gates.py
          test -f .github/workflows/runtime-state-gate-helper.yml
          test "$(git status --porcelain | wc -l | tr -d ' ')" = "0"
      - name: Install dependencies
        run: npm ci
      - name: Apply runtime state repairs
        run: python3 scripts/fix-runtime-state-gates.py
      - name: Format patched files
        run: |
          npx prettier --write \
            packages/contracts/src/index.ts \
            packages/application-model/src/application-detection.test.ts \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/sidepanel/App.tsx \
            apps/extension/src/sidepanel/styles.css
      - name: Verify full extension and shared packages
        run: npm run check
      - name: Remove temporary helper files
        run: git rm -f scripts/fix-runtime-state-gates.py .github/workflows/runtime-state-gate-helper.yml
      - name: Commit clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/contracts/src/index.ts \
            packages/application-model/src/application-detection.test.ts \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/background/service-worker.ts \
            apps/extension/src/sidepanel/App.tsx \
            apps/extension/src/sidepanel/styles.css
          git diff --cached --check
          git commit -m "fix: separate application and profile review state"
          git push origin HEAD:feat/v3-foundation-alignment
