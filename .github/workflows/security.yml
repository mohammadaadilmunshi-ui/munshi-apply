name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run secret:scan
      - run: ./scripts/repository-safety.sh
      - run: npm audit --audit-level=high
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --local
