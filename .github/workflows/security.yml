name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run secret:scan
      - run: ./scripts/repository-safety.sh
      # Runtime/shipped dependencies must have no high-or-critical advisories.
      - name: Audit shipped npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --omit=dev --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -Eqi               '503 Service Unavailable|maintenance|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi
            exit "$status"
          done
          exit 1
      # Keep critical findings in the full development/tooling tree release-blocking.
      # High/moderate dev-tool advisories remain visible in the normal audit output
      # and Dependabot, but do not block a runtime-only dashboard release.
      - name: Audit full npm tree for critical advisories
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --audit-level=critical 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s' "$output" | grep -Eqi               '503 Service Unavailable|maintenance|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi
            fi
            exit "$status"
          done
          exit 1
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --local
