name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run secret:scan
      - run: ./scripts/repository-safety.sh
      # Runtime/shipped dependencies must have no high-or-critical advisories.
      # If npm's advisory API is temporarily unavailable during a pull request,
      # tolerate that outage only when dependency manifests are byte-for-byte
      # unchanged from the PR base. Real advisory failures always block.
      - name: Audit npm dependency trees
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          audit_with_guard() {
            local label="$1"
            shift
            local attempt output status transient=0
            for attempt in 1 2 3; do
              set +e
              output="$(npm audit "$@" 2>&1)"
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if printf '%s' "$output" | grep -Eqi \
                '503 Service Unavailable|maintenance|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
                transient=1
                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 5))
                  continue
                fi
                break
              fi
              return "$status"
            done

            if [ "$transient" -eq 1 ] && [ -n "${PR_BASE_SHA:-}" ]; then
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
              changed="$(
                git diff --name-only "$PR_BASE_SHA" HEAD -- |
                  grep -E '(^|/)package(-lock)?\.json$' || true
              )"
              if [ -z "$changed" ]; then
                echo "::warning::${label}: npm advisory API unavailable; dependency manifests are unchanged from PR base."
                return 0
              fi
              printf 'Dependency files changed while npm audit is unavailable:\n%s\n' "$changed" >&2
            fi
            return 1
          }

          audit_with_guard "runtime dependency audit" --omit=dev --audit-level=high
          audit_with_guard "full dependency audit" --audit-level=critical
      - run: python -m pip install pip-audit
      - run: python -m pip_audit --local
