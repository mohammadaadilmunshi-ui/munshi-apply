name: Staging candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e './apps/native-host[dev]'

      - name: Verify complete application loop and guarded submission invariants
        run: >-
          python -m pytest -q
          apps/native-host/tests/test_complete_application_loop.py
          apps/native-host/tests/test_application_plan_handoff_v2.py
          apps/native-host/tests/test_synthetic_submission_verification_v1.py
          apps/native-host/tests/test_synthetic_submit_execution_v1.py
          apps/native-host/tests/test_synthetic_submit_command_inbox.py
          apps/native-host/tests/test_operations.py

      - name: Build release artifacts
        run: npm run build

      - name: Verify extension artifacts
        run: npm run verify

      - name: Package release candidate
        run: |
          rm -rf /tmp/munshi-staging-candidate
          python scripts/release-ops.py \
            --version v0.2.0 \
            --output /tmp/munshi-staging-candidate
          (cd /tmp/munshi-staging-candidate && sha256sum -c checksums.sha256)

      - name: Verify install path without mutation
        run: ./scripts/install.sh --dry-run

      - name: Verify rollback path without mutation
        run: ./scripts/rollback.sh HEAD --dry-run

      - uses: actions/upload-artifact@v7
        with:
          name: staging-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/munshi-staging-candidate
          if-no-files-found: error
          retention-days: 7
