name: Guarded final Tasks 1-5 repair
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore typed Teach API and format final endurance gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("apps/extension/src/messaging/client.ts")
          source = path.read_text()
          if source.count("export async function beginTeach(input:") != 1:
              raise SystemExit("generic beginTeach guard failed")
          if "export async function beginTeachMunshi(" in source:
              raise SystemExit("typed Teach API already present; refusing duplicate patch")

          anchor = dedent('''\
          export async function beginTeach(input: {
            frameId: number;
            controlId: string;
            applicationId: string;
          }): Promise<unknown> {
          ''')
          if source.count(anchor) != 1:
              raise SystemExit("Teach insertion anchor did not match exactly once")

          compatibility = dedent('''\
          export type TeachMunshiStart = {
            sessionId: string;
            controlId: string;
            label: string;
            componentFingerprint: string;
            startedAt: string;
          };

          export type TeachMunshiResult = {
            sessionId: string;
            controlId: string;
            changed: boolean;
            reusable: boolean;
            eventTypes: string[];
            eventSequence?: { type: string; target: string; atMs: number }[];
            beforeState?: Record<string, unknown>;
            afterState?: Record<string, unknown>;
            quality?: { score: number; reasons: string[]; valueCommitted: boolean };
            recipe: null | {
              recipeId: string;
              state: "SHADOW" | "PROMOTED" | "ROLLED_BACK";
              version: number;
              verifiedAttempts?: number;
              verifiedSuccesses?: number;
            };
          };

          export async function beginTeachMunshi(
            frameId: number,
            controlId: string,
            applicationId: string,
          ): Promise<TeachMunshiStart> {
            return (await send({
              type: "TEACH_BEGIN",
              payload: { frameId, controlId, applicationId },
            })) as TeachMunshiStart;
          }

          export async function finishTeachMunshi(
            frameId: number,
            sessionId: string,
            applicationId: string,
          ): Promise<TeachMunshiResult> {
            return (await send({
              type: "TEACH_FINISH",
              payload: { frameId, sessionId, applicationId },
            })) as TeachMunshiResult;
          }

          export async function cancelTeachMunshi(
            frameId: number,
            sessionId: string,
          ): Promise<void> {
            await send({ type: "TEACH_CANCEL", payload: { frameId, sessionId } });
          }

          ''')
          path.write_text(source.replace(anchor, compatibility + anchor, 1))
          PY
          npx prettier \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/content/ats-endurance.test.ts \
            --write
          npx prettier --check \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/content/ats-endurance.test.ts
          MUNSHI_PERF_STRICT=1 ./node_modules/.bin/vitest run apps/extension/src/content/ats-endurance.test.ts
          ./node_modules/.bin/vitest run apps/extension/src/background/autopilot-navigation-safety.integration.test.ts
          npm run build
          git diff --check
          git rm .github/workflows/task1-5-final-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/extension/src/messaging/client.ts \
            apps/extension/src/content/ats-endurance.test.ts
          git commit -m "fix: restore Teach API and format endurance gate"
          git fetch origin feat/v3-foundation-alignment
          git rebase origin/feat/v3-foundation-alignment
          git push origin HEAD:feat/v3-foundation-alignment
