name: Guarded application analytics native patch
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch native analytics integration with exact-match guards
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          store = Path("apps/native-host/src/munshi_apply_native/application_analytics_store.py")
          text = store.read_text()
          helper_anchor = '''def _optional_label(value: object, label: str) -> str | None:\n    if value is None:\n        return None\n    if not isinstance(value, str):\n        raise ValueError(f"{label} must be a string or null")\n    normalized = value.strip()\n    if not normalized:\n        return None\n    if len(normalized) > 200:\n        raise ValueError(f"{label} is too long")\n    return normalized\n\n\n'''
          helper = helper_anchor + '''def _ensure_application(connection: Any, application_id: str, observed_at: str) -> None:\n    connection.execute(\n        """\n        INSERT OR IGNORE INTO applications (\n            application_id, job_id, status, resume_id, job_signal_score,\n            submitted_at, created_at, updated_at\n        ) VALUES (?, NULL, 'DETECTED', NULL, NULL, NULL, ?, ?)\n        """,\n        (application_id, observed_at, observed_at),\n    )\n\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit("analytics helper insertion guard failed")
          text = text.replace(helper_anchor, helper, 1)
          target = '''            connection.execute("BEGIN IMMEDIATE")\n            existing = connection.execute(\n'''
          if text.count(target) != 3:
              raise SystemExit(f"expected 3 analytics transaction guards, got {text.count(target)}")
          replacements = [
              '''            connection.execute("BEGIN IMMEDIATE")\n            _ensure_application(connection, application_id, occurred_at)\n            existing = connection.execute(\n''',
              '''            connection.execute("BEGIN IMMEDIATE")\n            _ensure_application(connection, application_id, captured_at)\n            existing = connection.execute(\n''',
              '''            connection.execute("BEGIN IMMEDIATE")\n            _ensure_application(connection, application_id, occurred_at)\n            existing = connection.execute(\n''',
          ]
          for replacement in replacements:
              text = text.replace(target, replacement, 1)
          store.write_text(text)

          messaging = Path("apps/native-host/src/munshi_apply_native/native_messaging.py")
          text = messaging.read_text()
          import_anchor = 'from .application_store import ApplicationStore\n'
          if text.count(import_anchor) != 1:
              raise SystemExit("native analytics import guard failed")
          text = text.replace(
              import_anchor,
              'from .application_analytics_store import ApplicationAnalyticsStore\n' + import_anchor,
              1,
          )
          capability_anchor = '    "job_signal_intelligence": True,\n'
          if text.count(capability_anchor) != 1:
              raise SystemExit("native analytics capability guard failed")
          text = text.replace(
              capability_anchor,
              capability_anchor + '    "application_analytics": True,\n',
              1,
          )
          handler_anchor = '''    if message_type == "GET_LATEST_JOB_SIGNAL_REPORT":\n        application_id = job_signal_lookup_application_id(message)\n        return {\n            "ok": True,\n            "data": JobSignalStore(database).latest(application_id),\n        }\n'''
          handlers = handler_anchor + '''    if message_type == "RECORD_APPLICATION_ANALYTICS_EVENT":\n        created = ApplicationAnalyticsStore(database).record_event(message.get("payload"))\n        return {"ok": True, "data": {"created": created}}\n    if message_type == "RECORD_APPLICATION_ATTRIBUTION_CONTEXT":\n        created = ApplicationAnalyticsStore(database).record_context(message.get("payload"))\n        return {"ok": True, "data": {"created": created}}\n    if message_type == "RECORD_APPLICATION_OUTCOME":\n        created = ApplicationAnalyticsStore(database).record_outcome(message.get("payload"))\n        return {"ok": True, "data": {"created": created}}\n    if message_type == "GET_APPLICATION_ANALYTICS_SNAPSHOT":\n        return {"ok": True, "data": ApplicationAnalyticsStore(database).snapshot()}\n'''
          if text.count(handler_anchor) != 1:
              raise SystemExit("native analytics handler guard failed")
          messaging.write_text(text.replace(handler_anchor, handlers, 1))
          PY
          python -m pip install -e './apps/native-host[dev]'
          python -m ruff format \
            apps/native-host/src/munshi_apply_native/application_analytics_store.py \
            apps/native-host/src/munshi_apply_native/native_messaging.py
          python -m ruff check \
            apps/native-host/src/munshi_apply_native/application_analytics_store.py \
            apps/native-host/src/munshi_apply_native/native_messaging.py
          git diff --check
          git rm .github/workflows/task5-native-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/native-host/src/munshi_apply_native/application_analytics_store.py \
            apps/native-host/src/munshi_apply_native/native_messaging.py
          git commit -m "feat: wire durable application analytics messaging"
          git push origin HEAD:feat/v3-foundation-alignment
