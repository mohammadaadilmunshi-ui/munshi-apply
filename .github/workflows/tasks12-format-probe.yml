name: Tasks 1-2 format probe
on:
  push:
    branches: [feat/v3-foundation-alignment]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show canonical Prettier diff
        run: |
          npx prettier \
            apps/extension/src/background/autopilot-navigation-safety.integration.test.ts \
            apps/extension/src/background/forward-navigation-safety.ts \
            apps/extension/src/content/ats-endurance.test.ts \
            apps/extension/src/content/mutation-rescan-policy.test.ts \
            apps/extension/src/content/mutation-rescan-policy.ts \
            --write
          git diff -- \
            apps/extension/src/background/autopilot-navigation-safety.integration.test.ts \
            apps/extension/src/background/forward-navigation-safety.ts \
            apps/extension/src/content/ats-endurance.test.ts \
            apps/extension/src/content/mutation-rescan-policy.test.ts \
            apps/extension/src/content/mutation-rescan-policy.ts
