name: Temporary reliability formatter

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format reliability tranche and restore normal check
        run: |
          npx prettier --write \
            apps/extension/src/content/owner-reliability.ts \
            apps/extension/src/sidepanel/native-health-stabilizer.ts \
            apps/extension/src/sidepanel/reliability-core.test.ts \
            apps/extension/src/sidepanel/reliability.ts
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.scripts['format:check'] = 'prettier --check .';
          await writeFile(path, `${JSON.stringify(pkg, null, 2)}\n`, 'utf8');
          NODE
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            apps/extension/src/content/owner-reliability.ts \
            apps/extension/src/sidepanel/native-health-stabilizer.ts \
            apps/extension/src/sidepanel/reliability-core.test.ts \
            apps/extension/src/sidepanel/reliability.ts
          if git diff --cached --quiet; then
            echo "No formatter changes needed."
          else
            git commit -m "style: format reliability tranche"
            git push origin HEAD:feat/v3-foundation-alignment
          fi
