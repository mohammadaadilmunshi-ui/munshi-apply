name: Temporary reliability lint fix

on:
  push:
    branches:
      - feat/v3-foundation-alignment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/v3-foundation-alignment
      - name: Remove diagnosed unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/extension/src/sidepanel/reliability.ts')
          text = path.read_text()
          text = text.replace('import { isEligibleApplicationPage } from "@munshi-apply/application-model";\n', '', 1)
          path.write_text(text)
          PY
      - name: Commit diagnosed lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/src/sidepanel/reliability.ts
          if git diff --cached --quiet; then
            echo "No lint fix needed."
          else
            git commit -m "fix: remove unused reliability import"
            git push origin HEAD:feat/v3-foundation-alignment
          fi
