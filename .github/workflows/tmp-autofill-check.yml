name: Temporary AutoFill check

on:
  push:
    branches:
      - tmp/autofill-safe-progress

permissions:
  contents: read

jobs:
  extension-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
