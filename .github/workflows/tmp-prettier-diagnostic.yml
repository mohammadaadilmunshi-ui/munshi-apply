name: Temporary Prettier diagnostic

on:
  push:
    branches:
      - tmp/autofill-safe-progress

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: |
          npx prettier --write apps/extension/src/sidepanel/AutoPilotControlCenter.tsx
          git diff -- apps/extension/src/sidepanel/AutoPilotControlCenter.tsx
