[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "munshi-apply-native"
version = "0.1.0"
description = "Local persistence and integration companion for MUNSHI Apply."
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
munshi-apply-native = "munshi_apply_native.native_messaging:main"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_apply_native"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
