[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "munshi-apply-native"
version = "0.1.0"
description = "Local persistence and integration companion for MUNSHI Apply."
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pypdf>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "playwright>=1.55,<2",
]

[project.scripts]
munshi-apply-native = "munshi_apply_native.native_messaging:main"
munshi-apply-hosted-trust-worker = "munshi_apply_native.hosted_trust_worker:main"
munshi-apply-hosted-submit-worker = "munshi_apply_native.hosted_submit_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/munshi_apply_native"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "UP037"]

[tool.ruff.lint.per-file-ignores]
"src/munshi_apply_native/account_credential_resolver.py" = ["E501", "I001"]
"src/munshi_apply_native/account_native_messages.py" = ["E501", "I001"]
"src/munshi_apply_native/account_teach_service.py" = ["E501", "I001", "S608"]
"src/munshi_apply_native/ats_account_lifecycle.py" = ["E501", "I001"]
"tests/browser/test_real_hunter_bridge_cover_prepare_chrome.py" = ["E501", "F401", "I001", "S608"]
"tests/test_account_teach_service.py" = ["E501", "I001"]
"tests/test_ats_account_lifecycle.py" = ["E501", "I001"]
"tests/test_database.py" = ["I001"]
"tests/test_synthetic_submission_verification_v1.py" = ["I001"]
"tests/test_synthetic_submit_execution_v1.py" = ["I001"]
