<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MUNSHI Greenhouse Fixture</title>
  </head>
  <body>
    <main>
      <h1>People Analytics Specialist</h1>
      <p>MUNSHI Synthetic Employer</p>
      <form
        id="application-form"
        action="/munshi-fixture/applications"
        method="post"
      >
        <div>
          <label for="first_name">First name</label
          ><input id="first_name" name="first_name" type="text" required />
        </div>
        <div>
          <label for="last_name">Last name</label
          ><input id="last_name" name="last_name" type="text" required />
        </div>
        <div>
          <label for="resume">Resume</label
          ><input
            id="resume"
            name="resume"
            type="file"
            accept=".pdf,application/pdf"
            required
          />
        </div>
        <button id="submit-app" type="submit">Submit application</button>
      </form>
      <div id="application_confirmation" hidden>
        Your application has been submitted.
      </div>
      <script>
        document
          .getElementById("application-form")
          .addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
              await fetch("/munshi-fixture/applications", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ job_id: "fixture-job-001" }),
              });
            } finally {
              document.getElementById("application-form").hidden = true;
              document.getElementById("application_confirmation").hidden =
                false;
            }
          });
      </script>
    </main>
  </body>
</html>
