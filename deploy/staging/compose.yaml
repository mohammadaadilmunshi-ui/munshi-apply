services:
  apply:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      args:
        MUNSHI_APPLY_COMMIT_SHA: ${MUNSHI_APPLY_DEPLOY_SHA:?MUNSHI_APPLY_DEPLOY_SHA is required}

    image: ${MUNSHI_APPLY_IMAGE_REPOSITORY:?MUNSHI_APPLY_IMAGE_REPOSITORY is required}:${MUNSHI_APPLY_IMAGE_TAG:-local}

    restart: unless-stopped

    environment:
      MUNSHI_RUNTIME_ROOT: /data
      MUNSHI_DATABASE_PATH: /data/munshi-apply.sqlite
      MUNSHI_MIGRATIONS_PATH: /app/migrations
      MUNSHI_BROWSER_EXECUTABLE: /usr/bin/chromium
      MUNSHI_ENVIRONMENT: "${MUNSHI_ENVIRONMENT:?MUNSHI_ENVIRONMENT is required}"

      MUNSHI_APPLY_LIVE_HANDOFF_ENABLED: "${MUNSHI_APPLY_LIVE_HANDOFF_ENABLED:-false}"
      MUNSHI_APPLY_HANDOFF_HMAC_SECRET: "${MUNSHI_APPLY_HANDOFF_HMAC_SECRET:-}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL:-}"
      MUNSHI_APPLY_HOSTED_PREPARE_WORKER_ENABLED: "${MUNSHI_APPLY_HOSTED_PREPARE_WORKER_ENABLED:-false}"
      MUNSHI_APPLY_RESUME_UPLOAD_ENABLED: "${MUNSHI_APPLY_RESUME_UPLOAD_ENABLED:-false}"
      MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED: "${MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED:-false}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED:-false}"

      MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED: "${MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED:-false}"
      MUNSHI_FINAL_REVIEW_ENABLED: "false"
      MUNSHI_FINAL_SUBMIT_ENABLED: "false"

    ports:
      - "${MUNSHI_APPLY_BIND_HOST:?MUNSHI_APPLY_BIND_HOST is required}:${MUNSHI_APPLY_PUBLISHED_PORT:?MUNSHI_APPLY_PUBLISHED_PORT is required}:8000"

    networks:
      default:
      hunter_staging:
        aliases:
          - apply

    volumes:
      - apply_data:/data

    shm_size: "1gb"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  prepare-worker:
    profiles: ["hosted-prepare"]
    image: ${MUNSHI_APPLY_IMAGE_REPOSITORY:?MUNSHI_APPLY_IMAGE_REPOSITORY is required}:${MUNSHI_APPLY_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      apply:
        condition: service_healthy
    command: ["python", "-m", "munshi_apply_native.hosted_prepare_worker"]
    environment:
      MUNSHI_RUNTIME_ROOT: /data
      MUNSHI_DATABASE_PATH: /data/munshi-apply.sqlite
      MUNSHI_MIGRATIONS_PATH: /app/migrations
      MUNSHI_BROWSER_EXECUTABLE: /usr/bin/chromium
      MUNSHI_APPLY_HANDOFF_HMAC_SECRET: "${MUNSHI_APPLY_HANDOFF_HMAC_SECRET:-}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL:-}"
      MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED: "${MUNSHI_APPLY_BACKGROUND_PREPARE_ENABLED:-false}"
      MUNSHI_APPLY_HOSTED_PREPARE_WORKER_ENABLED: "${MUNSHI_APPLY_HOSTED_PREPARE_WORKER_ENABLED:-false}"
      MUNSHI_APPLY_RESUME_UPLOAD_ENABLED: "${MUNSHI_APPLY_RESUME_UPLOAD_ENABLED:-false}"
      MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED: "${MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED:-false}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED:-false}"
      MUNSHI_ENVIRONMENT: "${MUNSHI_ENVIRONMENT:?MUNSHI_ENVIRONMENT is required}"
      MUNSHI_FINAL_REVIEW_ENABLED: "false"
      MUNSHI_FINAL_SUBMIT_ENABLED: "false"
    networks:
      hunter_staging:
    volumes:
      - apply_data:/data
    shm_size: "1gb"

  # Controlled proof only. This service is absent unless the
  # `hosted-submit-proof` profile is selected, and every irreversible gate
  # below still defaults to false. It deliberately does not auto-restart.
  submit-worker:
    profiles: ["hosted-submit-proof"]
    image: ${MUNSHI_APPLY_IMAGE_REPOSITORY:?MUNSHI_APPLY_IMAGE_REPOSITORY is required}:${MUNSHI_APPLY_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      apply:
        condition: service_healthy
    command: ["python", "-m", "munshi_apply_native.hosted_submit_worker"]
    environment:
      MUNSHI_RUNTIME_ROOT: /data
      MUNSHI_DATABASE_PATH: /data/munshi-apply.sqlite
      MUNSHI_MIGRATIONS_PATH: /app/migrations
      MUNSHI_BROWSER_EXECUTABLE: /usr/bin/chromium
      MUNSHI_ENVIRONMENT: "${MUNSHI_ENVIRONMENT:?MUNSHI_ENVIRONMENT is required}"
      MUNSHI_APPLY_HANDOFF_HMAC_SECRET: "${MUNSHI_APPLY_HANDOFF_HMAC_SECRET:-}"
      MUNSHI_PRODUCTION_RECEIPT_HMAC_SECRET: "${MUNSHI_PRODUCTION_RECEIPT_HMAC_SECRET:-}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_BASE_URL:-}"
      MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED: "${MUNSHI_HUNTER_EXECUTION_BRIDGE_STAGING_HTTP_ENABLED:-false}"
      MUNSHI_APPLY_SUBMIT_POLL_SECONDS: "${MUNSHI_APPLY_SUBMIT_POLL_SECONDS:-1}"
      MUNSHI_APPLY_HOSTED_SUBMIT_WORKER_ENABLED: "${MUNSHI_APPLY_HOSTED_SUBMIT_WORKER_ENABLED:-false}"
      MUNSHI_FINAL_REVIEW_ENABLED: "${MUNSHI_FINAL_REVIEW_ENABLED:-false}"
      MUNSHI_FINAL_SUBMIT_ENABLED: "${MUNSHI_FINAL_SUBMIT_ENABLED:-false}"
      MUNSHI_APPLY_PRODUCTION_SUBMIT_AUTHORITY_ENABLED: "${MUNSHI_APPLY_PRODUCTION_SUBMIT_AUTHORITY_ENABLED:-false}"
      MUNSHI_APPLY_RESUME_UPLOAD_ENABLED: "${MUNSHI_APPLY_RESUME_UPLOAD_ENABLED:-false}"
      MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED: "${MUNSHI_APPLY_NORMAL_ANSWER_AUTOFILL_ENABLED:-false}"
    networks:
      hunter_staging:
    volumes:
      - apply_data:/data
    shm_size: "1gb"

networks:
  hunter_staging:
    external: true
    name: ${MUNSHI_HUNTER_NETWORK_NAME:?MUNSHI_HUNTER_NETWORK_NAME is required}

volumes:
  apply_data:
